<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>«Мой каток» — выбор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Golos+Text:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E70}a:hover{color:#073C3E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f5f7f8; font-family: 'Golos Text', -apple-system, 'Segoe UI', sans-serif; color: #0d1b26">
  <div style="position: absolute; inset: 0; background: rgba(13, 27, 38, .48)"></div>

  <!-- Шаг 1. На шаге 2 содержимое шторки меняется, вторая шторка не открывается. -->
  <sc-if value="{{notStep2}}" hint-placeholder-val="{{true}}">
  <section role="dialog" aria-modal="true" aria-labelledby="rinkTitle" style="position: absolute; left: 0; right: 0; bottom: 0; height: 744px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: 24px 24px 0 0; padding: 10px 16px 20px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #c9d5dc"></div>

    <h2 id="rinkTitle" style="margin: 18px 0 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 24px; line-height: 1.15">Где катаешься чаще всего?</h2>
    <p style="margin: 8px 0 0; font-size: 14px; color: #5d7285">Покажем его сеансы в&nbsp;«Я».</p>

    <label style="margin-top: 14px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 14px; background: #eef2f4; color: #5d7285">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.9-3.9"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Найти каток</span>
      <input type="search" placeholder="Название катка" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 16px 'Golos Text', sans-serif; color: #0d1b26; outline: none">
    </label>

    <div style="flex: 1; min-height: 0; overflow: auto; margin: 6px -16px 0; padding: 0 16px">
      <h3 style="margin: 12px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5d7285">Минск</h3>
      <sc-for list="{{rinks}}" as="r" hint-placeholder-count="6">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 62px; border-bottom: 1px solid #e1e8ec; cursor: pointer">
          <span style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: {{r.tile}}; display: flex; align-items: center; justify-content: center; color: {{r.tileInk}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15h11.5c1.5 0 2.5-.8 2.5-2V6h-4v4l-3 1.2c-1.2.5-2 1.6-2 2.8"/><path d="M3 19h17"/></svg>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-weight: 600; font-size: 16px">{{r.name}}</span>
            <span style="font-size: 13px; color: #5d7285">{{r.sub}}</span>
          </span>
          <input type="radio" name="rink" checked="{{r.checked}}" onChange="{{r.pick}}" style="width: 22px; height: 22px; margin: 0; accent-color: #0B6E70">
        </label>
      </sc-for>
    </div>

    <button type="button" onClick="{{choose}}" style="margin-top: 12px; height: 52px; border: 0; border-radius: 14px; background: {{doneBg}}; color: {{doneInk}}; font: 700 16px 'Golos Text', sans-serif">{{doneLabel}}</button>
  </section>
  </sc-if>
  <!-- Шаг 2: каток выбран — предлагаем подписку на расписание. Уже подписан — шага нет. -->
  <sc-if value="{{step2}}" hint-placeholder-val="{{false}}">
    <section role="dialog" aria-modal="true" aria-labelledby="bellTitle" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 16px 22px; background: #ffffff; border-radius: 24px 24px 0 0; text-align: center; ">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: #c9d5dc"></div>
      <span style="margin-top: 16px; width: 64px; height: 64px; border-radius: 20px; background: #D3EFEF; display: flex; align-items: center; justify-content: center; color: #0B6E70">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      </span>
      <h2 id="bellTitle" style="margin: 8px 0 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 22px; line-height: 1.15">{{chosenName}} — твой каток</h2>
      <p style="margin: 0; font-size: 15px; color: #4a5f71">Писать в&nbsp;Telegram, когда каток выложит новое расписание?</p>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 10px">
        <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #45B9BB; color: #04262A; font-weight: 700; font-size: 16px; text-decoration: none">Да, писать</a>
        <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #4a5f71; font-weight: 600; font-size: 15px; text-decoration: none">Не надо</a>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'chizh', step2: false };
  }
  renderVals() {
    var self = this;
    var picked = this.state.picked;
    var list = [
      { id: 'chizh', name: '«Чижовка-арена»', sub: 'сегодня ещё 2 сеанса' },
      { id: 'zamok', name: '«Замок»', sub: 'сегодня ещё 1 сеанс' },
      { id: 'yun', name: '«Юность»', sub: 'сегодня ещё 3 сеанса' },
      { id: 'dvor', name: 'Ледовый дворец', sub: 'сегодня сеансов нет, завтра — с 9:00' },
      { id: 'arena', name: 'Минск-Арена', sub: 'сегодня ещё 1 сеанс' },
      { id: 'konk', name: 'Конькобежный стадион', sub: 'сегодня ещё 2 сеанса' }
    ];
    var chosen = list.filter(function (r) { return r.id === picked; })[0];
    return {
      rinks: list.map(function (r) {
        var on = r.id === picked;
        return Object.assign({}, r, {
          checked: on,
          tile: on ? '#D3EFEF' : '#eef2f4',
          tileInk: on ? '#0B6E70' : '#5d7285',
          pick: function () { self.setState({ picked: r.id }); }
        });
      }),
      step2: this.state.step2,
      notStep2: !this.state.step2,
      chosenName: chosen ? chosen.name : '',
      choose: function () { if (chosen) self.setState({ step2: true }); },
      doneLabel: chosen ? 'Это мой каток' : 'Выбери каток',
      doneBg: chosen ? '#45B9BB' : '#e1e8ec',
      doneInk: chosen ? '#04262A' : '#5d7285'
    };
  }
}
</script>
</body>
</html>
