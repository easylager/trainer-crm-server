<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>«За кого болеешь?»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Golos+Text:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E70}a:hover{color:#073C3E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f5f7f8; font-family: 'Golos Text', -apple-system, 'Segoe UI', sans-serif; color: #0d1b26">
  <!-- Под шторкой — вкладка «Я», притушенная. -->
  <div style="position: absolute; inset: 0; background: rgba(13, 27, 38, .48)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="pickerTitle" style="position: absolute; left: 0; right: 0; bottom: 0; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: 24px 24px 0 0; padding: 10px 16px 24px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #c9d5dc"></div>

    <h2 id="pickerTitle" style="margin: 18px 0 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 24px; line-height: 1.15">За&nbsp;кого болеешь?</h2>
    <p style="margin: 8px 0 0; font-size: 14px; color: #5d7285">Её матчи будут первыми в&nbsp;«Кто кого».</p>

    <label style="margin-top: 16px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 14px; background: #eef2f4; color: #5d7285">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.9-3.9"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Найти команду</span>
      <input type="search" placeholder="Название команды" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 16px 'Golos Text', sans-serif; color: #0d1b26; outline: none">
    </label>

    <div style="flex: 1; min-height: 0; overflow: auto; margin: 8px -16px 0; padding: 0 16px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <h3 style="margin: 16px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #5d7285">{{g.title}}</h3>
        <sc-for list="{{g.clubs}}" as="c" hint-placeholder-count="4">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #e1e8ec; cursor: pointer">
            <span style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: {{c.color}}; box-shadow: inset 0 -5px 0 {{c.stripe}}; display: flex; align-items: center; justify-content: center; color: #ffffff; font-weight: 700; font-size: 13px">{{c.mono}}</span>
            <span style="flex: 1; min-width: 0; font-weight: 600; font-size: 16px">{{c.name}}</span>
            <input type="radio" name="club" checked="{{c.checked}}" onChange="{{c.pick}}" style="width: 22px; height: 22px; margin: 0; accent-color: #0B6E70">
          </label>
        </sc-for>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 12px">
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: {{doneBg}}; color: {{doneInk}}; font-weight: 700; font-size: 16px; text-decoration: none">{{doneLabel}}</a>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #4a5f71; font-weight: 600; font-size: 15px; text-decoration: none">Пока ни за&nbsp;кого</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'dm' };
  }
  renderVals() {
    var self = this;
    var picked = this.state.picked;
    var mk = function (c) {
      return Object.assign({}, c, {
        checked: c.id === picked,
        pick: function () { self.setState({ picked: c.id }); }
      });
    };
    var khl = [
      { id: 'dm', name: 'Динамо-Минск', city: 'Минск · КХЛ', mono: 'ДМ', color: '#0F3A78', stripe: '#C8202F' }
    ];
    var ex = [
      { id: 'yu', name: 'Юность-Минск', city: 'Минск', mono: 'Ю', color: '#5d7285', stripe: '#4a5f71' },
      { id: 'ne', name: 'Неман', city: 'Гродно', mono: 'Н', color: '#5d7285', stripe: '#4a5f71' },
      { id: 'sh', name: 'Шахтёр', city: 'Солигорск', mono: 'Ш', color: '#5d7285', stripe: '#4a5f71' },
      { id: 'go', name: 'Гомель', city: 'Гомель', mono: 'Г', color: '#5d7285', stripe: '#4a5f71' },
      { id: 'me', name: 'Металлург', city: 'Жлобин', mono: 'М', color: '#5d7285', stripe: '#4a5f71' },
      { id: 'hi', name: 'Химик', city: 'Новополоцк', mono: 'Х', color: '#5d7285', stripe: '#4a5f71' },
      { id: 'li', name: 'Лида', city: 'Лида', mono: 'Л', color: '#5d7285', stripe: '#4a5f71' }
    ];
    var all = khl.concat(ex);
    var chosen = all.filter(function (c) { return c.id === picked; })[0];
    return {
      groups: [
        { title: 'КХЛ', clubs: khl.map(mk) },
        { title: 'Экстралига', clubs: ex.map(mk) }
      ],
      doneLabel: chosen ? 'Болею за ' + chosen.name : 'Выбери команду',
      doneBg: chosen ? '#45B9BB' : '#e1e8ec',
      doneInk: chosen ? '#04262A' : '#5d7285'
    };
  }
}
</script>
</body>
</html>
