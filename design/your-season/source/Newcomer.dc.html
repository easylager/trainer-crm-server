<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>«Я» — первый день</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Golos+Text:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E70}a:hover{color:#073C3E}
</style>
</helmet>
<div style="width: 390px; height: 960px">
  <dc-import name="Main" variant="new" dark="{{dark}}" hint-size="390px,960px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { dark: this.props.dark ?? false };
  }
}
</script>
</body>
</html>
