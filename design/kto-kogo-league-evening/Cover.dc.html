<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обложка «Лига друзей»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Golos+Text:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 56px; align-items: center; padding: 72px 80px; background: #17212b; color: #f1f5f7; font-family: 'Golos Text', system-ui, sans-serif; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <div style="align-self: flex-start; transform: rotate(-4deg); background: #ffd23f; color: #0d1424; font-family: 'Dela Gothic One', sans-serif; font-size: 30px; padding: 10px 18px; border-radius: 12px">КТО КОГО?</div>
    <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 104px; line-height: 0.98">Лига<br>друзей</div>
    <div style="font-size: 30px; line-height: 1.35; color: #c3d2dc; max-width: 520px">Собери своих — и каждый вечер видно, кто угадал лучше</div>
  </div>

  <div style="transform: rotate(2deg); background: #222c38; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 24px 0 rgba(0,0,0,0.25)">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 4px 8px 12px">
      <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 26px">Вечер в лиге</div>
      <div style="font-size: 18px; color: #98adc0">4 матча</div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 8px; border-top: 1px solid #3a4756">
        <div style="width: 52px; height: 52px; border-radius: 50%; flex: none; background: {{r.avaBg}}; color: {{r.avaInk}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px">{{r.initial}}</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px">
            {{r.name}}
            <sc-if value="{{r.cap}}" hint-placeholder-val="{{false}}">
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 12px; background: #ffd23f; color: #0d1424">
                <svg width="24" height="16" viewBox="0 0 64 44" aria-hidden="true"><path d="M10 32 C10 14 20 6 32 6 C44 6 52 14 52 32 Z" fill="#0d1424"></path><path d="M30 32 H61 C62 36 58 39 51 39 H30 Z" fill="#0d1424"></path></svg>кепка дня
              </span>
            </sc-if>
          </div>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{r.dots}}" as="d" hint-placeholder-count="4">
              <div style="width: 34px; height: 10px; border-radius: 5px; background: {{d}}"></div>
            </sc-for>
          </div>
        </div>
        <div style="font-family: 'Dela Gothic One', sans-serif; font-size: 26px; color: {{r.ink}}">{{r.points}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const hit = '#ffd23f';
    const miss = '#3a4756';
    const rows = [
      { name: 'Аня', initial: 'А', points: '+100', dots: [hit, hit, miss, hit], lead: true },
      { name: 'Макс', initial: 'М', points: '+80', dots: [hit, miss, hit, hit] },
      { name: 'Саша', initial: 'С', points: '+50', dots: [hit, miss, miss, hit] },
      { name: 'Олег', initial: 'О', points: '+10', dots: [miss, hit, miss, miss], cap: true },
    ].map((r) => ({
      ...r,
      avaBg: r.lead ? '#ffd23f' : '#2c3846',
      avaInk: r.lead ? '#0d1424' : '#f1f5f7',
      ink: r.lead ? '#ffd23f' : '#f1f5f7',
    }));
    return { rows };
  }
}
</script>
</body>
</html>
