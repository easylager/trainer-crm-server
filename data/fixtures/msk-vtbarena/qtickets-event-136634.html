            (function () {
    var helper = {
        getCookie: function (name) {
            var matches = document.cookie.match(new RegExp(
                "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
            ));

            if (matches) {
                return decodeURIComponent(matches[1]);
            }

            return undefined;
        },
        setCookie: function (name, value, props) {
            props = props || {};
            var exp = props.expires;
            if (typeof exp == "number" && exp) {
                var d = new Date();
                d.setTime(d.getTime() + exp * 1000);
                exp = props.expires = d;
            }
            if (exp && exp.toUTCString) {
                props.expires = exp.toUTCString();
            }

            value = encodeURIComponent(value);
            var updatedCookie = name + "=" + value;
            for (var propName in props) {
                if (props.hasOwnProperty(propName)) {
                    updatedCookie += "; " + propName;
                    var propValue = props[propName];
                    if (propValue !== true) {
                        updatedCookie += "=" + propValue
                    }
                }
            }
            document.cookie = updatedCookie;
        },
        // Генерация 16-символьного случайного ключа: цифры, a–z, A–Z
        generateBrowserKey: function () {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let key = '';
            for (let i = 0; i < 16; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        },
        getRootQticketsDomain: function () {
            var hostname = window.location.hostname;
            var marker = ".qtickets.";
            var index = hostname.indexOf(marker);

            if (hostname.indexOf('qtickets.') === 0) {
                return hostname;
            }

            if (index === -1) {
                return hostname; // не наш домен
            }

            return hostname.slice(index + 1);
        }
    };

    var browser_key = helper.getCookie('browser_key');

    if (browser_key && browser_key.length > 16) { // очищаем старый ключ, который был более 16 символов
        helper.setCookie('browser_key', '', {expires: -1, path: '/',});
        browser_key = null;
    }

    var trigger = false;
    if (!browser_key || browser_key.length !== 16) {
        browser_key = helper.generateBrowserKey();
        if (typeof ($) === 'function') {
            trigger = true;
        }
    }

    helper.setCookie('browser_key', browser_key, {
        expires: 60 * 60 * 24 * 365 * 10,
        domain: helper.getRootQticketsDomain(),
        path: '/',
        SameSite: 'None',
        Secure: true
    });

    if (trigger) {
        $(document).trigger('onSetBrowserKey', browser_key);
    }
})();

                                console.error('SW register failed', err);
                            });
                    }
                }
            })();
        </script>
