# Local development: PostgreSQL
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trainer_crm
      POSTGRES_PASSWORD: trainer_crm_dev
      POSTGRES_DB: trainer_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
