  <script>
    /*
      Битое фото → разметка катка, как у места без фото (rink_motif_svg): герой, плитка, миниатюра.
      Слушатель в <head>: ошибка ленивой картинки может прийти раньше скриптов в конце страницы.
      error и load не всплывают — ловим на погружении.
    */
    (function () {
      function dropBrokenPhoto(e) {
        var img = e.target;
        if (!img || img.tagName !== 'IMG') return;
        if (e.type === 'load' && img.naturalWidth > 0) {
          img.classList.add('is-ready');
          return;
        }
        var box = img.closest('.b-hero, .b-tile__media, .b-card2__thumb');
        if (!box) return;
        var hero = box.classList.contains('b-hero');
        var motif = document.getElementById(hero ? 'b-motif-hero' : 'b-motif-small');
        if (motif) img.replaceWith(motif.content.cloneNode(true));
        else img.remove();
        box.classList.remove('b-toned-wrap');
        var badge = hero ? null : box.querySelector('.b-badge:not(.b-badge--time)');
        if (badge) badge.classList.add('b-badge--light');
      }
      window.addEventListener('error', dropBrokenPhoto, true);
      window.addEventListener('load', dropBrokenPhoto, true);
      document.addEventListener('DOMContentLoaded', function () {
        var imgs = document.querySelectorAll('.b-hero > img, .b-tile__media img, .b-card2__thumb img');
        for (var i = 0; i < imgs.length; i++) {
          if (imgs[i].complete && imgs[i].naturalWidth > 0) imgs[i].classList.add('is-ready');
        }
      });
    })();
  </script>

  <script>
    (function () {
      var Api = window.GlideListScrollRestore;
      if (Api && Api.wirePublicListScrollRestore) Api.wirePublicListScrollRestore(sessionStorage);

      var times = document.querySelectorAll('.b-slot__time, .b-ticket__time');
      for (var t = 0; t < times.length; t++) {
        var timeName = times[t].style.viewTransitionName || '';
        if (/^glide-s-\d+$/.test(timeName)) times[t].setAttribute('data-session-vt', timeName);
        if (timeName) times[t].style.viewTransitionName = 'none';
      }
      var keptSession = '';
      try { keptSession = sessionStorage.getItem('glide-session-vt') || ''; } catch (err) {}
      var navEntry = performance.getEntriesByType('navigation')[0];
      var restoreSession = /^glide-s-\d+$/.test(keptSession) && (
        (navEntry && navEntry.type === 'back_forward')
        || document.querySelector('.b-ticket__time[data-session-vt="' + keptSession + '"]')
      );
      if (restoreSession) {
        var keptTime = document.querySelector('[data-session-vt="' + keptSession + '"]');
        if (keptTime) keptTime.style.viewTransitionName = keptSession;
      }

      document.addEventListener('pointerdown', function (event) {
        var time = event.target && event.target.closest && event.target.closest('[data-session-vt]');
        if (time) {
          var sessionName = time.getAttribute('data-session-vt') || '';
          if (/^glide-s-\d+$/.test(sessionName)) {
            var allTimes = document.querySelectorAll('[data-session-vt]');
            for (var n = 0; n < allTimes.length; n++) {
              allTimes[n].style.viewTransitionName = allTimes[n] === time ? sessionName : 'none';
            }
            try { sessionStorage.setItem('glide-session-vt', sessionName); } catch (err) {}
          }
        }
        var card = event.target && event.target.closest && event.target.closest('[data-place-vt]');
        if (!card) return;
        var name = card.getAttribute('data-place-vt') || '';
        if (!/^glide-place-[a-z0-9-]+$/.test(name)) return;
        var named = document.querySelectorAll('[data-place-vt]');
        for (var i = 0; i < named.length; i++) {
          if (named[i] !== card) named[i].style.viewTransitionName = '';
        }
        card.style.viewTransitionName = name;
        try { sessionStorage.setItem('glide-place-vt', name); } catch (err) {}
      }, true);
      (function () {
        var nav = performance.getEntriesByType('navigation')[0];
        if (!nav || nav.type !== 'back_forward') return;
        var name = '';
        try { name = sessionStorage.getItem('glide-place-vt') || ''; } catch (err) { return; }
        if (!/^glide-place-[a-z0-9-]+$/.test(name)) return;
        var backCard = document.querySelector('[data-place-vt="' + name + '"]');
        if (backCard) backCard.style.viewTransitionName = name;
      })();

      var toast = document.getElementById('toast');
      function say(text) {
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }
      document.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var text = btn.getAttribute('data-copy') || '';
          var done = function () { say('Скопировано — вставьте в любой чат'); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { window.prompt('Скопируйте:', text); });
          } else {
            window.prompt('Скопируйте:', text);
          }
        });
      });
      /*
        Телефон не пишет в «Фото» сам. Кадр готовим заранее, и по нажатию сразу
        открываем «Сохранить изображение» — иначе после fetch жест пропадает
        и Safari скачивает файл в «Файлы». Компьютер по-прежнему качает файл.
        Без JS остаётся обычная ссылка download.
      */
      var storyLink = document.querySelector('.share__story');
      var storyBlob = null;
      function storyFetchPath(href) {
        try {
          var u = new URL(href, location.href);
          return u.pathname + u.search;
        } catch (e) {
          return href;
        }
      }
      function savesToPhotos() {
        var ua = navigator.userAgent || '';
        return /iPad|iPhone|iPod|Android/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }
      function blobDownload(blob) {
        var objectUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objectUrl;
        a.download = 'glide-story.png';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 2000);
        say('Сохранено — проверьте «Загрузки»');
      }
      function shareOrDownload(blob) {
        var file;
        try {
          file = new File([blob], 'glide-story.png', { type: blob.type || 'image/png' });
        } catch (e) {
          blobDownload(blob);
          return;
        }
        var nav = navigator;
        if (savesToPhotos() && nav.share && nav.canShare && nav.canShare({ files: [file] })) {
          say('«Сохранить изображение» — кадр попадёт в галерею');
          nav.share({ files: [file] }).catch(function (err) {
            if (err && err.name === 'AbortError') return;
            blobDownload(blob);
          });
          return;
        }
        blobDownload(blob);
      }
      function saveStoryImage(href) {
        if (storyBlob) {
          shareOrDownload(storyBlob);
          return;
        }
        fetch(storyFetchPath(href), { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('http');
            return r.blob();
          })
          .then(shareOrDownload)
          .catch(function () {
            say('Удержите картинку и выберите «Сохранить в Фото»');
            window.location.href = href;
          });
      }
      if (storyLink) {
        var storyHref = storyLink.getAttribute('href') || '';
        if (storyHref && savesToPhotos()) {
          fetch(storyFetchPath(storyHref), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.blob() : null; })
            .then(function (blob) { storyBlob = blob; })
            .catch(function () {});
        }
        storyLink.addEventListener('click', function (event) {
          var href = storyLink.getAttribute('href') || '';
          if (!href) return;
          event.preventDefault();
          saveStoryImage(href);
        });
      }
      if (navigator.share) {
        var row = document.querySelector('.share__row');
        var copy = document.querySelector('[data-copy]');
        if (row && copy) {
          var more = document.createElement('button');
          more.type = 'button';
          more.className = 'share__btn';
          more.textContent = 'Ещё…';
          more.addEventListener('click', function () {
            navigator.share({ title: document.title, text: copy.getAttribute('data-copy') || '' }).catch(function () {});
          });
          row.appendChild(more);
        }
      }
    })();
  </script>
