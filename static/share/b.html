  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/shared/list-scroll-restore.js?v=1"></script>
  <script>
    /*
      JS страницы: «Скопировать», «Поделиться» и восстановление скролла списка.
      Cache-Control: no-store (учёт просмотров) отключает bfcache — без sessionStorage
      возврат /c/ → /p/ → назад всегда открывал список сверху. Без JS ссылки работают.
    */
    (function () {
      var Api = window.GlideListScrollRestore;
      if (Api) {
        var path = location.pathname;
        var search = location.search;
        function saveListScroll() {
          Api.save(sessionStorage, path, search, window.scrollY || window.pageYOffset || 0);
        }
        function restoreListScroll() {
          var y = Api.consume(sessionStorage, path, search);
          if (!y) return;
          var go = function () { window.scrollTo(0, y); };
          go();
          if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(function () { requestAnimationFrame(go); });
          } else {
            setTimeout(go, 0);
          }
        }
        window.addEventListener('pagehide', saveListScroll);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') saveListScroll();
        });
        if (document.readyState === 'complete') restoreListScroll();
        else window.addEventListener('load', restoreListScroll);
      }

      var toast = document.getElementById('toast');
      function say(text) {
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }
      document.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var text = btn.getAttribute('data-copy') || '';
          var done = function () { say('Скопировано — вставьте в любой чат'); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { window.prompt('Скопируйте:', text); });
          } else {
            window.prompt('Скопируйте:', text);
          }
        });
      });
      function dropBrokenPhoto(img) {
        var hero = img.closest('.hero');
        if (hero) hero.classList.remove('hero--photo');
        var media = img.closest('.pick__media');
        if (media) {
          var icon = media.getAttribute('data-icon') || '';
          var head = media.parentNode;
          media.remove();
          if (icon && head && !head.querySelector('.pick__icon')) {
            var plate = document.createElement('span');
            plate.className = 'pick__icon';
            plate.setAttribute('aria-hidden', 'true');
            plate.textContent = icon;
            head.insertBefore(plate, head.firstChild);
          }
          return;
        }
        img.remove();
      }
      document.querySelectorAll('.hero__photo, .pick__photo').forEach(function (img) {
        img.addEventListener('error', function () { dropBrokenPhoto(img); });
        if (img.complete && img.naturalWidth === 0) dropBrokenPhoto(img);
      });
      /*
        Сайт не пишет в «Фото» напрямую. Android: файл в «Загрузки», галерея его видит.
        iPhone: системное меню, пункт «Сохранить изображение» кладёт кадр в галерею.
        Без JS остаётся обычная ссылка download.
      */
      var storyLink = document.querySelector('.share__story');
      if (storyLink) {
        storyLink.addEventListener('click', function (event) {
          var href = storyLink.getAttribute('href') || '';
          if (!href) return;
          event.preventDefault();
          saveStoryImage(href);
        });
      }
      function storyFetchPath(href) {
        try {
          var u = new URL(href, location.href);
          return u.pathname + u.search;
        } catch (e) {
          return href;
        }
      }
      function isIos() {
        var ua = navigator.userAgent || '';
        return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }
      function blobDownload(blob) {
        var objectUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objectUrl;
        a.download = 'glide-story.png';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 2000);
        say('Сохранено — проверьте «Загрузки» или галерею');
      }
      function saveStoryImage(href) {
        fetch(storyFetchPath(href), { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('http');
            return r.blob();
          })
          .then(function (blob) {
            var file = new File([blob], 'glide-story.png', { type: blob.type || 'image/png' });
            var nav = navigator;
            if (isIos() && nav.share && nav.canShare && nav.canShare({ files: [file] })) {
              nav.share({ files: [file] }).catch(function (err) {
                if (err && err.name === 'AbortError') return;
                blobDownload(blob);
              });
              return;
            }
            blobDownload(blob);
          })
          .catch(function () {
            say('Удержите картинку и выберите «Сохранить в Фото»');
            window.location.href = href;
          });
      }
      if (navigator.share) {
        var row = document.querySelector('.share__row');
        var copy = document.querySelector('[data-copy]');
        if (row && copy) {
          var more = document.createElement('button');
          more.type = 'button';
          more.className = 'share__btn';
          more.textContent = 'Ещё…';
          more.addEventListener('click', function () {
            navigator.share({ title: document.title, text: copy.getAttribute('data-copy') || '' }).catch(function () {});
          });
          row.appendChild(more);
        }
      }
    })();
  </script>
