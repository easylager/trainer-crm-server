<!DOCTYPE html>
<html lang="__LANG__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>__OG_TITLE__</title>
  <meta name="description" content="__OG_DESCRIPTION__" />
  <link rel="canonical" href="__CANONICAL__" />
  <meta name="robots" content="__ROBOTS__" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="__OG_LOCALE__" />
  <meta property="og:site_name" content="Glide" />
  <meta property="og:title" content="__OG_TITLE__" />
  <meta property="og:description" content="__OG_DESCRIPTION__" />
  <meta property="og:url" content="__CANONICAL__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">__JSONLD__</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=1" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --surface: var(--g-surface);
      --ink: var(--g-ink);
      --muted: var(--g-muted);
      --line: #e3e9ee;
      --accent: var(--g-accent);
      --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--g-font);
      font-size: 16px;
      line-height: 1.45;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 96px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .top__brand { font-weight: 700; color: var(--ink); text-decoration: none; }
    .top__brand span { color: var(--muted); font-weight: 500; }
    .top__trainers { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .kicker { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 7vw, 40px); font-weight: 700; letter-spacing: -.02em; }
    .lede, .counter { margin: 0 0 28px; color: var(--muted); }
    .day-picker { margin: -12px 0 28px; }
    .day-picker ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .day-picker a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 14px; }
    h2.section { margin: 32px 0 12px; font-size: 20px; }
    ul.cities, ul.sessions { list-style: none; margin: 0; padding: 0; }
    .city {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .city__name { margin: 0 0 4px; font-size: 20px; }
    .city__name a { color: inherit; text-decoration: none; }
    .city__name a::after { content: " ›"; color: var(--accent); }
    .city__stats { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .city__links { margin: 0; font-size: 14px; }
    .city__links a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .country-group { margin-bottom: 20px; }
    .country-group__title { margin: 0 0 10px; font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .session {
      display: grid;
      grid-template-columns: 4.5rem 5.5rem 1fr auto;
      gap: 8px 12px;
      align-items: baseline;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .session--projected {
      border-style: dashed;
      background: #f9fbfb;
    }
    .session__day { color: var(--muted); font-size: 13px; }
    .session__time { font-weight: 600; }
    .session__place a { color: inherit; text-decoration: none; font-weight: 600; }
    .session__city { color: var(--muted); font-size: 13px; text-align: right; }
    .session__basis, .session__basis-long, .session__price, .session__soon { color: var(--muted); font-size: 12px; }
    .session__basis { font-style: italic; }
    .sessions__more { margin: 8px 0 0; font-size: 14px; }
    .sessions__more a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .muted { color: var(--muted); }
    .cta {
      display: block;
      margin: 28px 0 0;
      padding: 15px 20px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    .cta--secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 12px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <a class="top__brand" href="/">Glide<span> · каталог</span></a>
      <a class="top__trainers" href="__TRAINERS_URL__">Для тренеров →</a>
    </header>
    <p class="kicker">Каталог</p>
    <h1>__PAGE_H1__</h1>
    <p class="lede counter">__COUNTER_TEXT__</p>
    __DAY_PICKER__

    <h2 class="section">Города</h2>
    __CITIES__

    __SESSIONS_BLOCK__

    <a class="cta cta--secondary" href="__CTA_URL__">Открыть в Telegram</a>
    <footer>Данные с сайтов катков — время и цену уточняйте на месте.</footer>
  </main>
</body>
</html>
