    }
    .home-map__hint.is-below { transform: translate(-50%, 10px); }

  <script>
    (function () {
      var HOLD_MS = 450;
      var MOVE_PX = 10;
      var LINGER_MS = 1500;
      var map = document.querySelector('.home-map');
      if (!map) return;

      var tip = document.createElement('div');
      tip.className = 'home-map__hint';
      tip.hidden = true;
      tip.setAttribute('role', 'tooltip');
      document.body.appendChild(tip);

      var holdTimer = 0;
      var lingerTimer = 0;
      var start = null;
      var blockClick = false;
      var fromTouch = false;

      var hot = null;

      function cityFrom(node) {
        return node && node.closest ? node.closest('.home-map__city') : null;
      }

      function cityGeom(city) {
        var tap = city.querySelector('.home-map__tap') || city;
        var rect = tap.getBoundingClientRect();
        return {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2,
          r: Math.max(rect.width, rect.height) / 2
        };
      }

      // Зоны Минска и соседей пересекаются, верхняя ссылка — всегда Минск.
      // Берём город, чей центр ближе к пальцу, если палец ещё внутри его зоны.
      function nearestCity(x, y) {
        var best = null;
        var bestD = Infinity;
        var nodes = map.querySelectorAll('.home-map__city');
        for (var i = 0; i < nodes.length; i++) {
          var geom = cityGeom(nodes[i]);
          var dx = x - geom.x;
          var dy = y - geom.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > geom.r + 1 || dist >= bestD) continue;
          best = nodes[i];
          bestD = dist;
        }
        return best;
      }

      function markHot(city) {
        if (hot === city) return;
        if (hot) hot.classList.remove('is-hot');
        hot = city || null;
        if (hot) hot.classList.add('is-hot');
      }

      function clearHold() {
        if (!holdTimer) return;
        clearTimeout(holdTimer);
        holdTimer = 0;
      }

      function clearLinger() {
        if (!lingerTimer) return;
        clearTimeout(lingerTimer);
        lingerTimer = 0;
      }

      function hide() {
        tip.hidden = true;
        tip.textContent = '';
        tip.classList.remove('is-below');
        markHot(null);
      }

      function show(city) {
        var name = city.getAttribute('aria-label') || '';
        if (!name) return;
        markHot(city);
        tip.textContent = name;
        tip.hidden = false;
        tip.classList.remove('is-below');
        var circles = city.querySelectorAll('circle');
        var rect = (circles.length ? circles[circles.length - 1] : city).getBoundingClientRect();
        var x = rect.left + rect.width / 2;
        tip.style.left = x + 'px';
        tip.style.top = rect.top + 'px';
        var box = tip.getBoundingClientRect();
        if (box.top < 8) {
          tip.classList.add('is-below');
          tip.style.top = rect.bottom + 'px';
          box = tip.getBoundingClientRect();
        }
        var shift = 0;
        if (box.left < 8) shift = 8 - box.left;
        else if (box.right > window.innerWidth - 8) shift = (window.innerWidth - 8) - box.right;
        if (shift) tip.style.left = (x + shift) + 'px';
      }

      function detach() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancel);
      }

      function onMove(e) {
        if (!start || e.pointerId !== start.id) return;
        var dx = e.clientX - start.x;
        var dy = e.clientY - start.y;
        if (dx * dx + dy * dy <= MOVE_PX * MOVE_PX) return;
        clearHold();
        start.moved = true;
        blockClick = true;
        markHot(null);
      }

      function finishGesture() {
        clearHold();
        detach();
        if (start && start.shown) {
          clearLinger();
          lingerTimer = setTimeout(function () {
            lingerTimer = 0;
            hide();
          }, LINGER_MS);
        }
        start = null;
      }

      function onUp(e) {
        if (!start || e.pointerId !== start.id) return;
        finishGesture();
      }

      function onCancel(e) {
        if (start && e.pointerId !== start.id) return;
        var shown = !!(start && start.shown);
        clearHold();
        detach();
        start = null;
        if (!shown) return;
        blockClick = true;
        hide();
      }

      map.addEventListener('pointerdown', function (e) {
        fromTouch = e.pointerType !== 'mouse';
        if (!fromTouch) return;
        var city = nearestCity(e.clientX, e.clientY);
        if (!city) return;
        clearHold();
        clearLinger();
        hide();
        markHot(city);
        blockClick = false;
        start = { x: e.clientX, y: e.clientY, id: e.pointerId, city: city, moved: false, shown: false };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onCancel);
        holdTimer = setTimeout(function () {
          holdTimer = 0;
          if (!start || start.moved) return;
          start.shown = true;
          blockClick = true;
          show(start.city);
        }, HOLD_MS);
      });

      map.addEventListener('click', function (e) {
        var city = nearestCity(e.clientX, e.clientY);
        if (blockClick) {
          if (city || cityFrom(e.target)) e.preventDefault();
          blockClick = false;
          return;
        }
        if (!city || cityFrom(e.target) === city) return;
        e.preventDefault();
        var href = city.getAttribute('href');
        if (!href) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey) {
          window.open(href, '_blank', 'noopener');
          return;
        }
        window.location.href = href;
      }, true);

      map.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse' || start) return;
        var city = nearestCity(e.clientX, e.clientY);
        if (!city) {
          hide();
          return;
        }
        if (!tip.hidden && tip.textContent === (city.getAttribute('aria-label') || '')) return;
        clearLinger();
        show(city);
      });

      map.addEventListener('pointerleave', function (e) {
        if (start || (e.pointerType && e.pointerType !== 'mouse')) return;
        hide();
      });

      map.addEventListener('contextmenu', function (e) {
        if (fromTouch && (nearestCity(e.clientX, e.clientY) || cityFrom(e.target))) e.preventDefault();
      });

      document.addEventListener('pointerdown', function (e) {
        if (cityFrom(e.target)) return;
        clearLinger();
        hide();
      });

      window.addEventListener('scroll', function () {
        if (start || tip.hidden) return;
        clearLinger();
        hide();
      }, true);
    })();
  </script>
