  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --surface: var(--g-surface);
      --ink: var(--g-ink);
      --muted: var(--g-muted);
      --line: #e3e9ee;
      --accent: var(--g-accent);
      --accent-ink: var(--g-on-accent);
      --accent-text: var(--g-accent-ink);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--g-font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 96px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .top__brand { font-weight: 700; color: var(--ink); text-decoration: none; }
    .top__brand span { color: var(--muted); font-weight: 500; }
    .top__trainers { font-size: 14px; font-weight: 600; color: var(--accent-text); text-decoration: none; }
    .date { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); }
    h1 { margin: 6px 0 0; font-size: clamp(26px, 7vw, 34px); font-weight: 600; letter-spacing: -.01em; line-height: 1.12; }
    .sub, .counter { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .sub--ohm { margin-top: 2px; }
    .small { font-size: 13px; }
    .hero-city {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 16px 0 0; padding: 16px 18px; border-radius: 18px;
      background: var(--surface); color: var(--ink); text-decoration: none;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
    }
    .hero-city:hover { background: var(--g-accent-wash); }
    .hero-city .cap { display: block; font-size: 12px; color: var(--muted); }
    .hero-city .name { display: block; margin-top: 2px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
    .hero-city .live { display: block; margin-top: 4px; font-size: 14px; color: var(--muted); }
    .hero-city .live b { font-weight: 600; color: var(--ink); }
    .hero-city svg { flex-shrink: 0; color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    .map { margin: 20px 0 0; padding: 8px; }
    .map svg { width: 100%; height: auto; display: block; }
    .home-map__city {
      cursor: pointer;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .home-map__city.is-hot circle:last-child, .home-map__city:focus-visible circle:last-child { fill: var(--g-accent-pressed); }
    .home-map__city:focus-visible { outline: none; }
    .home-map__city:focus-visible .home-map__tap { fill: rgba(69, 185, 187, .18); }
    .home-map__hint {
      position: fixed;
      z-index: 30;
      left: 0;
      top: 0;
      transform: translate(-50%, calc(-100% - 10px));
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--g-ink);
      color: #fff;
      font: 600 14px/1.2 var(--g-font);
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .18);
    }
    .home-map__hint.is-below { transform: translate(-50%, 10px); }
    .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
    .head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 10px; }
    .head h2.section { margin: 0; }
    h2.section { margin: 28px 0 12px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    .cities { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (min-width: 560px) { .cities { grid-template-columns: 1fr 1fr 1fr; } }
    .city {
      display: flex; flex-direction: column; gap: 4px; min-height: 96px;
      padding: 14px 14px 12px; color: var(--ink); text-decoration: none;
    }
    .city .n { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .city .n::after { content: " ›"; color: var(--accent-text); }
    .city .f { font-size: 14px; color: #4a5f71; line-height: 1.35; }
    .city .f b { color: var(--ink); font-weight: 600; }
    .city .f__bit { white-space: nowrap; }
    .city .has { margin-top: auto; padding-top: 6px; font-size: 12px; color: var(--muted); }
    .city--quiet .f { color: var(--muted); }
    details.more { margin-top: 8px; padding: 2px 14px; }
    details.more summary {
      min-height: 44px; display: flex; align-items: center; justify-content: space-between;
      font-size: 17px; font-weight: 600; letter-spacing: -.01em; cursor: pointer; list-style: none;
    }
    details.more summary::-webkit-details-marker { display: none; }
    details.more summary::after { content: "\2304"; color: var(--muted); font-size: 18px; }
    details.more[open] summary::after { content: "\2303"; }
    details.more p { margin: 0 0 12px; font-size: 14px; line-height: 1.7; color: #4a5f71; }
    details.more p b { color: var(--ink); }
    details.more a { color: var(--accent-text); text-decoration: none; }
    .elsewhere { margin: 20px 0 0; font-size: 14px; color: var(--muted); }
    .elsewhere a { color: var(--accent-text); font-weight: 600; text-decoration: none; }
    .muted { color: var(--muted); }
    .cta {
      display: block;
      margin: 28px 0 0;
      padding: 15px 20px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    .cta--secondary { background: transparent; color: var(--accent-text); border: 1px solid var(--accent); margin-top: 12px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <a class="top__brand" href="/">__BRAND__</a>
      <a class="top__trainers" href="__TRAINERS_URL__">Для тренеров →</a>
    </header>
    <p class="date">__DATE__</p>
    <h1>__PAGE_H1__</h1>
    <p class="sub counter">__COUNTER_TEXT__</p>
    __OHM_SUB__
    __HERO_CITY__
    __MAP__

    __CITIES_HEAD__

    __ELSEWHERE__

    <a class="cta cta--secondary" href="__CTA_URL__">Открыть в Telegram</a>
    <footer></footer>
  </main>
  <script>
    (function () {
      var HOLD_MS = 450;
      var MOVE_PX = 10;
      var LINGER_MS = 1500;
      var map = document.querySelector('.home-map');
      if (!map) return;

      var tip = document.createElement('div');
      tip.className = 'home-map__hint';
      tip.hidden = true;
      tip.setAttribute('role', 'tooltip');
      document.body.appendChild(tip);

      var holdTimer = 0;
      var lingerTimer = 0;
      var start = null;
      var blockClick = false;
      var fromTouch = false;

      var hot = null;

      function cityFrom(node) {
        return node && node.closest ? node.closest('.home-map__city') : null;
      }

      function cityGeom(city) {
        var tap = city.querySelector('.home-map__tap') || city;
        var rect = tap.getBoundingClientRect();
        return {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2,
          r: Math.max(rect.width, rect.height) / 2
        };
      }

      // Зоны Минска и соседей пересекаются, верхняя ссылка — всегда Минск.
      // Берём город, чей центр ближе к пальцу, если палец ещё внутри его зоны.
      function nearestCity(x, y) {
        var best = null;
        var bestD = Infinity;
        var nodes = map.querySelectorAll('.home-map__city');
        for (var i = 0; i < nodes.length; i++) {
          var geom = cityGeom(nodes[i]);
          var dx = x - geom.x;
          var dy = y - geom.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > geom.r + 1 || dist >= bestD) continue;
          best = nodes[i];
          bestD = dist;
        }
        return best;
      }

      function markHot(city) {
        if (hot === city) return;
        if (hot) hot.classList.remove('is-hot');
        hot = city || null;
        if (hot) hot.classList.add('is-hot');
      }

      function clearHold() {
        if (!holdTimer) return;
        clearTimeout(holdTimer);
        holdTimer = 0;
      }

      function clearLinger() {
        if (!lingerTimer) return;
        clearTimeout(lingerTimer);
        lingerTimer = 0;
      }

      function hide() {
        tip.hidden = true;
        tip.textContent = '';
        tip.classList.remove('is-below');
        markHot(null);
      }

      function show(city) {
        var name = city.getAttribute('aria-label') || '';
        if (!name) return;
        markHot(city);
        tip.textContent = name;
        tip.hidden = false;
        tip.classList.remove('is-below');
        var circles = city.querySelectorAll('circle');
        var rect = (circles.length ? circles[circles.length - 1] : city).getBoundingClientRect();
        var x = rect.left + rect.width / 2;
        tip.style.left = x + 'px';
        tip.style.top = rect.top + 'px';
        var box = tip.getBoundingClientRect();
        if (box.top < 8) {
          tip.classList.add('is-below');
          tip.style.top = rect.bottom + 'px';
          box = tip.getBoundingClientRect();
        }
        var shift = 0;
        if (box.left < 8) shift = 8 - box.left;
        else if (box.right > window.innerWidth - 8) shift = (window.innerWidth - 8) - box.right;
        if (shift) tip.style.left = (x + shift) + 'px';
      }

      function detach() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancel);
      }

      function onMove(e) {
        if (!start || e.pointerId !== start.id) return;
        var dx = e.clientX - start.x;
        var dy = e.clientY - start.y;
        if (dx * dx + dy * dy <= MOVE_PX * MOVE_PX) return;
        clearHold();
        start.moved = true;
        blockClick = true;
        markHot(null);
      }

      function finishGesture() {
        clearHold();
        detach();
        if (start && start.shown) {
          clearLinger();
          lingerTimer = setTimeout(function () {
            lingerTimer = 0;
            hide();
          }, LINGER_MS);
        }
        start = null;
      }

      function onUp(e) {
        if (!start || e.pointerId !== start.id) return;
        finishGesture();
      }

      function onCancel(e) {
        if (start && e.pointerId !== start.id) return;
        var shown = !!(start && start.shown);
        clearHold();
        detach();
        start = null;
        if (!shown) return;
        blockClick = true;
        hide();
      }

      map.addEventListener('pointerdown', function (e) {
        fromTouch = e.pointerType !== 'mouse';
        if (!fromTouch) return;
        var city = nearestCity(e.clientX, e.clientY);
        if (!city) return;
        clearHold();
        clearLinger();
        hide();
        markHot(city);
        blockClick = false;
        start = { x: e.clientX, y: e.clientY, id: e.pointerId, city: city, moved: false, shown: false };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onCancel);
        holdTimer = setTimeout(function () {
          holdTimer = 0;
          if (!start || start.moved) return;
          start.shown = true;
          blockClick = true;
          show(start.city);
        }, HOLD_MS);
      });

      map.addEventListener('click', function (e) {
        var city = nearestCity(e.clientX, e.clientY);
        if (blockClick) {
          if (city || cityFrom(e.target)) e.preventDefault();
          blockClick = false;
          return;
        }
        if (!city || cityFrom(e.target) === city) return;
        e.preventDefault();
        var href = city.getAttribute('href');
        if (!href) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey) {
          window.open(href, '_blank', 'noopener');
          return;
        }
        window.location.href = href;
      }, true);

      map.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse' || start) return;
        var city = nearestCity(e.clientX, e.clientY);
        if (!city) {
          hide();
          return;
        }
        if (!tip.hidden && tip.textContent === (city.getAttribute('aria-label') || '')) return;
        clearLinger();
        show(city);
      });

      map.addEventListener('pointerleave', function (e) {
        if (start || (e.pointerType && e.pointerType !== 'mouse')) return;
        hide();
      });

      map.addEventListener('contextmenu', function (e) {
        if (fromTouch && (nearestCity(e.clientX, e.clientY) || cityFrom(e.target))) e.preventDefault();
      });

      document.addEventListener('pointerdown', function (e) {
        if (cityFrom(e.target)) return;
        clearLinger();
        hide();
      });

      window.addEventListener('scroll', function () {
        if (start || tip.hidden) return;
        clearLinger();
        hide();
      }, true);
    })();
  </script>
</body>

</html>
