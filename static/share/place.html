  <style>
    /*
      TASK-146. Страница самодостаточная, как «Лёд сегодня»: один запрос, ноль своих
      ассетов — её открывают из пересланного сообщения на чужом телефоне.

      Холст светлый и спокойный (design/CREATIVE-DIRECTIONS-2026-08-24.md): тил — акцент,
      не заливка. Тёмная драматичная подача живёт только в картинке для шеринга
      (og.png / story.png) — это экспортируемый артефакт, а не среда.
      Срез 45° у hero — та же «ribbon»-геометрия, что в мини-аппе.
    */
    :root {
      color-scheme: light;
      --bg: #f4f6f7;
      --surface: #ffffff;
      --ink: #0d1b26;
      --muted: #5d7285;
      --line: #e1e8ec;
      --accent: #0f8f8a;
      --accent-ink: #ffffff;
      --accent-wash: #e3f4f3;
      --chip: #eef3f5;
      --live: #12a150;
      --warn: #b4690e;
      --cut: 18px;
      --ice: #2aa7c9;
      --gym: #e08a1e;
      --shop: #7a5af5;
      --other: #5d7285;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 112px; }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 0 14px; font-size: 14px; color: var(--muted);
    }
    .top__brand { font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
    .top__brand span { color: var(--accent); }

    .hero {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 20px 20px 18px 23px;
      clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
      margin-bottom: 12px;
    }
    .hero::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--other);
    }
    .hero--ice::before { background: var(--ice); }
    .hero--gym::before, .hero--choreo::before { background: var(--gym); }
    .hero--shop::before { background: var(--shop); }
    .hero--photo { padding-top: 0; }
    .hero__photo {
      display: block; width: calc(100% + 43px); max-width: none; margin: 0 -20px 16px -23px;
      aspect-ratio: 16 / 9; object-fit: cover; background: var(--chip);
    }
    .dock {
      position: sticky; bottom: 0; margin: 16px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, transparent, var(--bg) 30%);
    }
    .dock .cta { box-shadow: 0 8px 24px rgba(15, 143, 138, .28); }
    .hero__type { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .hero__title { margin: 0; font-size: clamp(26px, 7vw, 34px); line-height: 1.12; letter-spacing: -.02em; }
    .hero__where { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 0;
      padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 600;
    }
    .badge__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .badge--live .badge__dot, .badge--open .badge__dot { background: var(--live); box-shadow: 0 0 0 4px rgba(18,161,80,.15); }
    .badge--soon .badge__dot { background: var(--accent); }
    .badge--closed .badge__dot, .badge--shut .badge__dot { background: var(--warn); }
    .about { margin: 0 0 12px; color: var(--muted); }

    .plan {
      background: var(--accent-wash);
      border: 1px solid var(--accent);
      border-radius: 18px;
      padding: 18px 20px;
      margin: 0 0 12px;
    }
    .plan__kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .plan__day { margin: 8px 0 0; font-size: 16px; font-weight: 600; }
    .plan__time { margin: 2px 0 0; font-size: 40px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .plan__label { margin: 4px 0 0; color: var(--muted); }
    .plan__soon { margin: 8px 0 0; font-weight: 600; color: var(--live); }
    .plan__prices { margin: 10px 0 0; padding: 0; list-style: none; font-size: 15px; }
    .plan__prices li { padding: 2px 0; }
    .plan__where { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .plan--gone { background: var(--surface); border-color: var(--line); }
    .plan--gone .plan__kicker { color: var(--warn); }
    .plan__note { margin: 6px 0 0; }

    .actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 0 0 12px; }
    @media (min-width: 420px) { .actions { grid-template-columns: 1fr 1fr; } .actions--one { grid-template-columns: 1fr; } }
    .cta {
      display: block; padding: 14px 18px; border-radius: 14px;
      background: var(--accent); color: var(--accent-ink);
      font-size: 16px; font-weight: 600; text-align: center; text-decoration: none;
    }
    .cta--ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

    .sec {
      background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
      padding: 16px 18px; margin: 0 0 12px;
    }
    .sec__title { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .sec p { margin: 0; }
    .muted { color: var(--muted); }
    .hint { margin: 10px 0 0 !important; color: var(--muted); font-size: 13px; }
    .day + .day { margin-top: 14px; }
    .day__label { margin: 0 0 8px !important; font-weight: 600; }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; }
    .slot {
      display: inline-flex; flex-direction: column; gap: 1px; min-width: 86px;
      padding: 8px 12px; border-radius: 12px; background: var(--chip);
      color: var(--ink); text-decoration: none; border: 1px solid transparent;
    }
    .slot--focus { border-color: var(--accent); background: var(--accent-wash); }
    .slot--more { color: var(--muted); justify-content: center; }
    .slot__time { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .slot__price { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { background: var(--chip); border-radius: 14px; padding: 12px; }
    .tile__icon { font-size: 20px; }
    .tile__title { margin: 6px 0 2px !important; font-weight: 700; }
    .tile__sub { font-size: 13px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick__head { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 12px; }
    .pick__media {
      display: block; flex: 0 0 88px; width: 88px; height: 72px;
      border-radius: 12px; overflow: hidden; background: var(--chip);
    }
    .pick__photo { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pick__icon {
      flex: 0 0 44px; width: 44px; height: 44px; border-radius: 12px;
      background: var(--accent-wash); display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .pick__titles { min-width: 0; flex: 1; }
    .pick__name { margin: 0; font-size: 19px; line-height: 1.25; }
    .pick__name a { color: var(--ink); text-decoration: none; }
    .pick__name a::after { content: " ›"; color: var(--accent); }
    .pick__where { margin: 4px 0 0 !important; color: var(--muted); font-size: 14px; }
    .pick__note { margin: 0 0 12px; padding: 12px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
    .for-whom { margin: 14px 0 8px !important; font-size: 13px; color: var(--muted); }
    .chip { padding: 7px 12px; border-radius: 999px; background: var(--chip); font-size: 14px; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--line); }
    .row:first-of-type { border-top: 0; padding-top: 0; }
    .row span { color: var(--muted); }
    .row b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
    .contact-phones {
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    .contact-phone { display: block; }
    .contact-phone a {
      color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(15, 143, 138, 0.35);
    }
    .contact-phone a:active { color: var(--accent); }

    .share { margin: 18px 0 0; }
    .share__title { margin: 0 0 8px; font-weight: 700; }
    .share__row { display: flex; flex-wrap: wrap; gap: 8px; }
    .share__btn {
      flex: 1 1 auto; min-width: 96px; padding: 11px 14px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--line); color: var(--ink);
      font: inherit; font-size: 15px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .share__btn--tg { background: #229ed9; border-color: #229ed9; color: #fff; }
    .share__btn--story { border-color: rgba(15, 143, 138, 0.45); background: var(--accent-wash); color: var(--accent); }
    .share__story {
      display: inline-block; margin-top: 10px; padding: 0; border: 0; background: none;
      font: inherit; font-size: 14px; color: var(--accent); cursor: pointer; text-decoration: underline;
      text-underline-offset: 3px;
    }
    .trust { margin: 22px 0 0; color: var(--muted); font-size: 13px; }
    .trust p { margin: 0 0 4px; }
    footer { margin-top: 18px; color: var(--muted); font-size: 13px; text-align: center; }
    footer a { color: inherit; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg);
      font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="top">
      <a class="top__brand" href="/">Glide<span> · карта льда</span></a>
      <span>__CITY__</span>
    </nav>
    __BODY__
    <a class="share__story" href="__STORY_IMAGE__" download="glide-story.png" data-story-save="__STORY_IMAGE__">
      Сохранить картинку для сторис (Instagram, VK)
    </a>
    <div class="trust">__TRUST__</div>
    <footer>__CITY_LINK__</footer>

  __HOME_SHORTCUT_OVERLAY__
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    /*
      Единственный JS страницы — «Скопировать» и системное меню «Поделиться».
      Без JS все остальные кнопки — обычные ссылки и работают и так.
    */
    (function () {
      var toast = document.getElementById('toast');
      function say(text) {
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }
      document.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var text = btn.getAttribute('data-copy') || '';
          var done = function () { say('Скопировано — вставьте в любой чат'); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { window.prompt('Скопируйте:', text); });
          } else {
            window.prompt('Скопируйте:', text);
          }
        });
      });
      function dropBrokenPhoto(img) {
        var hero = img.closest('.hero');
        if (hero) hero.classList.remove('hero--photo');
        var media = img.closest('.pick__media');
        if (media) {
          var icon = media.getAttribute('data-icon') || '';
          var head = media.parentNode;
          media.remove();
          if (icon && head && !head.querySelector('.pick__icon')) {
            var plate = document.createElement('span');
            plate.className = 'pick__icon';
            plate.setAttribute('aria-hidden', 'true');
            plate.textContent = icon;
            head.insertBefore(plate, head.firstChild);
          }
          return;
        }
        img.remove();
      }
      document.querySelectorAll('.hero__photo, .pick__photo').forEach(function (img) {
        img.addEventListener('error', function () { dropBrokenPhoto(img); });
        if (img.complete && img.naturalWidth === 0) dropBrokenPhoto(img);
      });
      if (navigator.share) {
        var row = document.querySelector('.share__row');
        var copy = document.querySelector('[data-copy]');
        if (row && copy) {
          var more = document.createElement('button');
          more.type = 'button';
          more.className = 'share__btn';
          more.textContent = 'Ещё…';
          more.addEventListener('click', function () {
            navigator.share({ title: document.title, text: copy.getAttribute('data-copy') || '' }).catch(function () {});
          });
          row.appendChild(more);
        }
      }

      function absoluteUrl(url) {
        try {
          return new URL(String(url || ''), window.location.href).href;
        } catch (e) {
          return String(url || '');
        }
      }
      function tryTelegramDownload(url) {
        var t = window.Telegram && window.Telegram.WebApp;
        if (!t || typeof t.downloadFile !== 'function') return false;
        try {
          if (t.isVersionAtLeast && !t.isVersionAtLeast('8.0')) return false;
          t.downloadFile({ url: absoluteUrl(url), file_name: 'glide-story.png' });
          return true;
        } catch (e) {
          return false;
        }
      }
      function blobDownload(blob) {
        var a = document.createElement('a');
        var objectUrl = URL.createObjectURL(blob);
        a.href = objectUrl;
        a.download = 'glide-story.png';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 2000);
      }
      function saveStory(url) {
        var media = absoluteUrl(url);
        if (!media) return;
        if (tryTelegramDownload(media)) {
          say('Сохраните картинку — затем выложите в сторис');
          return;
        }
        fetch(media, { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('http');
            return r.blob();
          })
          .then(function (blob) {
            var nav = window.navigator;
            if (nav && typeof nav.share === 'function' && typeof File !== 'undefined') {
              var file = new File([blob], 'glide-story.png', { type: 'image/png' });
              var payload = { files: [file] };
              if (!nav.canShare || nav.canShare(payload)) {
                return nav.share(payload).then(
                  function () { say('Выберите «Сохранить в Фото» или Instagram'); },
                  function () {
                    blobDownload(blob);
                    say('Если файл скачался — добавьте из галереи в сторис');
                  }
                );
              }
            }
            blobDownload(blob);
            say('На iPhone: удержите превью → «Сохранить в Фото»');
          })
          .catch(function () {
            window.open(media, '_blank', 'noopener');
            say('Откройте картинку и сохраните вручную');
          });
      }
      document.addEventListener('click', function (e) {
        var el = e.target && e.target.closest ? e.target.closest('[data-story-save]') : null;
        if (!el) return;
        var url = el.getAttribute('data-story-save') || el.getAttribute('href') || '';
        if (!url) return;
        e.preventDefault();
        saveStory(url);
      }, false);
      document.querySelectorAll('.share__story').forEach(function (el) {
        if (!el.getAttribute('href')) el.style.display = 'none';
      });
    })();
  </script>
