  <style>
    /*
      TASK-211. Цвета, шрифт и радиусы — только var(--g-*) из glide-tokens.css.
      Страница работает без JS: вкладки дней и «позвать» — обычные ссылки.
    */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--g-bg);
      color: var(--g-ink);
      font-family: var(--g-font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--g-accent-ink); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 0 40px; }
    .chrome {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; background: var(--g-surface);
      border-bottom: 1px solid var(--g-line);
    }
    .chrome__back {
      width: var(--g-tap); height: var(--g-tap);
      display: flex; align-items: center; justify-content: center;
      color: var(--g-ink); text-decoration: none;
    }
    .chrome__city { font-size: 15px; color: var(--g-muted); }
    .chrome__brand {
      margin-left: auto; font-size: 18px; font-weight: 700;
      color: var(--g-ink); text-decoration: none;
    }
    .photo { height: 190px; background: var(--g-line); overflow: hidden; }
    .photo img { width: 100%; height: 190px; object-fit: cover; display: block; }
    .photo--empty {
      display: flex; align-items: flex-end; padding: 14px 16px;
      color: var(--g-muted); font-size: 14px;
    }
    .intro {
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      background: var(--g-surface);
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; }
    .where { margin: 0; font-size: 15px; color: var(--g-muted); }
    .status {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; background: var(--g-accent-wash); border-radius: var(--g-r);
    }
    .status b { font-weight: 700; }
    .status__dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--g-accent); flex: 0 0 auto;
    }
    .status__hint { display: block; font-weight: 400; color: var(--g-ink-2); }
    .status--warn { background: var(--g-warn-wash); color: var(--g-warn-ink); }
    .status--stack { flex-direction: column; align-items: flex-start; gap: 4px; }
    .acts { display: grid; gap: 8px; margin-top: 4px; }
    .act {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-height: var(--g-tap); padding: 12px 6px;
      border: 1px solid var(--g-line); border-radius: var(--g-r);
      text-decoration: none; color: var(--g-ink); font-size: 14px; font-weight: 600;
      background: var(--g-surface);
    }
    .act__icon { color: var(--g-accent-ink); display: flex; }
    .follow, .follow--open, .call {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 8px 14px; border-radius: var(--g-r);
      text-decoration: none; font-size: 16px; font-weight: 600; text-align: center;
    }
    .follow { background: var(--g-dark); color: var(--g-surface); }
    .follow[aria-disabled="true"] { opacity: 0.55; }
    .follow--open, .call { background: var(--g-accent); color: var(--g-surface); }
    .follow-hint { margin: 0; font-size: 13px; color: var(--g-muted); text-align: center; }
    .about { margin: 12px 16px; color: var(--g-muted); }
    .place-grid { display: block; }
    .block, .ohm, .mode-card, .open-card, .sec, .plan {
      margin: 18px 16px 0;
    }
    .block h2, .ohm h2, .mode-card h2, .open-card h2, .sec__title, .place-side h2 {
      margin: 0 0 10px; font-size: 21px; font-weight: 700;
    }
    .block__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .block__aside { font-size: 13px; color: var(--g-muted); text-align: right; }
    .daytabs { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 12px; }
    .daytab {
      padding: 9px 14px; min-height: var(--g-tap); box-sizing: border-box;
      border-radius: var(--g-r-pill); background: var(--g-surface);
      border: 1px solid var(--g-line); color: var(--g-ink);
      text-decoration: none; font-size: 14px; white-space: nowrap;
    }
    .daytab--on { background: var(--g-dark); color: var(--g-surface); border-color: var(--g-dark); font-weight: 600; }
    .sess-list { display: flex; flex-direction: column; gap: 8px; }
    .sess {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; background: var(--g-surface);
      border: 1px solid var(--g-line); border-radius: var(--g-r-md);
    }
    .sess--projected { border-style: dashed; }
    .sess__when { display: flex; flex-direction: column; gap: 2px; flex: 0 0 92px; }
    .sess__time { font-size: 20px; font-weight: 700; }
    .sess__until, .sess__sub, .sess__basis { font-size: 13px; color: var(--g-muted); }
    .sess__meta { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
    .sess__price { font-size: 15px; font-weight: 600; }
    .sess__invite {
      flex: 0 0 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: var(--g-r-sm); background: var(--g-accent-wash); color: var(--g-accent-ink);
    }
    .hint { margin: 10px 0 0; font-size: 13px; color: var(--g-muted); }
    .ohm, .mode-card, .open-card {
      padding: 16px; background: var(--g-surface);
      border: 1px solid var(--g-line); border-radius: 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .open-card { border: 2px solid var(--g-accent); }
    .ohm h2, .mode-card h2, .open-card h2 { font-size: 19px; margin: 0; }
    .ohm__when { margin: 0; font-size: 15px; }
    .ohm__note { margin: 0; font-size: 14px; color: var(--g-ink-2); }
    .amenity {
      margin: 0; padding: 0; list-style: none;
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
    }
    .amenity li {
      padding: 12px 14px; background: var(--g-surface);
      border: 1px solid var(--g-line); border-radius: var(--g-r); font-size: 15px;
    }
    .amenity-hours .sec { margin: 10px 0 0; }
    .call--block {
      flex-direction: column; align-items: flex-start; gap: 4px;
      padding: 16px; background: var(--g-surface); color: var(--g-ink);
      border: 1px solid var(--g-line); margin: 0 16px;
    }
    .call--block span { font-size: 13px; font-weight: 400; color: var(--g-muted); }
    .nearby {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 16px; background: var(--g-surface); border: 1px solid var(--g-line);
      border-radius: var(--g-r-md); text-decoration: none; color: var(--g-ink);
    }
    .nearby b { font-size: 16px; }
    .nearby__meta { display: block; font-size: 13px; color: var(--g-muted); font-weight: 400; }
    .nearby__go { font-size: 15px; font-weight: 600; color: var(--g-accent-ink); }
    .plan {
      background: var(--g-accent-wash); border: 1px solid var(--g-accent);
      border-radius: 18px; padding: 18px 20px;
    }
    .plan__kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--g-accent); }
    .plan__day { margin: 8px 0 0; font-weight: 600; }
    .plan__time { margin: 2px 0 0; font-size: 40px; font-weight: 700; }
    .plan__label, .plan__where { margin: 4px 0 0; color: var(--g-muted); }
    .plan__soon { margin: 8px 0 0; font-weight: 600; color: var(--g-accent); }
    .plan__prices { margin: 10px 0 0; padding: 0; list-style: none; }
    .plan--gone { background: var(--g-surface); border-color: var(--g-line); }
    .plan--gone .plan__kicker { color: var(--g-warn-ink); }
    .plan__note { margin: 6px 0 0; }
    .sec { background: var(--g-surface); border: 1px solid var(--g-line); border-radius: 18px; padding: 16px 18px; }
    .sec p, .sec .row { margin: 0; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-top: 1px solid var(--g-line); }
    .row span { color: var(--g-muted); }
    .row b { font-weight: 600; text-align: right; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { background: var(--g-bg); border-radius: var(--g-r); padding: 12px; }
    .tile__title { margin: 6px 0 2px; font-weight: 700; }
    .tile__sub { font-size: 13px; color: var(--g-muted); }
    .sched__stale { margin: 0 0 10px; color: var(--g-warn-ink); font-size: 13px; }
    .trust { margin: 18px 16px 0; color: var(--g-muted); font-size: 13px; }
    .trust p { margin: 0 0 4px; }
    .foot {
      padding: 22px 16px 8px; display: flex; flex-direction: column; gap: 8px;
      font-size: 14px; color: var(--g-muted);
    }
    @media (min-width: 960px) {
      .wrap { max-width: 1100px; }
      .place-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.8fr);
        gap: 8px 20px;
        align-items: start;
        padding-right: 16px;
      }
      .place-side .block, .place-side .sec { margin-right: 0; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    __BODY__
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/webapp/place-follow.js?v=2"></script>
  <script>
    (function () {
      document.addEventListener('click', function (e) {
        var share = e.target.closest('[data-glide-share]');
        if (!share) return;
        var url = share.getAttribute('data-glide-share') || share.href;
        var text = share.getAttribute('data-glide-share-text') || '';
        if (navigator.share) {
          e.preventDefault();
          navigator.share({ title: document.title, text: text, url: url }).catch(function () {});
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          e.preventDefault();
          navigator.clipboard.writeText(url).catch(function () {});
        }
      });
      function dropBrokenPhoto(img) {
        var box = img.parentNode;
        if (!box) return;
        box.classList.add('photo--empty');
        box.textContent = box.getAttribute('data-empty') || '';
      }
      document.querySelectorAll('.photo img').forEach(function (img) {
        img.addEventListener('error', function () { dropBrokenPhoto(img); });
      });
      var initData = '';
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        initData = tg && tg.initData ? tg.initData : '';
      } catch (err) {
        initData = '';
      }
      if (!initData || !window.PlaceFollow) return;
      document.querySelectorAll('[data-arena-follow]').forEach(function (node) {
        var id = node.getAttribute('data-arena-follow');
        fetch('/api/webapp/client/arena-follows/' + id, {
          headers: { 'X-Telegram-Init-Data': initData }
        }).then(function (response) {
          return response.ok ? response.json() : null;
        }).then(function (status) {
          var view = window.PlaceFollow.placeFollowState({
            initData: initData,
            status: status,
            label: node.getAttribute('data-follow-on') || ''
          });
          if (view.mode !== 'unfollow') return;
          var label = node.querySelector('[data-follow-label]');
          node.setAttribute('data-follow-off', label ? label.textContent : '');
          if (label) label.textContent = view.label;
          node.setAttribute('data-following', '1');
          node.setAttribute('data-unfollow-url', view.url);
        }).catch(function () {});
      });
      document.addEventListener('click', function (e) {
        var node = e.target.closest('[data-following="1"]');
        if (!node || !window.PlaceFollow) return;
        e.preventDefault();
        var state = node._followState;
        if (!state) {
          var shown = node.querySelector('[data-follow-label]');
          state = node._followState = {
            pending: false,
            disabled: false,
            following: true,
            url: node.getAttribute('data-unfollow-url') || '',
            label: shown ? shown.textContent : '',
            offLabel: node.getAttribute('data-follow-off') || '',
            error: node.getAttribute('data-unfollow-error') || ''
          };
        }
        state.url = node.getAttribute('data-unfollow-url') || state.url;
        var request = window.PlaceFollow.runUnfollow(state, function (url) {
          return fetch(url, {
            method: 'DELETE',
            headers: { 'X-Telegram-Init-Data': initData }
          });
        }, function (message) {
          var webapp = window.Telegram && window.Telegram.WebApp;
          if (webapp && typeof webapp.showAlert === 'function') webapp.showAlert(message);
        });
        if (state.disabled) node.setAttribute('aria-disabled', 'true');
        request.then(function (result) {
          if (state.disabled) node.setAttribute('aria-disabled', 'true');
          else node.removeAttribute('aria-disabled');
          if (!result || result.skipped || !result.ok) return;
          var label = node.querySelector('[data-follow-label]');
          if (label) label.textContent = state.label;
          node.removeAttribute('data-following');
          node._followState = null;
        });
      });
    })();
  </script>
</body>
