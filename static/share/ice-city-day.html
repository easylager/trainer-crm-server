<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>__TITLE__</title>
  <meta name="description" content="__DESCRIPTION__" />
  <link rel="canonical" href="__CANONICAL__" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <meta property="og:site_name" content="Glide" />
  <meta property="og:title" content="__TITLE__" />
  <meta property="og:description" content="__DESCRIPTION__" />
  <meta property="og:url" content="__CANONICAL__" />
  <meta property="og:image" content="__OG_IMAGE__" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <style>
    /*
      Страница самодостаточная: один запрос, ноль своих JS/CSS-ассетов. Её открывают из
      пересланного сообщения на чужом телефоне и часто на плохой связи — каждый лишний
      round-trip здесь стоит дороже, чем экономия на дублировании стилей.
    */
    :root {
      color-scheme: light dark;
      --ic-bg: #f6f8fa;
      --ic-surface: #ffffff;
      --ic-ink: #0d1b26;
      --ic-muted: #5d7285;
      --ic-line: #e3e9ee;
      --ic-accent: #0f8f8a;
      --ic-accent-ink: #ffffff;
      --ic-chip: #eef4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ic-bg: #0a1620;
        --ic-surface: #101f2b;
        --ic-ink: #f2f7fa;
        --ic-muted: #90a7b8;
        --ic-line: #1d3040;
        --ic-accent: #5ed6d2;
        --ic-accent-ink: #06222a;
        --ic-chip: #162835;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--ic-bg);
      color: var(--ic-ink);
      font-family: 'Golos Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 96px; }
    .kicker {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ic-accent);
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 7vw, 40px); font-weight: 700; letter-spacing: -.02em; }
    .lede { margin: 0 0 24px; color: var(--ic-muted); font-size: 16px; }
    .arena {
      background: var(--ic-surface);
      border: 1px solid var(--ic-line);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .arena__name { margin: 0; font-size: 18px; font-weight: 600; }
    .arena__where { margin: 2px 0 12px; color: var(--ic-muted); font-size: 14px; }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .slot {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--ic-chip);
      border-radius: 12px;
      padding: 8px 12px;
      min-width: 96px;
    }
    .slot__time { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .slot__price { font-size: 13px; color: var(--ic-muted); font-variant-numeric: tabular-nums; }
    .empty {
      background: var(--ic-surface);
      border: 1px solid var(--ic-line);
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
    }
    .empty p { margin: 0 0 6px; }
    .empty .muted { color: var(--ic-muted); font-size: 14px; }
    .cta {
      position: sticky;
      bottom: 16px;
      display: block;
      margin: 24px 0 0;
      padding: 15px 20px;
      border-radius: 16px;
      background: var(--ic-accent);
      color: var(--ic-accent-ink);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    footer { margin-top: 20px; color: var(--ic-muted); font-size: 13px; text-align: center; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">Лёд · __DAY_LABEL_UPPER__</p>
    <h1>__CITY__</h1>
    <p class="lede">__DESCRIPTION__</p>
    __BODY__
    <a class="cta" href="__CTA_URL__">Открыть в Glide</a>
    <footer>__FOOTER__</footer>
  </main>
</body>
</html>
