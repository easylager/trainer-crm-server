  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=2" />
  <style>
    /*
      Страница самодостаточная: один запрос, ноль своих JS/CSS-ассетов. Её открывают из
      пересланного сообщения на чужом телефоне и часто на плохой связи — каждый лишний
      round-trip здесь стоит дороже, чем экономия на дублировании стилей.
    */
    :root {
      color-scheme: light;
      --ic-bg: #f6f8fa;
      --ic-surface: var(--g-surface);
      --ic-ink: var(--g-ink);
      --ic-muted: var(--g-muted);
      --ic-line: #e3e9ee;
      --ic-accent: var(--g-accent);
      --ic-accent-ink: var(--g-on-accent);
      --ic-accent-text: var(--g-accent-ink);
      --ic-chip: #eef4f6;
      --ic-warn: #a86411;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--ic-bg);
      color: var(--ic-ink);
      font-family: var(--g-font);
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 96px; }
    .kicker {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ic-accent-text);
    }
    .kicker a { color: inherit; text-decoration: none; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 7vw, 34px); font-weight: 600; letter-spacing: -.01em; line-height: 1.12; }
    .lede { margin: 0 0 24px; color: var(--ic-muted); font-size: 14px; }
    .arena {
      background: var(--ic-surface);
      border: 1px solid var(--ic-line);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .arena__name { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .arena__name a { color: inherit; text-decoration: none; }
    .arena__name a::after { content: " ›"; color: var(--ic-accent-text); }
    .arena__where { margin: 2px 0 12px; color: var(--ic-muted); font-size: 14px; }
    /* TASK-180: строка свежести расписания (сейчас всегда пустая, TASK-243). */
    .arena__stale { margin: -6px 0 12px; color: var(--ic-warn); font-size: 13px; }
    .arena__basis { margin: 10px 0 0; color: var(--ic-muted); font-size: 13px; line-height: 1.4; }
    .slots { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .slot {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--ic-chip);
      border-radius: 12px;
      padding: 8px 12px;
      min-width: 96px;
    }
    .slot__time { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .slot__price { font-size: 13px; color: var(--ic-muted); font-variant-numeric: tabular-nums; }
    .slot--basis-projected,
    .slot--basis-photo,
    .slot--basis-manual {
      border: 1px dashed rgba(69, 185, 187, 0.7);
      background: rgba(69, 185, 187, 0.12);
    }
    .empty {
      background: var(--ic-surface);
      border: 1px solid var(--ic-line);
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
    }
    .empty p { margin: 0 0 6px; }
    .empty .muted { color: var(--ic-muted); font-size: 14px; }
    .cta {
      display: block;
      margin: 24px 0 0;
      padding: 15px 20px;
      border-radius: 16px;
      background: var(--ic-accent);
      color: var(--ic-accent-ink);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    footer { margin-top: 20px; color: var(--ic-muted); font-size: 13px; text-align: center; }
    footer a { color: inherit; }
  </style>

  <script src="/static/shared/list-scroll-restore.js?v=1"></script>
  <script>
    /* no-store убивает bfcache — возвращаем позицию списка после /p/. */
    (function () {
      var Api = window.GlideListScrollRestore;
      if (!Api) return;
      var path = location.pathname;
      var search = location.search;
      function save() {
        Api.save(sessionStorage, path, search, window.scrollY || window.pageYOffset || 0);
      }
      function restore() {
        var y = Api.consume(sessionStorage, path, search);
        if (!y) return;
        var go = function () { window.scrollTo(0, y); };
        go();
        if (typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(function () { requestAnimationFrame(go); });
        }
      }
      window.addEventListener('pagehide', save);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') save();
      });
      if (document.readyState === 'complete') restore();
      else window.addEventListener('load', restore);
    })();
  </script>
</body>
