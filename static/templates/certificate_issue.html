<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Подарочный сертификат</title>
  <style>
    /*
      Вёрстка под PyMuPDF Story, а не под браузер. Story понимает узкий срез CSS:
      font-*, color, background-color, margin/padding, border, border-radius, text-align.
      Он НЕ понимает CSS-переменные, flex, position, градиенты и тени — раньше здесь было
      всё перечисленное, поэтому PDF выходил как чёрный текст на белом листе: тёмная полоска
      с кодом не рисовалась вовсе, и клиент получал сертификат без самого кода.
      Правило простое: один столбец, литеральные цвета, никаких var().
    */
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Inter";
      color: #0f172a;
      font-size: 8px;
      line-height: 1.45;
    }

    .sheet {
      padding: 12px 15px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #ffffff;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .tagline {
      font-size: 7px;
      color: #64748b;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .kicker {
      font-size: 7px;
      font-weight: 700;
      color: #0f9b99;
      letter-spacing: 0.14em;
      border-top: 1px solid #e2e8f0;
      padding-top: 7px;
      margin-bottom: 7px;
    }

    .label {
      font-size: 7px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.08em;
    }

    .recipient {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .amount-row {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.1;
    }

    .amount-row .curr {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
    }

    .product-line {
      font-size: 8.5px;
      color: #475569;
      margin-top: 3px;
    }

    .meta-box {
      font-size: 8px;
      color: #475569;
      margin-top: 7px;
      margin-bottom: 9px;
    }

    .meta-box b { color: #0f172a; font-weight: 600; }

    .code-strip {
      background-color: #0f172a;
      border-radius: 8px;
      padding: 8px 10px 9px;
      text-align: center;
      margin-bottom: 8px;
    }

    .code-strip .lbl {
      font-size: 6.5px;
      font-weight: 600;
      color: #7dd3d1;
      letter-spacing: 0.14em;
    }

    /*
      Код — единственное, что из этого PDF копируют руками, и единственное место, где мы
      отходим от Inter. Inter поднимает дефис рядом с заглавными (фича `case`), и такой глиф
      выходит из PDF символом приватной зоны: на листе код верный, а скопированный — мусор.
      Встроенный гротеск этой фичи не знает; моноширинный отпадает — он бы читался чужим
      шрифтом, а тут и так всего одна строка.
    */
    .code-strip .val {
      font-family: sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.06em;
      margin-top: 4px;
    }

    .qr-block { text-align: center; margin-bottom: 8px; }

    .qr-caption {
      font-size: 7.5px;
      color: #475569;
      margin-top: 4px;
    }

    .qr-caption b { color: #0f172a; font-weight: 600; }

    .qr-fallback {
      font-size: 7px;
      color: #64748b;
    }

    .instructions h3 {
      font-size: 8.5px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 3px;
    }

    .instructions ol,
    .instructions ul {
      margin: 0 0 7px;
      padding-left: 12px;
      font-size: 8px;
      color: #334155;
    }

    .instructions li { margin-bottom: 2px; }

    .fineprint {
      font-size: 7px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      padding-top: 7px;
      margin-top: 2px;
    }

    .sheet-foot {
      text-align: center;
      font-size: 6.5px;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="brand">__BRAND__</div>
    <div class="tagline">__TAGLINE_HTML__</div>

    <div class="kicker">ПОДАРОЧНЫЙ СЕРТИФИКАТ</div>
    <div class="label">КОМУ</div>
    <div class="recipient">__RECIPIENT__</div>
    __AMOUNT_ROW__
    <div class="product-line">__PRODUCT__</div>
    <div class="meta-box">__META__</div>

    <div class="code-strip">
      <div class="lbl">КОД АКТИВАЦИИ</div>
      <div class="val">__CODE__</div>
    </div>

    <div class="qr-block">__QR_INNER__</div>

    __INSTRUCTIONS_BLOCK__

    <div class="sheet-foot">__SHEET_FOOT__</div>
  </div>
</body>
</html>
