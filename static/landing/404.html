<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена · Glide</title>
<link rel="icon" href="/logos/01-icon/glide-icon-teal-on-black.png" type="image/png">
<style>
:root{--paper:#F1F3F2;--surface:#fff;--line:#E2E6E5;--ink:#101617;--hint:#5E6B6B;--teal:#45B9BB;--on-teal:#04262A}
@media (prefers-color-scheme:dark){:root{--paper:#0B1118;--surface:#101827;--line:#1E2A3A;--ink:#E9EFF7;--hint:#9AA8B8}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{width:100%;max-width:440px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 28px 32px}
img{width:56px;height:56px;border-radius:14px}
.code{margin:22px 0 4px;font-size:13px;letter-spacing:.14em;color:var(--hint);font-weight:600}
h1{margin:0 0 10px;font-size:26px;line-height:1.2}
p{margin:0 0 28px;color:var(--hint);font-size:16px;line-height:1.5}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:12px;background:var(--teal);color:var(--on-teal);font-weight:600;font-size:16px;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/logos/01-icon/glide-icon-teal-on-black.png" alt="Glide" width="56" height="56">
  <div class="code">ОШИБКА 404</div>
  <h1>Такой страницы нет</h1>
  <p>Ссылка могла устареть, или каток переехал. Расписание всех катков — на главной.</p>
  <a class="btn" href="/">На главную</a>
</main>
</body>
</html>
