<!DOCTYPE html>
<html lang="ru" data-client-family-access>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Семейный доступ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="client-mini-app-theme.js?v=202608267"></script>
  <link rel="stylesheet" href="theme.css?v=202608267" />
  <link rel="stylesheet" href="mini-app-client-theme.css?v=202608267" />
  <link rel="stylesheet" href="mini-app-components.css?v=202608267" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" /></noscript>
  <script src="mini-app-telegram-chrome.js?v=202608267"></script>
  <link rel="stylesheet" href="mini-app-client-nav.css?v=202608267" />
  <style>
    .cfa-wrap { padding: 16px 18px 28px; max-width: 520px; margin: 0 auto; box-sizing: border-box; }
    .cfa-title { font-size: 22px; font-weight: 700; margin: 0 0 10px; line-height: 1.2; }
    .cfa-intro {
      font-size: 14px; line-height: 1.5; color: var(--tg-theme-hint-color, #888); margin: 0 0 20px;
    }
    .cfa-limit { font-size: 13px; color: var(--tg-theme-hint-color, #888); margin: 0 0 16px; }
    .cfa-member {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color, #f0f0f0); margin-bottom: 10px;
    }
    .cfa-member__avatar {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
      background: rgba(var(--accent-rgb), 0.25); color: var(--app-cta-fill, #c26e00);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
    }
    .cfa-member__meta { flex: 1; min-width: 0; }
    .cfa-member__role { font-size: 12px; color: var(--tg-theme-hint-color, #888); margin-top: 2px; line-height: 1.35; }
    .cfa-member__label { font-weight: 600; font-size: 15px; word-break: break-word; }
    .cfa-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .cfa-btn {
      min-height: 48px; border-radius: 14px; font-weight: 600; font-size: 15px; border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit;
    }
    .cfa-btn--primary {
      background: var(--app-cta-fill, #34C6C4); color: #1a1206;
      box-shadow: var(--app-btn-shadow-cta, 0 4px 14px rgba(var(--accent-rgb), 0.35));
    }
    .cfa-btn--primary svg { flex-shrink: 0; }
    .cfa-btn--danger {
      background: transparent; color: #c62828; border: 1px solid rgba(198, 40, 40, 0.35);
    }
    .cfa-state { text-align: center; padding: 24px 12px; color: var(--tg-theme-hint-color); }
    .cfa-state.err { color: #c62828; }
  </style>
</head>
<body>
  <div class="header" style="padding: 12px 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
    <h1 class="cfa-title" style="margin:0; font-size: 18px;">Семейный доступ</h1>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" hidden>Назад</button>
    </div>
  </div>
  <div class="cfa-wrap">
    <p class="cfa-intro" id="cfaIntro"></p>
    <div id="cfaLimit" class="cfa-limit" style="display: none;"></div>
    <div id="cfaList"></div>
    <div id="cfaState" class="cfa-state" style="display: none;"></div>
    <div class="cfa-actions" id="cfaActions" style="display: none;">
      <button type="button" class="cfa-btn cfa-btn--primary" id="btnInvite">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Пригласить
      </button>
    </div>
  </div>
  <script src="mini-app-client-home.js?v=202605022"></script>
  <script defer src="client-family-access-main.js?v=202605124"></script>
</body>
</html>
