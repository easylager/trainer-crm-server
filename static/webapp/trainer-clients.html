<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <title>Мои клиенты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" /></noscript>
  <link rel="stylesheet" href="theme.css?v=20260422" />
  <link rel="stylesheet" href="mini-app-components.css?v=20260422" />
  <script>
    /** Same palette + Telegram lock as trainer-requests / schedule-editor.html */
    (function () {
      function isAppDark() {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.colorScheme) return tg.colorScheme === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function applyTrainerClientsTheme() {
        var d = document.documentElement;
        var dark = isAppDark();
        d.style.setProperty('--tg-theme-button-color', '#f5a623', 'important');
        d.style.setProperty('--tg-theme-button-text-color', '#1a1a1a', 'important');
        d.style.setProperty('--tg-theme-bg-color', dark ? '#1a1a1a' : '#fffbeb', 'important');
        d.style.setProperty('--tg-theme-text-color', dark ? '#f5f5f5' : '#1a1a1a', 'important');
        d.style.setProperty('--tg-theme-secondary-bg-color', dark ? '#2a2a2a' : '#fff3cc', 'important');
        d.style.setProperty('--tg-theme-hint-color', dark ? '#8e8e93' : '#666666', 'important');
      }
      applyTrainerClientsTheme();
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTrainerClientsTheme);
      }
      window.__applyTrainerClientsTheme = applyTrainerClientsTheme;
    })();
  </script>
  <link rel="preload" href="trainer-clients-main.js?v=20260427" as="script" />
  <link rel="stylesheet" href="mini-app-trainer-clients.css?v=20260427" />
  <link rel="stylesheet" href="mini-app-trainer-nav.css?v=20260422" />
</head>
<body>
  <div class="page-head">

  <div id="clientsSection">

        <div class="tc-client-skel-card"><div class="tc-client-skel-av ma-skel-shimmer" aria-hidden="true"></div><div class="tc-client-skel-main"><div class="tc-client-skel-line tc-client-skel-line--name ma-skel-shimmer" aria-hidden="true"></div><div class="tc-client-skel-line tc-client-skel-line--meta ma-skel-shimmer" aria-hidden="true"></div><div class="tc-client-skel-line tc-client-skel-line--meta2 ma-skel-shimmer" aria-hidden="true"></div></div><div class="tc-client-skel-arrow ma-skel-shimmer" aria-hidden="true"></div></div>
        <div class="tc-client-skel-card"><div class="tc-client-skel-av ma-skel-shimmer" aria-hidden="true"></div><div class="tc-client-skel-main"><div class="tc-client-skel-line tc-client-skel-line--name ma-skel-shimmer" aria-hidden="true"></div><div class="tc-client-skel-line tc-client-skel-line--meta ma-skel-shimmer" aria-hidden="true"></div><div class="tc-client-skel-line tc-client-skel-line--meta2 ma-skel-shimmer" aria-hidden="true"></div></div><div class="tc-client-skel-arrow ma-skel-shimmer" aria-hidden="true"></div></div>

      </div>

    <div class="invite-link-section invite-card">
      <div class="section-title">Пригласить клиента (вне системы)</div>
      <p class="invite-hint">Отправьте ссылку человеку — он перейдёт в бота с вами выбранным (город и услуга подставятся). Ссылка одноразовая. Если у вас несколько услуг — выберите, для какой именно выдавать ссылку.</p>
      <div id="inviteServiceRow" class="invite-service-row" hidden>
        <div class="invite-service-label">Услуга для ссылки</div>
        <select id="inviteServiceSelect" class="invite-service-select" aria-label="Услуга для пригласительной ссылки"></select>
      </div>
      <button type="button" class="btn btn-secondary" id="btnShowInviteLink">Получить пригласительную ссылку</button>
      <div id="inviteLinkBlock" class="invite-link-block" style="display:none;">
        <div class="invite-link-label">Ссылка</div>
        <div id="inviteLinkUrl" class="invite-link-url"></div>
        <button type="button" class="btn btn-secondary" id="btnCopyInviteLink">Скопировать ссылку</button>
      </div>
    </div>
  </div>
  <div id="detailSection" style="display:none;">
    <div class="section-title">Карточка клиента</div>
    <div id="clientDetail"></div>
  </div>
  <div id="stateMessage" class="loading state-panel" style="display:none;" role="status" aria-live="polite">

  </div>
