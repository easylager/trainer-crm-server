<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ваша активность</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mini-app-components.css" />
  <script src="client-mini-app-theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" rel="stylesheet" />
  <link rel="preload" href="client-stats-main.js?v=202605138" as="script" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--app-font-sans);
      margin: 0;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
      padding: 0 0 28px;
    }
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--tg-theme-bg-color);
    }
    .header-title { flex: 1; font-size: 19px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; }
    #statsRoot { padding: 0 16px; }
    .st-hero-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .st-widget {
      border-radius: 20px;
      padding: 18px 16px 17px;
      border: 2px solid color-mix(in srgb, var(--tg-theme-button-color) 38%, transparent);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.06);
      position: relative;
      overflow: hidden;
    }
    .st-widget::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background: radial-gradient(120% 80% at 100% 0%, var(--tg-theme-button-color), transparent 55%);
    }
    .st-widget > * { position: relative; z-index: 1; }
    .st-widget--sessions {
      background: linear-gradient(145deg, rgba(245, 166, 35, 0.24) 0%, var(--tg-theme-secondary-bg-color) 52%);
    }
    .st-widget--time {
      background: linear-gradient(155deg, color-mix(in srgb, var(--tg-theme-link-color, #3390ec) 18%, var(--tg-theme-secondary-bg-color)) 0%, var(--tg-theme-secondary-bg-color) 60%);
      border-color: color-mix(in srgb, var(--tg-theme-link-color, #3390ec) 35%, var(--tg-theme-button-color) 25%, transparent);
    }
    .st-widget--streak {
      background: linear-gradient(160deg, color-mix(in srgb, var(--tg-theme-button-color) 28%, transparent) 0%, var(--tg-theme-secondary-bg-color) 58%);
    }
    .st-widget--welcome {
      background: linear-gradient(152deg, rgba(245, 166, 35, 0.2) 0%, var(--tg-theme-secondary-bg-color) 55%);
    }
    .st-widget-kicker {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--tg-theme-hint-color);
      margin-bottom: 8px;
    }
    .st-widget-lead {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--tg-theme-text-color);
      margin-bottom: 10px;
    }
    .st-widget-stat-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .st-widget-stat-row--duo {
      margin-bottom: 6px;
    }
    .st-widget-duo-lead {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -0.03em;
      color: var(--tg-theme-text-color);
    }
    .st-widget-num {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--tg-theme-text-color);
    }
    .st-widget-unit {
      font-size: 15px;
      font-weight: 600;
      color: color-mix(in srgb, var(--tg-theme-text-color) 72%, var(--tg-theme-hint-color));
    }
    .st-widget-sub {
      font-size: 14px;
      line-height: 1.45;
      color: var(--tg-theme-text-color);
      margin-top: 8px;
    }
    .st-widget-sub--muted {
      color: var(--tg-theme-hint-color);
      font-size: 13px;
      margin-top: 10px;
    }
    .st-progress {
      height: 8px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--tg-theme-hint-color) 22%, transparent);
      margin-top: 12px;
      overflow: hidden;
    }
    .st-progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(
        90deg,
        var(--tg-theme-button-color),
        color-mix(in srgb, var(--tg-theme-button-color) 62%, var(--tg-theme-bg-color))
      );
      min-width: 4%;
      transition: width 0.35s ease-out;
    }
    .st-widget--time .st-progress-fill {
      background: linear-gradient(90deg, var(--tg-theme-link-color, #3390ec), color-mix(in srgb, var(--tg-theme-link-color, #3390ec) 55%, var(--tg-theme-button-color)));
    }
    .st-progress-cap {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--tg-theme-hint-color);
      margin-top: 6px;
      letter-spacing: 0.02em;
    }
    .st-hero-note { font-size: 15px; color: var(--tg-theme-hint-color); margin-top: 8px; line-height: 1.35; }
    .st-card {
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color);
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid rgba(128, 128, 128, 0.1);
    }
    .st-card-title { font-size: 13px; font-weight: 700; color: var(--tg-theme-hint-color); margin-bottom: 6px; }
    .st-card-body { font-size: 15px; line-height: 1.45; }
    .st-nudge {
      border-radius: 16px;
      padding: 14px 16px;
      margin: 14px 0 18px;
      background: color-mix(in srgb, var(--tg-theme-button-color) 14%, var(--tg-theme-bg-color));
      border: 1px solid color-mix(in srgb, var(--tg-theme-button-color) 35%, transparent);
      font-size: 14px;
      line-height: 1.45;
    }
    .st-cta-row { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .st-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      -webkit-tap-highlight-color: transparent;
    }
    .st-btn-secondary {
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      border: 1.5px solid color-mix(in srgb, var(--tg-theme-button-color) 42%, transparent);
    }
    .st-btn:active { opacity: 0.9; transform: scale(0.99); }
    .st-state { margin: 28px 16px; text-align: center; color: var(--tg-theme-hint-color); font-size: 14px; line-height: 1.5; }
    .st-state.error { color: #c62828; }
    .st-foot {
      font-size: 12px;
      color: var(--tg-theme-hint-color);
      margin: 16px 16px 0;
      line-height: 1.45;
    }
  </style>
  <link rel="stylesheet" href="mini-app-client-nav.css" />
</head>
<body>
  <div class="header">
    <span class="header-title">Ваша активность</span>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" data-skip-history-back="true" hidden>Назад</button>
    </div>
  </div>
  <div id="statsRoot" style="display:none;"></div>
  <div id="statePanel" class="st-state" role="status"></div>
  <div class="st-cta-row" id="ctaRow" style="display:none;">
    <button type="button" class="st-btn" id="btnBook">Записаться к тренеру</button>
    <button type="button" class="st-btn st-btn-secondary" id="btnBookings">Мои записи</button>
  </div>
  <p class="st-foot" id="statsFoot" style="display:none;">Цифры обновляются, когда тренер отмечает занятие проведённым. Записаться и поменять планы по-прежнему удобнее в каталоге и в «Моих записях».</p>
  <script src="mini-app-client-home.js"></script>
  <script defer src="client-stats-main.js?v=202605138"></script>
</body>
</html>
