<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Абонементы и сертификаты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mini-app-components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <script src="client-mini-app-theme.js"></script>
  <style>
    body {
      font-family: var(--app-font-sans);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .header-title { flex: 1; }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 4px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.12);
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      background: transparent;
      color: var(--tg-theme-hint-color);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .tab.active {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      box-shadow: 0 2px 10px rgba(247, 166, 0, 0.22);
    }
    .tab:active { opacity: 0.9; }
    .panel { display: none; }
    .panel.active { display: block; }
    .loading, .error { text-align: center; padding: 32px 16px; color: var(--tg-theme-hint-color); }
    .error { color: var(--app-danger); }
    .empty { text-align: center; padding: 32px 16px; color: var(--tg-theme-hint-color); font-size: 15px; }
    .pass-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      margin-bottom: 10px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.12);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      width: 100%;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .pass-card:active { transform: scale(0.99); opacity: 0.95; }
    .pass-card .main { flex: 1; min-width: 0; }
    .pass-card .title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .pass-card .meta { font-size: 14px; color: var(--tg-theme-hint-color); }
    .pass-card .arrow { color: var(--tg-theme-hint-color); font-size: 16px; }
    [data-pass-screen] { display: none; }
    [data-pass-screen].active { display: block; }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--tg-theme-hint-color);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }
    .btn-back .back-link-chevron { width: 16px; height: 16px; flex-shrink: 0; color: inherit; }
    .btn-back:active { opacity: 0.75; }
    /* Деталь абонемента — тот же язык, что bd-hero + карточки в schedule / bookings */
    #pass-screenDetail {
      animation: pass-detail-in 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes pass-detail-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pass-detail-hero {
      position: relative;
      border-radius: 20px;
      padding: 20px 20px 22px;
      margin-bottom: 14px;
      overflow: hidden;
      background: linear-gradient(155deg, rgba(247, 166, 0, 0.14) 0%, rgba(247, 166, 0, 0.04) 48%, transparent 100%);
      border: 1px solid rgba(247, 166, 0, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }
    .pass-detail-hero::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 55%;
      height: 120%;
      background: radial-gradient(ellipse, rgba(247, 166, 0, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .pass-detail-hero-inner { position: relative; z-index: 1; }
    .pass-detail-product {
      margin: 0;
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--tg-theme-text-color);
    }
    .pass-detail-trainer {
      margin: 10px 0 0;
      font-size: 15px;
      font-weight: 500;
      color: var(--tg-theme-hint-color);
    }
    .pass-detail-stat-card {
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 16px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.14);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.06);
    }
    .pass-detail-stat-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .pass-detail-stat-label-top {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tg-theme-hint-color);
    }
    .pass-detail-stat-numbers {
      line-height: 1.15;
    }
    .pass-detail-stat-numbers .pass-detail-num {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--tg-theme-text-color);
    }
    .pass-detail-stat-numbers .pass-detail-sep {
      font-size: 18px;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      margin: 0 2px;
    }
    .pass-detail-progress-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(128, 128, 128, 0.14);
      overflow: hidden;
    }
    .pass-detail-progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffc23d 0%, #f5a623 100%);
      width: 0%;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pass-detail-footnote {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--tg-theme-hint-color);
      background: color-mix(in srgb, var(--tg-theme-secondary-bg-color) 85%, var(--tg-theme-bg-color));
      border: 1px solid rgba(128, 128, 128, 0.1);
    }
    #pass-screenDetail .bd-rows { font-family: var(--app-font-sans); }
    #cert-activateBlock {
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.12);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    #cert-activateBlock label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--tg-theme-hint-color);
    }
    .cert-card {
      padding: 16px 18px;
      margin-bottom: 10px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.12);
      border-left: 4px solid var(--app-cta-fill, var(--tg-theme-button-color));
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    .cert-card .title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .cert-card .meta { font-size: 14px; color: var(--tg-theme-hint-color); }
    .cert-card .code { font-family: monospace; font-size: 15px; letter-spacing: 1px; margin-top: 8px; }
    .cert-card.redeemed { opacity: 0.8; }
    .cert-activate-row { display: flex; gap: 8px; align-items: stretch; }
    .cert-code-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(128, 128, 128, 0.22);
      font-size: 14px;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
    }
    .cert-code-input::placeholder { color: var(--tg-theme-hint-color); }
    #cert-btnActivateCert.btn-primary {
      flex-shrink: 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
  <link rel="stylesheet" href="mini-app-client-nav.css" />
</head>
<body>
  <div class="header">
    <span class="header-title" id="headerTitle">📦 Мои абонементы</span>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" hidden>Назад</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" class="tab active" id="tabPasses" data-tab="passes" role="tab" aria-selected="true">Абонементы</button>
    <button type="button" class="tab" id="tabCerts" data-tab="certs" role="tab" aria-selected="false">Сертификаты</button>
  </div>

  <div id="panelPasses" class="panel active" role="tabpanel">
    <div id="pass-screenList" data-pass-screen class="active">
      <div id="pass-listContent"></div>
    </div>
    <div id="pass-screenDetail" data-pass-screen>
      <button type="button" class="btn-back" id="pass-backFromDetail">
        <svg class="back-link-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        К списку абонементов
      </button>
      <div class="pass-detail-hero">
        <div class="pass-detail-hero-inner">
          <p class="bd-hero-kicker" style="margin:0 0 10px;">Абонемент</p>
          <h1 class="pass-detail-product" id="pass-detailTitle">—</h1>
          <p class="pass-detail-trainer" id="pass-detailTrainer">—</p>
        </div>
      </div>
      <div class="pass-detail-stat-card">
        <div class="pass-detail-stat-row">
          <span class="pass-detail-stat-label-top">Осталось занятий</span>
        </div>
        <div class="pass-detail-stat-numbers"><span class="pass-detail-num" id="pass-detailRem">0</span><span class="pass-detail-sep"> из </span><span class="pass-detail-num" id="pass-detailTotal">0</span></div>
        <div class="pass-detail-progress-track" style="margin-top:12px;">
          <div class="pass-detail-progress-fill" id="pass-detailProgress"></div>
        </div>
      </div>
      <div class="bd-section-label" id="pass-detailSectionLabel">Подробности</div>
      <div class="bd-rows" id="pass-detailRows"></div>
      <div class="pass-detail-footnote">Занятия списываются с абонемента автоматически, когда запись становится проведённой.</div>
    </div>
  </div>

  <div id="panelCerts" class="panel" role="tabpanel">
    <div id="cert-activateBlock">
      <label for="certCodeInput">Введите код подарочного сертификата</label>
      <div class="cert-activate-row">
        <input id="certCodeInput" class="cert-code-input" type="text" placeholder="Например, CERT-ABC123">
        <button type="button" class="btn-primary" id="cert-btnActivateCert">Активировать</button>
      </div>
    </div>
    <div id="cert-listContent"></div>
  </div>

  <script>
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }
      function initData() { return (tg && tg.initData) ? tg.initData : ''; }
      function headers() {
        var h = { 'Content-Type': 'application/json' };
        var id = initData();
        if (id) h['X-Telegram-Init-Data'] = id;
        return h;
      }
      function escapeHtml(s) {
        if (s == null) return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function formatPassPrice(cents) {
        if (cents == null || cents === 0) return '';
        return (cents / 100).toFixed(2).replace(/\.?0+$/, '') + ' BYN за занятие';
      }
      function formatPassExpires(iso) {
        if (!iso) return '';
        try {
          var d = new Date(iso);
          return 'до ' + ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
        } catch (e) { return ''; }
      }
      function renderPassDetailScreen(p) {
        var rem = p.sessions_remaining != null ? p.sessions_remaining : 0;
        var total = p.sessions_total != null ? p.sessions_total : 0;
        document.getElementById('pass-detailTitle').textContent = p.product_name || '—';
        document.getElementById('pass-detailTrainer').textContent = p.trainer_name || '—';
        document.getElementById('pass-detailRem').textContent = String(rem);
        document.getElementById('pass-detailTotal').textContent = String(total);
        var pct = total > 0 ? Math.round((rem / total) * 100) : 0;
        document.getElementById('pass-detailProgress').style.width = pct + '%';

        var iconService = '<svg class="bd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/></svg>';
        var iconClock = '<svg class="bd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>';
        var iconTag = '<svg class="bd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>';

        var rows = '';
        if (p.service_name && p.service_name !== '—') {
          rows += '<div class="bd-row">' + iconService + '<div class="bd-row-text"><div class="bd-row-label">Услуга</div><div class="bd-row-value">' + escapeHtml(p.service_name) + '</div></div></div>';
        }
        var exp = formatPassExpires(p.expires_at);
        if (exp) {
          rows += '<div class="bd-row">' + iconClock + '<div class="bd-row-text"><div class="bd-row-label">Срок действия</div><div class="bd-row-value">' + escapeHtml(exp) + '</div></div></div>';
        }
        var priceStr = formatPassPrice(p.price_per_session_cents);
        if (priceStr) {
          rows += '<div class="bd-row">' + iconTag + '<div class="bd-row-text"><div class="bd-row-label">Оплата</div><div class="bd-row-value">' + escapeHtml(priceStr) + '</div></div></div>';
        }
        var sec = document.getElementById('pass-detailSectionLabel');
        var rowsEl = document.getElementById('pass-detailRows');
        if (!rows) {
          sec.style.display = 'none';
          rowsEl.innerHTML = '';
        } else {
          sec.style.display = '';
          rowsEl.innerHTML = rows;
        }
      }

      function getInitialTab() {
        var p = new URLSearchParams(window.location.search || '');
        var t = (p.get('tab') || '').toLowerCase();
        if (t === 'certificates' || t === 'certs' || t === 'certificate') return 'certs';
        return 'passes';
      }

      var headerTitle = document.getElementById('headerTitle');
      var tabPasses = document.getElementById('tabPasses');
      var tabCerts = document.getElementById('tabCerts');
      var panelPasses = document.getElementById('panelPasses');
      var panelCerts = document.getElementById('panelCerts');

      function setTab(tab) {
        var isPasses = tab === 'passes';
        tabPasses.classList.toggle('active', isPasses);
        tabCerts.classList.toggle('active', !isPasses);
        tabPasses.setAttribute('aria-selected', isPasses ? 'true' : 'false');
        tabCerts.setAttribute('aria-selected', !isPasses ? 'true' : 'false');
        panelPasses.classList.toggle('active', isPasses);
        panelCerts.classList.toggle('active', !isPasses);
        headerTitle.textContent = isPasses ? '📦 Мои абонементы' : '🎁 Мои сертификаты';
      }

      tabPasses.onclick = function() { setTab('passes'); };
      tabCerts.onclick = function() { setTab('certs'); };
      setTab(getInitialTab());

      // --- Passes (same logic as client-passes.html) ---
      var passState = { items: [], current: null };
      function showPassScreen(id) {
        document.querySelectorAll('[data-pass-screen]').forEach(function(el) { el.classList.remove('active'); });
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
      }
      function loadPassesList() {
        document.getElementById('pass-listContent').innerHTML = '<div class="loading">Загрузка…</div>';
        var url = '/api/webapp/client/passes' + (initData() ? '?init_data=' + encodeURIComponent(initData()) : '');
        fetch(url, { headers: headers() })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            passState.items = data.items || [];
            if (passState.items.length === 0) {
              document.getElementById('pass-listContent').innerHTML = '<div class="empty">Пока нет абонементов.</div>';
              return;
            }
            function formatPrice(cents) {
              if (cents == null || cents === 0) return '';
              return (cents / 100).toFixed(2).replace(/\.?0+$/, '') + ' BYN/занятие';
            }
            function formatExpires(iso) {
              if (!iso) return '';
              try {
                var d = new Date(iso);
                return 'До ' + ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
              } catch (e) { return ''; }
            }
            var html = '';
            passState.items.forEach(function(p) {
              var rem = p.sessions_remaining != null ? p.sessions_remaining : 0;
              var total = p.sessions_total != null ? p.sessions_total : 0;
              var metaParts = [p.trainer_name, (p.service_name && p.service_name !== '—' ? p.service_name : null), rem + ' из ' + total + ' занятий', 'осталось ' + rem];
              var priceStr = formatPrice(p.price_per_session_cents);
              if (priceStr) metaParts.push(priceStr);
              var expStr = formatExpires(p.expires_at);
              if (expStr) metaParts.push(expStr);
              var meta = metaParts.filter(Boolean).join(' · ');
              html += '<button type="button" class="pass-card" data-id="' + p.id + '">';
              html += '<div class="main">';
              html += '<div class="title">' + escapeHtml(p.product_name) + '</div>';
              html += '<div class="meta">' + escapeHtml(meta) + '</div></div>';
              html += '<span class="arrow">→</span></button>';
            });
            document.getElementById('pass-listContent').innerHTML = html;
            document.querySelectorAll('#panelPasses .pass-card').forEach(function(btn) {
              btn.onclick = function() {
                var id = parseInt(btn.dataset.id, 10);
                var p = passState.items.find(function(x) { return x.id === id; });
                if (p) {
                  passState.current = p;
                  renderPassDetailScreen(p);
                  showPassScreen('pass-screenDetail');
                }
              };
            });
          })
          .catch(function() {
            document.getElementById('pass-listContent').innerHTML = '<div class="error">Не удалось загрузить. Откройте из бота.</div>';
          });
      }
      document.getElementById('pass-backFromDetail').onclick = function() {
        showPassScreen('pass-screenList');
      };
      loadPassesList();

      // --- Certificates (same logic as client-certificates.html) ---
      function formatAmount(cents) {
        if (cents == null || cents === 0) return 'Любая сумма';
        return (cents / 100).toFixed(0) + ' BYN';
      }
      function formatDate(iso) {
        if (!iso) return '';
        try {
          var d = new Date(iso);
          return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
        } catch (e) { return ''; }
      }
      function statusLabel(status) {
        if (status === 'redeemed') return 'Погашен';
        if (status === 'activated') return 'Активирован';
        if (status === 'issued') return 'Выдан (ожидает активации)';
        if (status === 'expired') return 'Истёк';
        if (status === 'cancelled') return 'Отменён';
        return status || 'Активен';
      }
      function loadCertsList() {
        var url = '/api/webapp/client/certificates' + (initData() ? '?init_data=' + encodeURIComponent(initData()) : '');
        document.getElementById('cert-listContent').innerHTML = '<div class="loading">Загрузка…</div>';
        fetch(url, { headers: headers() })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var items = data.items || [];
            if (items.length === 0) {
              document.getElementById('cert-listContent').innerHTML = '<div class="empty">Пока нет сертификатов.</div>';
              return;
            }
            var html = '';
            items.forEach(function(c) {
              var cardClass = 'cert-card';
              if (c.status === 'redeemed' || c.status === 'expired' || c.status === 'cancelled') cardClass += ' redeemed';
              var meta = escapeHtml(c.trainer_name) + ' · ' + formatAmount(c.amount_cents) + ' · ' + statusLabel(c.status);
              if (c.issued_at) meta += ' · выдано ' + formatDate(c.issued_at);
              html += '<div class="' + cardClass + '">';
              html += '<div class="title">' + escapeHtml(c.code) + '</div>';
              html += '<div class="meta">' + meta + '</div>';
              html += '</div>';
            });
            document.getElementById('cert-listContent').innerHTML = html;
          })
          .catch(function() {
            document.getElementById('cert-listContent').innerHTML = '<div class="error">Не удалось загрузить. Откройте из бота.</div>';
          });
      }

      function activateCertificate() {
        var codeInput = document.getElementById('certCodeInput');
        var code = (codeInput.value || '').trim();
        if (!code) {
          alert('Введите код сертификата');
          return;
        }
        var url = '/api/webapp/client/certificates/activate' + (initData() ? '?init_data=' + encodeURIComponent(initData()) : '');
        fetch(url, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ code: code })
        })
          .then(function(r) {
            return r.json().then(function(d) { return { ok: r.ok, data: d }; });
          })
          .then(function(o) {
            if (o.ok) {
              var d = o.data;
              var cityId = d && d.city_id;
              var serviceId = d && d.service_id;
              var trainerId = d && d.trainer_id;
              if (cityId != null && serviceId != null && trainerId != null) {
                fetch('/api/webapp/client/session' + (initData() ? '?init_data=' + encodeURIComponent(initData()) : ''), {
                  method: 'POST',
                  headers: headers(),
                  body: JSON.stringify({ city_id: cityId, service_id: serviceId, arena_id: null, trainer_id: trainerId })
                }).then(function() {
                  alert('Сертификат активирован. Тренер и город подставлены — можете записаться на занятие.');
                }).catch(function() {
                  alert('Сертификат активирован. Выберите тренера в каталоге и запишитесь на занятие.');
                });
              } else {
                alert('Сертификат активирован. Выберите тренера в каталоге и запишитесь на занятие.');
              }
              codeInput.value = '';
              loadCertsList();
            } else {
              var detail = o.data && (o.data.detail || o.data.message);
              alert(detail || 'Код не найден или уже использован. Проверьте код или обратитесь к тренеру.');
            }
          })
          .catch(function() {
            alert('Ошибка сети. Попробуйте ещё раз.');
          });
      }

      document.getElementById('cert-btnActivateCert').onclick = activateCertificate;
      document.getElementById('certCodeInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          activateCertificate();
        }
      });

      loadCertsList();
    })();
  </script>
  <script src="mini-app-client-home.js"></script>
</body>
</html>
