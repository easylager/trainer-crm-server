<!DOCTYPE html>
<html lang="ru" data-client-support>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Идеи и поддержка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="client-mini-app-theme.js?v=202610303"></script>
  <link rel="stylesheet" href="/static/shared/glide-public-fonts.css?v=202610303" />
  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=202610303" />
  <link rel="stylesheet" href="theme.css?v=202610303" />
  <link rel="stylesheet" href="mini-app-client-theme.css?v=202610303" />
  <link rel="stylesheet" href="mini-app-components.css?v=202610303" />
  <link rel="stylesheet" href="mini-app-client-nav.css?v=202610303" />
  <script src="mini-app-telegram-chrome.js?v=202610303"></script>
  <!--
    TASK-303: «Наше комьюнити» и форма поддержки уехали с главной в «Ещё» (решение владельца 2026-10-19).
    Язык — сайта: токены --g-*, Dela Gothic в заголовке, свои шрифты.
  -->
  <style>
    html body.cs-body, html.trainer-theme-dark body.cs-body, html.trainer-theme-light body.cs-body {
      background: var(--g-bg) !important; color: var(--g-ink); font-family: var(--g-font); margin: 0;
    }
    .cs-head { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cs-wrap { padding: 4px 16px 32px; max-width: 560px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
    .cs-title { margin: 0; font: 400 28px/1.05 var(--g-font-display); letter-spacing: -.01em; }
    .cs-lead { margin: 0; font-size: 15px; line-height: 1.5; color: var(--g-ink-2); }
    .cs-card { background: var(--g-surface); border-radius: 20px; box-shadow: var(--g-shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .cs-label { font-size: 15px; font-weight: 600; }
    .cs-text {
      min-height: 120px; resize: vertical; border: 1px solid var(--g-line); border-radius: 14px; padding: 12px 14px;
      background: var(--g-bg); color: var(--g-ink); font: 400 16px/1.45 var(--g-font); box-sizing: border-box; width: 100%;
    }
    .cs-text:focus { outline: 2px solid var(--g-accent); outline-offset: 1px; border-color: transparent; }
    .cs-hint { margin: 0; font-size: 13px; color: var(--g-muted); }
    .cs-send {
      min-height: 48px; border: 0; border-radius: 14px; background: var(--g-accent); color: var(--g-on-accent);
      font: 700 16px/1 var(--g-font); cursor: pointer;
    }
    .cs-send:disabled { opacity: .6; cursor: default; }
    .cs-status { margin: 0; min-height: 20px; font-size: 14px; color: var(--g-ink-2); }
    .cs-status--ok { color: var(--g-accent-ink); }
    .cs-status--err { color: #c62828; }
    body.tg-dark .cs-status--err { color: #ff8a80; }
    .cs-foot { margin: 0; font-size: 14px; color: var(--g-muted); }
  </style>
</head>
<body class="cs-body">
  <div class="cs-head">
    <span></span>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" hidden>Назад</button>
    </div>
  </div>
  <main class="cs-wrap">
    <h1 class="cs-title">Развиваем Glide вместе</h1>
    <p class="cs-lead">Мы делаем проект вместе с вашими тренерами. Напишите, чего не хватает, что неудобно или просто доброе слово — мы читаем каждое сообщение и отвечаем в боте.</p>
    <form class="cs-card" id="supportForm" autocomplete="off">
      <label for="supportMessage" class="cs-label">Ваше сообщение</label>
      <textarea id="supportMessage" class="cs-text" name="message" maxlength="4000" placeholder="Идея, отзыв или нужна помощь" aria-describedby="supportHint"></textarea>
      <p id="supportHint" class="cs-hint">До 4000 символов.</p>
      <button type="submit" id="supportSubmit" class="cs-send">Отправить</button>
      <p id="supportStatus" class="cs-status" role="status" aria-live="polite"></p>
    </form>
    <p class="cs-foot">Нужна инструкция — команда /guide в боте.</p>
  </main>
  <script src="mini-app-client-home.js?v=202610303"></script>
  <script>
    (function () {
      'use strict';
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { try { tg.ready(); } catch (e) { /* */ } }
      var initData = (tg && tg.initData) || '';
      var form = document.getElementById('supportForm');
      var ta = document.getElementById('supportMessage');
      var btn = document.getElementById('supportSubmit');
      var status = document.getElementById('supportStatus');
      // Тёмная тема — токены сайта по body.tg-dark (как на главной).
      function syncDark() {
        document.body.classList.toggle('tg-dark', document.documentElement.classList.contains('hub-is-dark'));
      }
      syncDark();
      if (window.MutationObserver) {
        new MutationObserver(syncDark).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      }
      function say(text, kind) {
        status.textContent = text;
        status.className = 'cs-status' + (kind ? ' cs-status--' + kind : '');
      }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var text = (ta.value || '').trim();
        if (!text) return say('Напишите пару слов — что случилось или что хотите улучшить.', 'err');
        if (!initData) return say('Откройте страницу из бота или напишите через /guide.', 'err');
        btn.disabled = true;
        say('Отправляем…');
        fetch('/api/webapp/support?init_data=' + encodeURIComponent(initData), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData },
          body: JSON.stringify({ message: text, role: 'client' }),
        })
          .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (o) {
            btn.disabled = false;
            var sent = o.ok && o.data && o.data.ok !== false && o.data.id != null;
            if (sent) {
              ta.value = '';
              say('Спасибо! Прочитаем и ответим в боте.', 'ok');
              try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) { /* */ }
              return;
            }
            var detail = o.data && (o.data.detail || o.data.message);
            say((detail ? String(detail) : 'Не получилось отправить.') + ' Попробуйте через /guide в боте.', 'err');
          })
          .catch(function () {
            btn.disabled = false;
            say('Нет связи. Повторите позже или напишите через /guide в боте.', 'err');
          });
      });
    })();
  </script>
  <script src="/static/webapp/ga-touch.js?v=202610303"></script>
</body>
</html>
