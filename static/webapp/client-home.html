<!DOCTYPE html>
<html lang="ru" data-client-hub>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Главная</title>
  <!-- TASK-303: заголовки главной — Dela Gothic; без preload шрифт приходит после текста и строки прыгают. -->
  <link rel="preload" href="/static/fonts/glide-public/dela-gothic-one-cyr-lat.woff2?v=__FONT_V__" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/fonts/glide-public/golos-text-cyr-lat.woff2?v=__FONT_V__" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/shared/glide-public-fonts.css?v=2026102028" />
  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=2026102028" />
  <link rel="stylesheet" href="/static/shared/glide-components.css?v=2026102028" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="client-mini-app-theme.js?v=2026102028"></script>
<link rel="stylesheet" href="theme.css?v=2026102028" />
  <link rel="stylesheet" href="mini-app-client-theme.css?v=2026102028" />
  <link rel="stylesheet" href="mini-app-components.css?v=2026102028" />
  <script defer src="glide-deeplink.js?v=2026102028"></script>
  <script defer src="mini-app-telegram-chrome.js?v=2026102028"></script>
  <link rel="preload" href="client-home-main.js?v=2026102028" as="script" />
  <link rel="stylesheet" href="mini-app-client-home.css?v=2026102028" />
  <link rel="stylesheet" href="mini-app-client-shell.css?v=2026102028" />
  <link rel="stylesheet" href="hub-home.css?v=2026102028" />
  <script defer src="mini-app-empty-state.js?v=2026102028"></script>
  <script defer src="mini-app-more-icons.js?v=2026102028"></script>
  <script defer src="mini-app-client-shell.js?v=2026102028"></script>
  <script defer src="client-profile-switcher.js?v=2026102028"></script>
  <script defer src="mini-app-client-home.js?v=2026102028"></script>
  <!-- TASK-094: не снимать переход по пустой странице. -->
  <link rel="expect" href="#hubShell" blocking="render" />
</head>
<body class="hub-body hh-body hub-body--loading ar-pilot ar-pilot--client-home" data-client-shell="tabs">
  <div class="hub-shell" id="hubShell">

    <!--
      TASK-303 (PDEC-023): главная — продолжение страницы города на сайте. Шапка как
      glideclub.by/c/{город}: фото катка, «{Город} на льду», счётчики. Высота шапки
      зарезервирована (300px), до bootstrap — прошлый город из кэша или тёмная плашка.
    -->
    <header class="hh hh--loading" id="hubHero">
      <img class="hh__photo" id="hubHeroPhoto" alt="" fetchpriority="high" decoding="async" hidden>
      <div class="hh__shade" aria-hidden="true"></div>
      <div class="hh__in">
        <div class="hh__top">
          <a class="hh__city" id="hubCityPill" href="ice">
            <span id="hubCityLabel">Город</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </a>
          <div id="clientProfileSwitcherMount" class="hh__profile"></div>
        </div>
        <div class="hh__body">
          <span class="hh__kicker" id="hubGreeting"><span id="hubGreetingHello">Рады вас видеть</span><span id="hubGreetingSub" hidden></span></span>
          <h1 class="hh__title hh-display" id="hubHeroTitle"><span class="hh__skel hh__skel--title"></span></h1>
          <span class="hh__line" id="hubHeroLine"></span>
        </div>
      </div>
    </header>

    <main class="hm">
      <div id="stateMessage" class="state-panel loading" style="display:none;" role="status"></div>

      <!-- Слот «сейчас»: одна карточка по приоритету (лист «Слот» в макете). -->
      <section class="hn" id="hubNow" aria-live="polite">
        <div id="hubInitialSkel" class="hn__skel" role="status" aria-busy="true" aria-label="Загрузка главной"></div>
      </section>

      <section class="hs" id="hubMine" hidden>
        <h2 class="hs__title hh-display">Мои занятия</h2>
        <div id="nextBookingBlock"></div>
        <div id="myTrainerBlock" style="display:none;"></div>
        <section id="hubPrimaryPanel" class="hub-primary-panel" hidden></section>
        <div class="hh-rebook" id="hubRebook" hidden></div>
      </section>

      <section class="hs" id="hubNearest" hidden aria-labelledby="hubNearestTitle">
        <div class="hs__head">
          <h2 class="hs__title hh-display" id="hubNearestTitle">Ближайший лёд</h2>
          <a class="hs__more" id="hubNearestMore" href="ice">Весь день</a>
        </div>
        <div class="hl" id="hubNearestRow"></div>
      </section>

      <section class="hs" id="hubNeeds" hidden aria-labelledby="hubNeedsTitle">
        <h2 class="hs__title hh-display" id="hubNeedsTitle">Чем займёмся?</h2>
        <div class="hc hw" id="hubNeedsList"></div>
      </section>
    </main>

  </div>

  <script src="ru-text.js?v=2026102028"></script>
  <script src="catalog-public-url.js?v=2026102028"></script>
  <!-- TASK-160: «моя карточка» хаба — чистая модель + рендер, без DOM. -->
  <script src="hub-me-card.js?v=2026102028"></script>
  <!-- Падежи имени для подписей карточки; модуля нет — формы безпадежные. -->
  <script src="ru-person-name.js?v=2026102028"></script>
  <script src="hub-home.js?v=2026102028"></script>
  <script src="hub-bootstrap-parallel-model.js?v=2026102028"></script>
  <script defer src="client-home-main.js?v=2026102028"></script>
</body>
</html>
