<!DOCTYPE html>
<html lang="ru" data-client-hub>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Главная</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js?v=202605022"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" /></noscript>
  <link rel="stylesheet" href="theme.css?v=20260424" />
  <link rel="stylesheet" href="mini-app-components.css?v=20260424" />
  <script src="client-mini-app-theme.js"></script>
  <script>
    (function () {
      function applyClientHubTheme() {
        if (typeof window.__applyClientMiniAppTheme === 'function') window.__applyClientMiniAppTheme();
      }
      applyClientHubTheme();
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyClientHubTheme);
      }
      var tg0 = window.Telegram && window.Telegram.WebApp;
      if (tg0 && typeof tg0.onEvent === 'function') {
        try { tg0.onEvent('themeChanged', applyClientHubTheme); } catch (e) {}
      }
      window.__applyClientHubTheme = applyClientHubTheme;
    })();
  </script>
  <link rel="preload" href="client-home-main.js?v=20260557" as="script" />
  <link rel="stylesheet" href="mini-app-client-home.css?v=20260557" />
</head>
<body class="hub-body">
  <div class="hub-shell" id="hubShell">

    <!-- Hero heading — greeting + context label, updated by JS -->
    <div class="hub-hero" id="hubHero">
      <div class="hub-hero-greeting" id="hubGreeting">Привет 👋</div>
      <h1 class="hub-hero-title" id="hubHeroTitle">Ваш следующий шаг</h1>
      <p class="hub-hero-sub" id="hubHeroSub" style="display:none;"></p>
    </div>

    <!-- Error / loading panel -->
    <div id="stateMessage" class="state-panel loading" style="display:none;" role="status"></div>

    <!-- ── SCENARIO 3: NEXT BOOKING HERO CARD ──────────────────────────── -->
    <!-- Skeleton visible until JS loads; replaced with real data or hidden. -->
    <div id="nextBookingBlock">
      <div class="hub-skel-card hub-skel-shimmer" id="nextBookingSkel" role="status" aria-busy="true" aria-label="Загрузка ближайшей записи"></div>
    </div>

    <!-- ── SCENARIO 1: MY TRAINER CARD ────────────────────────────────── -->
    <div id="myTrainerBlock" style="display:none;"></div>

    <!-- ── QUICK ACTION PILLS ─────────────────────────────────────────── -->
    <!-- Rendered by JS based on scenario; skeleton strip shown on load.  -->
    <div class="hub-quick-strip" id="quickStrip">
      <!-- JS will fill or replace; placeholder renders 3 skel pills -->
      <div class="hub-quick-pill" style="opacity:0.35;pointer-events:none;min-width:100px;height:38px;border-radius:14px;background:var(--tg-theme-secondary-bg-color);"></div>
      <div class="hub-quick-pill" style="opacity:0.25;pointer-events:none;min-width:80px;height:38px;border-radius:14px;background:var(--tg-theme-secondary-bg-color);"></div>
      <div class="hub-quick-pill" style="opacity:0.18;pointer-events:none;min-width:90px;height:38px;border-radius:14px;background:var(--tg-theme-secondary-bg-color);"></div>
    </div>

    <!-- ── UPCOMING BOOKINGS LIST (secondary, below hero) ─────────────── -->
    <div id="upcomingSection" style="display:none;">
      <div class="hub-section-wrap">
        <div class="hub-section-head">
          <span class="hub-section-title">Все записи</span>
          <button type="button" class="hub-section-link" id="btnAllBookings">Смотреть все</button>
        </div>
        <div id="bookingsBlock">
          <div class="hub-bookings-skel" role="status" aria-busy="true" aria-label="Загрузка записей">
            <div class="hub-skel-row">
              <div class="hub-skel-line hub-skel-line--time hub-skel-shimmer" aria-hidden="true"></div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
                <div class="hub-skel-line hub-skel-line--primary hub-skel-shimmer" aria-hidden="true"></div>
                <div class="hub-skel-line hub-skel-line--secondary hub-skel-shimmer" aria-hidden="true"></div>
              </div>
            </div>
            <div class="hub-skel-row">
              <div class="hub-skel-line hub-skel-line--time hub-skel-shimmer" aria-hidden="true"></div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
                <div class="hub-skel-line hub-skel-line--primary hub-skel-shimmer" aria-hidden="true"></div>
                <div class="hub-skel-line hub-skel-line--secondary hub-skel-shimmer" aria-hidden="true"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── EXPLORE / SECTIONS GRID ────────────────────────────────────── -->
    <div id="exploreSection">
      <div style="padding:0 18px;margin-bottom:12px;">
        <div class="hub-section-head">
          <span class="hub-section-title" id="exploreSectionTitle">Разделы</span>
        </div>
      </div>
      <div class="hub-explore-grid" id="hubGrid"></div>
    </div>

    <div class="hub-footnote" id="hubFootnote">
      <strong>Подсказка:</strong> нужна помощь или есть вопрос — откройте <strong>чат с ботом</strong> и отправьте <strong>/guide</strong>: там справка и как написать в поддержку.
    </div>

  </div>
  <script defer src="client-home-main.js?v=20260557"></script>
</body>
</html>
