<!DOCTYPE html>
<html lang="ru" data-client-hub>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Главная</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js?v=20260501"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=optional" /></noscript>
  <link rel="stylesheet" href="theme.css?v=20260424" />
  <link rel="stylesheet" href="mini-app-components.css?v=20260424" />
  <script src="client-mini-app-theme.js"></script>
  <script>
    (function () {
      function applyClientHubTheme() {
        if (typeof window.__applyClientMiniAppTheme === 'function') window.__applyClientMiniAppTheme();
      }
      applyClientHubTheme();
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyClientHubTheme);
      }
      var tg0 = window.Telegram && window.Telegram.WebApp;
      if (tg0 && typeof tg0.onEvent === 'function') {
        try { tg0.onEvent('themeChanged', applyClientHubTheme); } catch (e) {}
      }
      window.__applyClientHubTheme = applyClientHubTheme;
    })();
  </script>
  <link rel="preload" href="client-home-main.js?v=20260425" as="script" />
  <link rel="stylesheet" href="mini-app-client-home.css?v=20260424" />
</head>
<body class="hub-body">
  <div class="hub-shell" id="hubShell">
    <header class="hub-header">
      <div>
        <h1 class="hub-header-title" id="hubPageTitle">Главная</h1>
      </div>
    </header>

    <div class="hub-quick-grid hub-quick-grid--start" id="hubQuickGrid">
      <button type="button" class="hub-quick-action" data-action="catalog">
        <svg class="hub-quick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <div><div class="hub-quick-label">Записаться к тренеру</div><div class="hub-quick-hint">Каталог, фильтры и слоты</div></div>
      </button>
      <button type="button" class="hub-quick-action" data-action="bookings">
        <svg class="hub-quick-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <div><div class="hub-quick-label">Мои записи</div><div class="hub-quick-hint">Что уже запланировано</div></div>
      </button>
    </div>

    <div class="hub-stats" id="hubStats" style="display:none;" aria-hidden="true">
      <div class="hub-stat-card" id="statToday">
        <div class="hub-stat-value" id="statTodayValue">—</div>
        <div class="hub-stat-label">Сегодня</div>
      </div>
      <div class="hub-stat-card">
        <div class="hub-stat-value" id="statWeekValue">—</div>
        <div class="hub-stat-label">На неделе</div>
      </div>
      <div class="hub-stat-card">
        <div class="hub-stat-value" id="statRequestsValue">—</div>
        <div class="hub-stat-label">Заявки</div>
      </div>
    </div>

    <div id="stateMessage" class="state-panel loading" style="display:none;" role="status"></div>

    <div class="hub-section-head">
      <div class="hub-section-title">Ближайшие записи</div>
    </div>
    <!-- Skeleton before deferred client-home-main.js runs (avoids empty block + layout jump). Mirrors buildClientHubBookingsSkeletonHtml(). -->
    <div id="bookingsBlock">
      <div class="hub-bookings-skel" role="status" aria-busy="true" aria-label="Загрузка записей">
        <div class="hub-skel-row">
          <div class="hub-skel-line hub-skel-line--time hub-skel-shimmer" aria-hidden="true"></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
            <div class="hub-skel-line hub-skel-line--primary hub-skel-shimmer" aria-hidden="true"></div>
            <div class="hub-skel-line hub-skel-line--secondary hub-skel-shimmer" aria-hidden="true"></div>
          </div>
        </div>
        <div class="hub-skel-row">
          <div class="hub-skel-line hub-skel-line--time hub-skel-shimmer" aria-hidden="true"></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
            <div class="hub-skel-line hub-skel-line--primary hub-skel-shimmer" aria-hidden="true"></div>
            <div class="hub-skel-line hub-skel-line--secondary hub-skel-shimmer" aria-hidden="true"></div>
          </div>
        </div>
        <div class="hub-skel-row">
          <div class="hub-skel-line hub-skel-line--time hub-skel-shimmer" aria-hidden="true"></div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;">
            <div class="hub-skel-line hub-skel-line--primary hub-skel-shimmer" aria-hidden="true"></div>
            <div class="hub-skel-line hub-skel-line--secondary hub-skel-shimmer" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="hub-section-head">
      <div class="hub-section-title">Все разделы</div>
    </div>
    <div class="hub-grid" id="hubGrid"></div>

    <div class="hub-footnote" id="hubFootnote">
      <strong>Подсказка:</strong> команды в чате — <strong>/guide</strong> (помощь), <strong>/home</strong> (эта страница). Меню слева от поля ввода тоже ведёт сюда, если у бота включена веб-кнопка.
    </div>
  </div>
  <script defer src="client-home-main.js?v=20260425"></script>
</body>
</html>
