<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Подписка школы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <script src="mini-app-full-height.js?v=2026100514"></script>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <script src="mini-app-trainer-theme.js?v=2026100514"></script>
  <script src="mini-app-telegram-chrome.js?v=2026100514"></script>
  <link rel="stylesheet" href="theme.css?v=2026100514" />
  <link rel="stylesheet" href="mini-app-components.css?v=2026100514" />
  <link rel="stylesheet" href="mini-app-trainer-theme.css?v=2026100514" />
  <link rel="stylesheet" href="mini-app-org-shell.css?v=2026100514" />
</head>
<body>
  <header class="org-back-header">
    <button type="button" class="org-back-header__btn" id="orgSubBack" aria-label="Назад">‹</button>
    <span class="org-back-header__title">Подписка</span>
  </header>

  <main>
    <div class="org-home-state org-home-state--loading" id="orgSubLoading">
      <p>Загрузка</p>
    </div>

    <section id="orgSubRoot" hidden>
      <div class="org-home-status" id="orgSubStatus">
        <span class="org-home-status__dot" aria-hidden="true"></span>
        <span id="orgSubStatusText"></span>
      </div>

      <div class="org-subscription-card" id="orgSubCard" hidden>
        <p class="org-subscription-card__title" id="orgSubTier"></p>
        <p class="org-subscription-card__meta" id="orgSubExpires"></p>
      </div>

      <p class="org-subscription-support" id="orgSubSupport" hidden></p>
    </section>

    <div class="org-home-state org-home-state--error" id="orgSubError" hidden>
      <p id="orgSubErrorText">Не удалось загрузить раздел</p>
      <button type="button" class="btn-secondary" id="orgSubRetry">Повторить</button>
    </div>
  </main>

  <script defer src="org-subscription-main.js?v=2026100514"></script>
</body>
</html>
