<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Моё расписание</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
      padding: 12px;
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 8px;
    }
    .header-title { flex: 1; }
    .btn-close {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      cursor: pointer;
    }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      cursor: pointer;
    }
    .filter-btn.active {
      background: #F7A600;
      color: #1a1a1a;
    }
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .week-nav span {
      font-weight: 600;
      font-size: 15px;
    }
    .week-nav button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .day-block {
      margin-bottom: 20px;
    }
    .day-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .slot-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin-bottom: 6px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color);
    }
    .slot-time {
      font-weight: 600;
      font-size: 15px;
    }
    .slot-status {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .slot-status.available {
      background: rgba(52, 199, 89, 0.2);
      color: #34c759;
    }
    .slot-status.booked {
      background: rgba(255, 149, 0, 0.2);
      color: #ff9500;
    }
    .slot-status.cancelled {
      background: rgba(142, 142, 147, 0.2);
      color: var(--tg-theme-hint-color);
    }
    .loading, .error {
      text-align: center;
      padding: 24px;
      color: var(--tg-theme-hint-color);
    }
    .error { color: #ff3b30; }
    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--tg-theme-hint-color);
      font-size: 15px;
    }
    /* JUSTSKATE.BY — жёстко перебиваем тему Telegram */
    body { background: #FFFBEB !important; color: #1a1a1a !important; }
    .btn-close, .filter-btn, .week-nav button, .slot-card { background: #FFF3CC !important; color: #1a1a1a !important; }
    .filter-btn.active { background: #F7A600 !important; color: #1a1a1a !important; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a !important; color: #f5f5f5 !important; }
      .btn-close, .filter-btn, .week-nav button, .slot-card { background: #2a2a2a !important; color: #f5f5f5 !important; }
    }
  </style>
</head>
<body>
  <script>
  (function(){var d=document.documentElement;d.style.setProperty('--tg-theme-button-color','#F7A600');d.style.setProperty('--tg-theme-button-text-color','#1a1a1a');d.style.setProperty('--tg-theme-bg-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#1a1a1a':'#FFFBEB');d.style.setProperty('--tg-theme-text-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#f5f5f5':'#1a1a1a');d.style.setProperty('--tg-theme-secondary-bg-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#2a2a2a':'#FFF3CC');})();
  </script>
  <div class="header">
    <span class="header-title">📋 Применённое расписание</span>
  </div>
  <p style="font-size:13px;color:var(--tg-theme-hint-color);margin:-8px 0 8px;"><a href="/webapp/schedule-editor" style="color:var(--tg-theme-button-color);">📅 Расписание</a> — редактировать шаблон и слоты</p>
  <div class="filters">
    <button type="button" class="filter-btn active" data-filter="all">Все</button>
    <button type="button" class="filter-btn" data-filter="available">Свободны</button>
    <button type="button" class="filter-btn" data-filter="booked">Заняты</button>
  </div>
  <div class="week-nav">
    <button type="button" id="prevWeek" aria-label="Назад">‹</button>
    <span id="weekLabel">—</span>
    <button type="button" id="nextWeek" aria-label="Вперёд">›</button>
  </div>
  <div id="content">
    <div class="loading">Загрузка...</div>
  </div>

  <script>
    (function() {
      const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      var btnClose = document.getElementById("btnClose");
      if (btnClose) btnClose.onclick = function() {
        if (tg) tg.close(); else window.close();
      };

      let allSlots = [];
      let currentWeekStart = getMonday(new Date());
      let currentFilter = 'all';

      function getMonday(d) {
        const date = new Date(d);
        const day = date.getDay();
        const diff = date.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(date.setDate(diff));
      }

      function formatWeekLabel(start) {
        const end = new Date(start);
        end.setDate(end.getDate() + 6);
        const fmt = d => d.getDate() + ' ' + MONTHS[d.getMonth()];
        return fmt(start) + ' – ' + fmt(end);
      }

      function formatDateKey(dateStr) {
        const d = new Date(dateStr + 'T12:00:00');
        return d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0') + ' (' + DAYS[d.getDay() === 0 ? 6 : d.getDay() - 1] + ')';
      }

      function statusLabel(status) {
        return status === 'available' ? 'свободен' : status === 'booked' ? 'занят' : 'отменён';
      }

      async function fetchSchedule(fromDate, toDate) {
        const from = fromDate.toISOString().slice(0, 10);
        const to = toDate.toISOString().slice(0, 10);
        const initData = tg?.initData || '';
        const url = '/api/webapp/schedule?from_date=' + encodeURIComponent(from) + '&to_date=' + encodeURIComponent(to);
        const headers = {};
        if (initData) headers['X-Telegram-Init-Data'] = initData;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        let res;
        try {
          res = await fetch(url, { headers: headers, signal: controller.signal });
        } catch (e) {
          clearTimeout(timeoutId);
          if (e.name === 'AbortError') throw new Error('Превышено время ожидания. Проверьте интернет и откройте снова.');
          throw new Error(e.message || 'Ошибка сети');
        }
        clearTimeout(timeoutId);
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || res.statusText);
        }
        return res.json();
      }

      function filterSlots(slots) {
        if (currentFilter === 'all') return slots;
        return slots.filter(s => s.status === currentFilter);
      }

      function render(slots) {
        const todayStr = new Date().toISOString().slice(0, 10);
        const filtered = filterSlots(slots).filter(s => s.slot_date >= todayStr);
        const byDay = {};
        filtered.forEach(s => {
            const key = s.slot_date;
            if (!byDay[key]) byDay[key] = [];
            byDay[key].push(s);
          });
        const days = Object.keys(byDay).sort();

        if (days.length === 0) {
          document.getElementById('content').innerHTML = '<div class="empty">Нет слотов на эту неделю</div>';
          return;
        }

        let html = '';
        days.forEach(dateKey => {
          const daySlots = byDay[dateKey].sort((a, b) => (a.start_time || '').localeCompare(b.start_time || ''));
          html += '<div class="day-block"><div class="day-title">' + formatDateKey(dateKey) + '</div>';
          daySlots.forEach(s => {
            html += '<div class="slot-card">';
            html += '<span class="slot-time">' + (s.start_time || '') + '–' + (s.end_time || '') + '</span>';
            html += '<span class="slot-status ' + (s.status || 'available') + '">' + statusLabel(s.status) + '</span>';
            html += '</div>';
          });
          html += '</div>';
        });
        document.getElementById('content').innerHTML = html;
      }

      async function load() {
        const content = document.getElementById('content');
        content.innerHTML = '<div class="loading">Загрузка...</div>';
        const weekEnd = new Date(currentWeekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        try {
          const data = await fetchSchedule(currentWeekStart, weekEnd);
          allSlots = data.slots || [];
          document.getElementById('weekLabel').textContent = formatWeekLabel(currentWeekStart);
          render(allSlots);
        } catch (e) {
          content.innerHTML = '<div class="error">' + (e.message || 'Ошибка загрузки') + '</div>';
        }
      }

      document.getElementById('prevWeek').onclick = () => {
        currentWeekStart.setDate(currentWeekStart.getDate() - 7);
        load();
      };
      document.getElementById('nextWeek').onclick = () => {
        currentWeekStart.setDate(currentWeekStart.getDate() + 7);
        load();
      };

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          render(allSlots);
        };
      });

      load();
    })();
  </script>
</body>
</html>
