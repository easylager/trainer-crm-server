<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Мои сертификаты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="client-mini-app-theme.js?v=202608315"></script>
  <link rel="stylesheet" href="theme.css?v=202608315" />
  <link rel="stylesheet" href="mini-app-client-theme.css?v=202608315" />
  <link rel="stylesheet" href="mini-app-components.css?v=202608315" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <script src="mini-app-telegram-chrome.js?v=202608315"></script>
  <style>
    body {
      font-family: var(--app-font-sans);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .header-title { flex: 1; }
    .loading, .error { text-align: center; padding: 32px 16px; color: var(--tg-theme-hint-color); }
    .error { color: var(--app-danger); }
    .empty { text-align: center; padding: 32px 16px; color: var(--tg-theme-hint-color); font-size: 15px; }
    .cert-card {
      padding: 16px 18px;
      margin-bottom: 10px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color);
      border-left: 4px solid var(--tg-theme-button-color);
    }
    .cert-card .title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .cert-card .meta { font-size: 14px; color: var(--tg-theme-hint-color); }
    .cert-card .code { font-family: monospace; font-size: 15px; letter-spacing: 1px; margin-top: 8px; }
    .cert-card.redeemed { opacity: 0.8; }
    .cert-activate-row { display: flex; gap: 8px; align-items: stretch; }
    .cert-code-input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(128, 128, 128, 0.22);
      font-size: 14px;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
    }
    .cert-code-input::placeholder { color: var(--tg-theme-hint-color); }
    #btnActivateCert.btn-primary {
      flex-shrink: 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .cert-sample-preview {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 18px;
      padding: 14px 14px 16px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.2);
    }
    .cert-sample-preview__icon { font-size: 28px; line-height: 1; flex-shrink: 0; }
    .cert-sample-preview__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--tg-theme-text-color);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .cert-sample-preview__text {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--tg-theme-hint-color);
    }
    .cert-sample-preview__btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      box-shadow: 0 3px 12px rgba(16, 185, 129, 0.22);
    }
  </style>
  <link rel="stylesheet" href="mini-app-client-nav.css?v=202608315" />
  <link rel="stylesheet" href="mini-app-arena-ribbon.css?v=202608315" />
</head>
<body class="ar-pilot ar-pilot--client-certificates">
  <div class="header">
    <span class="header-title">🎁 Мои сертификаты</span>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" hidden>Назад</button>
    </div>
  </div>
  <div id="activateBlock" style="margin-bottom: 16px;">
    <label for="certCodeInput" style="display:block;font-size:14px;margin-bottom:6px;color:var(--tg-theme-hint-color);">
      Введите код подарочного сертификата:
    </label>
    <div class="cert-activate-row">
      <input id="certCodeInput" class="cert-code-input" type="text" placeholder="Например, CERT-ABC123">
      <button type="button" class="btn-primary" id="btnActivateCert">Активировать</button>
    </div>
  </div>
  <div class="cert-sample-preview" id="certSamplePreview">
    <div class="cert-sample-preview__icon" aria-hidden="true">📄</div>
    <div>
      <div class="cert-sample-preview__title">Пример PDF на почте</div>
      <p class="cert-sample-preview__text">Так выглядит вложение с подарочным сертификатом (тестовые данные). Настоящий файл тренер отправит на ваш email после оплаты.</p>
      <a class="cert-sample-preview__btn" id="certSamplePdfLink" href="#" target="_blank" rel="noopener noreferrer">Открыть пример PDF</a>
    </div>
  </div>
  <div id="listContent"></div>
  <script>
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }
      function initData() { return (tg && tg.initData) ? tg.initData : ''; }
      function headers() {
        var h = { 'Content-Type': 'application/json' };
        var id = initData();
        if (id) h['X-Telegram-Init-Data'] = id;
        return h;
      }
      function escapeHtml(s) {
        if (s == null) return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
      function formatAmount(cents) {
        if (cents == null || cents === 0) return 'Любая сумма';
        return (cents / 100).toFixed(0) + ' BYN';
      }
      function formatDate(iso) {
        if (!iso) return '';
        try {
          var d = new Date(iso);
          return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
        } catch (e) { return ''; }
      }
      function statusLabel(status) {
        if (status === 'redeemed') return 'Погашен';
        if (status === 'activated') return 'Активирован';
        if (status === 'issued') return 'Выдан (ожидает активации)';
        if (status === 'expired') return 'Истёк';
        if (status === 'cancelled') return 'Отменён';
        return status || 'Активен';
      }
      function updateCertSamplePdfHref() {
        var a = document.getElementById('certSamplePdfLink');
        if (!a) return;
        var q = initData() ? '?init_data=' + encodeURIComponent(initData()) : '';
        var path = '/api/webapp/client/certificates/sample-pdf' + q;
        try {
          a.href = new URL(path, window.location.origin).href;
        } catch (e) {
          a.href = path;
        }
      }

      function loadList() {
        updateCertSamplePdfHref();
        var url = '/api/webapp/client/certificates' + (initData() ? '?init_data=' + encodeURIComponent(initData()) : '');
        document.getElementById('listContent').innerHTML = '<div class="loading">Загрузка…</div>';
        fetch(url, { headers: headers() })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var items = data.items || [];
            if (items.length === 0) {
              document.getElementById('listContent').innerHTML = '<div class="empty">Пока нет сертификатов.</div>';
              return;
            }
            var html = '';
            items.forEach(function(c) {
              var cardClass = 'cert-card';
              if (c.status === 'redeemed' || c.status === 'expired' || c.status === 'cancelled') cardClass += ' redeemed';
              var meta = escapeHtml(c.trainer_name) + ' · ' + formatAmount(c.amount_cents) + ' · ' + statusLabel(c.status);
              if (c.issued_at) meta += ' · выдано ' + formatDate(c.issued_at);
              html += '<div class="' + cardClass + '">';
              html += '<div class="title">' + escapeHtml(c.code) + '</div>';
              html += '<div class="meta">' + meta + '</div>';
              html += '</div>';
            });
            document.getElementById('listContent').innerHTML = html;
          })
          .catch(function() {
            document.getElementById('listContent').innerHTML = '<div class="error">Не удалось загрузить. Откройте из бота.</div>';
          });
      }

      function activateCertificate() {
        var codeInput = document.getElementById('certCodeInput');
        var code = (codeInput.value || '').trim();
        if (!code) {
          alert('Введите код сертификата');
          return;
        }
        var url = '/api/webapp/client/certificates/activate' + (initData() ? '?init_data=' + encodeURIComponent(initData()) : '');
        fetch(url, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ code: code })
        })
          .then(function(r) {
            return r.json().then(function(d) { return { ok: r.ok, data: d }; });
          })
          .then(function(o) {
            if (o.ok) {
              var d = o.data;
              var cityId = d && d.city_id;
              var serviceId = d && d.service_id;
              var trainerId = d && d.trainer_id;
              if (cityId != null && serviceId != null && trainerId != null) {
                fetch('/api/webapp/client/session' + (initData() ? '?init_data=' + encodeURIComponent(initData()) : ''), {
                  method: 'POST',
                  headers: headers(),
                  body: JSON.stringify({ city_id: cityId, service_id: serviceId, arena_id: null, trainer_id: trainerId })
                }).then(function() {
                  alert('Сертификат активирован. Тренер и город подставлены — можете записаться на занятие.');
                }).catch(function() {
                  alert('Сертификат активирован. Выберите тренера в каталоге и запишитесь на занятие.');
                });
              } else {
                alert('Сертификат активирован. Выберите тренера в каталоге и запишитесь на занятие.');
              }
              codeInput.value = '';
              loadList();
            } else {
              var detail = o.data && (o.data.detail || o.data.message);
              alert(detail || 'Код не найден или уже использован. Проверьте код или обратитесь к тренеру.');
            }
          })
          .catch(function() {
            alert('Ошибка сети. Попробуйте ещё раз.');
          });
      }

      document.getElementById('btnActivateCert').onclick = activateCertificate;
      document.getElementById('certCodeInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          activateCertificate();
        }
      });

      var certSamplePdfLink = document.getElementById('certSamplePdfLink');
      if (certSamplePdfLink) {
        certSamplePdfLink.addEventListener('click', function(ev) {
          if (tg && typeof tg.openLink === 'function') {
            ev.preventDefault();
            tg.openLink(certSamplePdfLink.href, { try_instant_view: false });
          }
        });
      }

      loadList();
    })();
  </script>
  <script src="mini-app-client-home.js?v=202608315"></script>
</body>
</html>
