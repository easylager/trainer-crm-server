<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Сейчас · Админ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js?v=202608315"></script>
  <link rel="stylesheet" href="theme.css?v=202609041" />
  <link rel="stylesheet" href="admin-analytics-shared.css?v=202608315" />
  <style>
    .pulse-action { border-color: rgba(var(--accent-rgb), 0.45); background: rgba(var(--accent-rgb), 0.12); }
    .pulse-action.danger { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.12); }
    .pulse-ok { font-size: 13px; color: var(--tg-theme-hint-color); padding: 8px 0 4px; }
    .plan-paid { color: #86efac; }
    .plan-trial { color: #fde68a; }
  </style>
</head>
<body>
  <div class="adm-header">
    <h1>Сейчас</h1>
    <div class="adm-sub">Что происходит с системой сегодня</div>
  </div>
  <div id="content">
    <div class="adm-loading">Загрузка…</div>
  </div>
  <script src="admin-analytics-shared.js?v=202608315"></script>
  <script>
    (function () {
      var A = window.AdmAnalytics;

      function deltaLine(cur, prev) {
        cur = +cur || 0;
        prev = +prev || 0;
        if (prev === 0 && cur === 0) return 'как неделю назад';
        if (prev === 0) return 'неделю назад было 0';
        var pct = Math.round((cur - prev) * 1000 / prev) / 10;
        var cls = A.deltaClass(pct);
        var arrow = cls === 'up' ? '▲' : cls === 'down' ? '▼' : '•';
        return arrow + ' ' + A.formatPct(pct) + ' к прошлой неделе (' + A.formatNum(prev) + ')';
      }

      function planLabel(plan) {
        if (plan === 'paid') return '<span class="plan-paid">платный</span>';
        if (plan === 'trial') return '<span class="plan-trial">триал</span>';
        return '—';
      }

      function render(d) {
        var html = '';
        var actionCount = d.action_count || 0;
        html += '<div class="adm-kpi-grid">';
        html += '<div class="adm-kpi"><div class="adm-kpi-label">Занятия сегодня</div>' +
          '<div class="adm-kpi-value">' + A.formatNum(d.bookings_today) + '</div>' +
          '<div class="adm-kpi-sub">на неделю впереди: ' + A.formatNum(d.bookings_upcoming_week) + '</div></div>';
        html += '<div class="adm-kpi"><div class="adm-kpi-label">Живые тренеры (7 дн)</div>' +
          '<div class="adm-kpi-value">' + A.formatNum(d.trainers_live_7d) + '</div>' +
          '<div class="adm-kpi-sub">' + deltaLine(d.trainers_live_7d, d.trainers_live_prev_7d) + '</div></div>';
        html += '<div class="adm-kpi"><div class="adm-kpi-label">Занятия за 7 дн</div>' +
          '<div class="adm-kpi-value">' + A.formatNum(d.sessions_7d) + '</div>' +
          '<div class="adm-kpi-sub">' + deltaLine(d.sessions_7d, d.sessions_prev_7d) + '</div></div>';
        html += '<div class="adm-kpi"><div class="adm-kpi-label">MRR</div>' +
          '<div class="adm-kpi-value">' + A.formatBYN(d.mrr_cents, { compact: true }) + '</div>' +
          '<div class="adm-kpi-sub">оплат за 7 дн: ' + A.formatBYN(d.revenue_paid_7d_cents, { compact: true }) +
          ' · платных: ' + A.formatNum(d.active_paid_subscriptions) + '</div></div>';
        html += '</div>';

        html += '<div class="adm-section"><div class="adm-section-title">Сделать сегодня';
        if (actionCount) html += ' · ' + A.formatNum(actionCount);
        html += '</div>';

        var hasAction = false;
        var mods = d.action_moderation || [];
        if (mods.length) {
          hasAction = true;
          html += '<div class="adm-card pulse-action tight"><div class="adm-list-title">Модерация · ' + mods.length + '</div>';
          html += '<div class="adm-list-meta">Очередь /pending в боте</div>';
          html += mods.map(function (t) {
            return '<div style="margin-top:8px"><b>' + A.escapeHtml(t.display_name) + '</b>' +
              ' <span class="adm-list-meta">#' + t.trainer_id +
              (t.submitted_at ? ' · ' + A.formatDate(t.submitted_at) : '') + '</span></div>';
          }).join('');
          html += '</div>';
        }
        if ((d.support_new_count || 0) > 0) {
          hasAction = true;
          html += '<div class="adm-card pulse-action tight"><div class="adm-list-title">Поддержка · ' +
            A.formatNum(d.support_new_count) + '</div>' +
            '<div class="adm-list-meta">Ответить командой /support</div></div>';
        }
        var exp = d.action_expiring_paid || [];
        if (exp.length) {
          hasAction = true;
          html += '<div class="adm-card pulse-action tight"><div class="adm-list-title">Истекают платные ≤7 дн · ' + exp.length + '</div>';
          html += exp.map(function (t) {
            return '<div style="margin-top:8px"><b>' + A.escapeHtml(t.display_name) + '</b>' +
              ' <span class="adm-list-meta">#' + t.trainer_id + ' · осталось ' + t.days_left + ' дн.</span></div>';
          }).join('');
          html += '</div>';
        }
        var sleep = d.action_sleeping_paid || [];
        if (sleep.length) {
          hasAction = true;
          html += '<div class="adm-card pulse-action danger tight"><div class="adm-list-title">Платящие без записи >14 дн · ' + sleep.length + '</div>';
          html += sleep.map(function (t) {
            var since = t.days_since != null ? t.days_since + ' дн. назад' : 'записей не было';
            return '<div style="margin-top:8px"><b>' + A.escapeHtml(t.display_name) + '</b>' +
              ' <span class="adm-list-meta">#' + t.trainer_id + ' · ' + since + '</span></div>';
          }).join('');
          html += '</div>';
        }
        if (!hasAction) {
          html += '<div class="pulse-ok">Очереди нет: модерация, поддержка и платящие в порядке.</div>';
        }
        html += '</div>';

        html += '<div class="adm-section"><div class="adm-section-title">Кто реально работает</div>';
        var live = d.live_trainers || [];
        if (!live.length) {
          html += '<div class="adm-card"><div class="adm-empty">За 30 дней нет активных тренеров с записями или подпиской</div></div>';
        } else {
          html += '<div class="adm-card" style="padding:0"><div class="adm-scroll"><table class="adm-table"><thead><tr>';
          html += '<th>Тренер</th><th class="num">7 дн</th><th>Последняя</th><th>План</th>';
          html += '</tr></thead><tbody>';
          live.forEach(function (t) {
            html += '<tr>';
            html += '<td>' + A.escapeHtml(t.display_name) + ' <span style="opacity:.5">#' + t.trainer_id + '</span></td>';
            html += '<td class="num">' + A.formatNum(t.bookings_7d) + '</td>';
            html += '<td>' + A.formatDate(t.last_booking_date) + '</td>';
            html += '<td>' + planLabel(t.plan) + '</td>';
            html += '</tr>';
          });
          html += '</tbody></table></div></div>';
        }
        var ghosts = d.ghost_trainers_count || 0;
        if (ghosts) {
          html += '<div class="adm-hint">Пустых регистраций без Telegram и профиля: ' + A.formatNum(ghosts) + ' — в список не входят.</div>';
        }
        html += '</div>';

        return html;
      }

      A.mount({ endpoint: '/admin/stats', render: render });
    })();
  </script>
</body>
</html>
