<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Предложить место</title>
  <!-- PDEC-028: та же форма, что на сайте /suggest; автор известен из initData — шага «Связь» нет. -->
  <link rel="stylesheet" href="/static/shared/glide-public-fonts.css?v=202610293" />
  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=202610293" />
  <link rel="stylesheet" href="/static/shared/place-suggest-form.css?v=202610293" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; min-height: 100%; background: var(--g-bg); }
    #psf-root { min-height: 100vh; min-height: var(--tg-viewport-stable-height, 100vh); }
  </style>
</head>
<body>
  <div id="psf-root"></div>
  <script src="/static/shared/place-suggest-form.js?v=202610293"></script>
  <script>
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      try { tg.ready(); tg.expand(); } catch (e) { /* старый клиент */ }
      document.body.classList.toggle('tg-dark', tg.colorScheme === 'dark');
      if (tg.onEvent) tg.onEvent('themeChanged', function () {
        document.body.classList.toggle('tg-dark', tg.colorScheme === 'dark');
      });
    }
    var params = new URLSearchParams(location.search);
    var prefill = null;
    if (params.get('city_id') && params.get('city_name')) {
      prefill = {
        city_id: Number(params.get('city_id')), name: params.get('city_name'),
        region: params.get('city_region') || null, country: params.get('city_country') || 'BY', is_new: false
      };
    }
    function fail(msg) { var e = new Error(msg); e.userMessage = msg; return e; }
    window.PlaceSuggestForm.mount(document.getElementById('psf-root'), {
      askContact: false,
      honeypot: false,
      prefillCity: prefill,
      citiesUrl: '/api/public/place-suggestions/cities',
      onClose: function () {
        if (history.length > 1) history.back();
        else if (tg && tg.close) tg.close();
      },
      submit: function (payload) {
        return fetch('/api/webapp/place-suggestions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json', Accept: 'application/json',
            'X-Telegram-Init-Data': (tg && tg.initData) || ''
          },
          body: JSON.stringify(payload)
        }).then(function (r) {
          if (r.ok) {
            if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} }
            return r.json();
          }
          if (r.status === 429) throw fail('Слишком много заявок подряд. Попробуйте через час.');
          return r.json().catch(function () { return {}; }).then(function (b) {
            throw fail(typeof b.detail === 'string' ? b.detail : 'Не получилось отправить. Попробуйте ещё раз.');
          });
        });
      }
    });
  })();
  </script>
</body>
</html>
