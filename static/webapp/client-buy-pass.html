<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Абонементы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
      padding: 12px;
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    .header {
      display: block;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .header-title { display: block; margin-bottom: 12px; }
    .btn-back-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(128,128,128,0.15);
      font-size: 14px;
      font-weight: 600;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      cursor: pointer;
    }
    .btn-back-header:active { opacity: 0.75; }
    .loading, .error { text-align: center; padding: 32px 16px; color: var(--tg-theme-hint-color); }
    .error { color: #ef4444; }
    .empty { text-align: center; padding: 32px 16px; color: var(--tg-theme-hint-color); }
    .info-block {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--tg-theme-text-color);
    }
    .info-block .info-title { font-weight: 600; margin-bottom: 8px; font-size: 15px; }
    .info-block .info-text { color: var(--tg-theme-hint-color); }
    .savings-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(52, 199, 89, 0.2);
      color: #34c759;
    }
    .product-card {
      display: block;
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 10px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color);
      border: none;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .product-card:active { opacity: 0.9; }
    .product-card.selected { outline: 2px solid var(--tg-theme-button-color); outline-offset: 2px; }
    .product-card .title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .product-card .meta { font-size: 14px; color: var(--tg-theme-hint-color); }
    .btn-pay {
      display: block;
      width: 100%;
      padding: 14px 18px;
      margin-top: 20px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      cursor: pointer;
    }
    .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-pay:active:not(:disabled) { opacity: 0.9; }
    [data-screen] { display: none; }
    [data-screen].active { display: block; }
    .success-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
    .success-hint { font-size: 15px; color: var(--tg-theme-hint-color); margin-bottom: 20px; }
    .btn-my-passes {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    body { background: #FFFBEB !important; color: #1a1a1a !important; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a !important; color: #f5f5f5 !important; }
    }
  </style>
</head>
<body>
  <script>
  (function(){var d=document.documentElement;d.style.setProperty('--tg-theme-button-color','#F7A600');d.style.setProperty('--tg-theme-button-text-color','#1a1a1a');})();
  </script>
  <div id="screenChoose" data-screen class="active">
    <div class="header">
      <span class="header-title">📦 Абонементы и сертификаты</span>
      <button type="button" class="btn-back-header" id="btnBack" aria-label="Назад">← Назад</button>
    </div>
    <p id="trainerLabel" class="meta" style="margin-bottom:12px;font-size:14px;color:var(--tg-theme-hint-color);"></p>
    <div class="info-block">
      <div class="info-title">Абонементы и сертификаты тренера</div>
      <div class="info-text">Ниже — абонементы (N занятий за цену) и сертификаты (номинал на сумму). Покупка и оплата только напрямую у тренера.</div>
    </div>
    <div id="passSection" style="display:none;">
      <div class="section-title" style="font-size:13px;font-weight:600;color:var(--tg-theme-hint-color);margin-bottom:10px;text-transform:uppercase;">Абонементы</div>
      <div id="listContent"></div>
    </div>
    <div id="certSection" style="display:none;">
      <div class="section-title" style="font-size:13px;font-weight:600;color:var(--tg-theme-hint-color);margin-bottom:10px;margin-top:20px;text-transform:uppercase;">Сертификаты</div>
      <div id="certListContent"></div>
    </div>
    <div id="emptyAll" class="empty" style="display:none;">У этого тренера пока нет абонементов и сертификатов.</div>
  </div>
  <script>
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }
      function initData() { return (tg && tg.initData) ? tg.initData : ''; }
      function apiUrl(path, extra) {
        var base = '/api/webapp';
        var q = id ? 'init_data=' + encodeURIComponent(id) : '';
        var id = initData();
        if (extra) q = (q ? q + '&' : '') + extra;
        return base + path + (q ? '?' + q : '');
      }
      function headers() {
        var h = { 'Content-Type': 'application/json' };
        var id = initData();
        if (id) h['X-Telegram-Init-Data'] = id;
        return h;
      }
      function postUrl(path) {
        var id = initData();
        return path + (id ? '?init_data=' + encodeURIComponent(id) : '');
      }
      var state = { trainerId: null, trainerName: '', items: [], certItems: [], selectedId: null, returnContext: {} };
      function getTrainerFromUrl() {
        var p = new URLSearchParams(window.location.search || '');
        var id = p.get('trainer_id');
        state.trainerName = p.get('trainer_name') || 'Тренер';
        state.trainerId = id ? parseInt(id, 10) : null;
        state.returnContext.trainer_id = state.trainerId;
        state.returnContext.city_id = p.get('city_id');
        state.returnContext.service_id = p.get('service_id');
        state.returnContext.arena_id = p.get('arena_id');
        state.returnContext.offset = p.get('offset');
        return state.trainerId;
      }
      function showScreen(id) {
        document.querySelectorAll('[data-screen]').forEach(function(el) { el.classList.remove('active'); });
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
      }
      function closeApp() { if (tg) tg.close(); else window.close(); }
      function goBack() {
        var ctx = state.returnContext;
        if (ctx.trainer_id != null && (ctx.city_id != null || ctx.service_id != null)) {
          var base = window.location.pathname.replace(/[^/]+$/, '');
          var q = 'trainer_id=' + encodeURIComponent(ctx.trainer_id);
          if (ctx.city_id != null) q += '&city_id=' + encodeURIComponent(ctx.city_id);
          if (ctx.service_id != null) q += '&service_id=' + encodeURIComponent(ctx.service_id);
          if (ctx.arena_id != null) q += '&arena_id=' + encodeURIComponent(ctx.arena_id);
          if (ctx.offset != null) q += '&offset=' + encodeURIComponent(ctx.offset);
          window.location.href = base + 'catalog?' + q;
          return;
        }
        if (window.history.length > 1) window.history.back();
        else closeApp();
      }
      document.getElementById('btnBack').onclick = goBack;
      function escapeHtml(s) {
        if (s == null) return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
      function formatPrice(cents) {
        if (cents == null) return '—';
        return (cents / 100) + ' BYN';
      }
      function formatCertAmount(c) {
        if (c.amount_cents == null) return 'Любая сумма';
        return (c.amount_cents / 100) + ' BYN';
      }
      function loadProducts() {
        if (!state.trainerId) {
          document.getElementById('listContent').innerHTML = '<div class="error">Укажите тренера (trainer_id в ссылке).</div>';
          return;
        }
        document.getElementById('trainerLabel').textContent = 'Абонементы и сертификаты: ' + escapeHtml(state.trainerName);
        document.getElementById('listContent').innerHTML = '<div class="loading">Загрузка…</div>';
        document.getElementById('certListContent').innerHTML = '';
        document.getElementById('passSection').style.display = 'block';
        document.getElementById('certSection').style.display = 'none';
        document.getElementById('emptyAll').style.display = 'none';
        var base = '?trainer_id=' + state.trainerId + (initData() ? '&init_data=' + encodeURIComponent(initData()) : '');
        Promise.all([
          fetch('/api/webapp/client/pass-products' + base, { headers: headers() }).then(function(r) { return r.json(); }),
          fetch('/api/webapp/client/certificate-products' + base, { headers: headers() }).then(function(r) { return r.json(); })
        ]).then(function(results) {
          state.items = (results[0].items || []);
          state.certItems = (results[1].items || []);
          var hasPasses = state.items.length > 0;
          var hasCerts = state.certItems.length > 0;
          document.getElementById('passSection').style.display = hasPasses ? 'block' : 'none';
          document.getElementById('certSection').style.display = hasCerts ? 'block' : 'none';
          document.getElementById('emptyAll').style.display = !hasPasses && !hasCerts ? 'block' : 'none';
          if (hasPasses) {
            var html = '';
            state.items.forEach(function(p) {
              var passPerSession = p.pass_price_per_session_cents != null ? (p.pass_price_per_session_cents / 100) : null;
              var meta = p.sessions_total + ' занятий · ' + formatPrice(p.price_cents);
              if (passPerSession != null) {
                meta += ' · ' + (passPerSession % 1 === 0 ? passPerSession : passPerSession.toFixed(2)) + ' BYN за занятие';
              }
              var savingsHtml = '';
              var savPer = p.savings_per_session_cents != null ? Number(p.savings_per_session_cents) : 0;
              var savTotal = p.savings_total_cents != null ? Number(p.savings_total_cents) : 0;
              if (savPer > 0) {
                var perSession = savPer / 100;
                var totalSav = savTotal / 100;
                savingsHtml = '<div class="savings-badge">Экономия ' + (perSession % 1 === 0 ? perSession : perSession.toFixed(2)) + ' BYN за занятие';
                if (totalSav > perSession) savingsHtml += ' · ' + (totalSav % 1 === 0 ? totalSav : totalSav.toFixed(2)) + ' BYN с абонемента';
                savingsHtml += '</div>';
              }
              html += '<button type="button" class="product-card" data-id="' + p.id + '">';
              html += '<div class="title">' + escapeHtml(p.name) + '</div>';
              html += '<div class="meta">' + meta + '</div>' + savingsHtml + '</button>';
            });
            document.getElementById('listContent').innerHTML = html;
            document.querySelectorAll('.product-card').forEach(function(btn) {
              btn.onclick = function() {
                state.selectedId = parseInt(btn.dataset.id, 10);
                document.querySelectorAll('.product-card').forEach(function(b) { b.classList.remove('selected'); });
                btn.classList.add('selected');
                var payBtn = document.getElementById('btnPay');
                if (payBtn) payBtn.disabled = false;
              };
            });
          }
          if (hasCerts) {
            var certHtml = '';
            state.certItems.forEach(function(c) {
              certHtml += '<div class="product-card" style="cursor:default;">';
              certHtml += '<div class="title">' + escapeHtml(formatCertAmount(c)) + '</div>';
              certHtml += '<div class="meta">Сертификат на занятия у тренера. Сумму и условия уточняйте у тренера.</div>';
              certHtml += '</div>';
            });
            document.getElementById('certListContent').innerHTML = certHtml;
          }
        }).catch(function() {
          document.getElementById('listContent').innerHTML = '<div class="error">Не удалось загрузить. Откройте из бота.</div>';
        });
      }
      // No online payment: абонементы показываются только для информации, оплату вы обсуждаете с тренером напрямую.
      getTrainerFromUrl();
      loadProducts();
    })();
  </script>
</body>
</html>
