<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Профиль</title>
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/glide-public/onest-cyr.woff2?v=202610236" />
  <link rel="stylesheet" href="/static/webapp/trainer-onest.css?v=202610269" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-trainer-theme.js?v=202610269"></script>
  <script src="mini-app-telegram-chrome.js?v=202610269"></script>
  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=202610269" />
  <link rel="stylesheet" href="theme.css?v=202610269" />
  <link rel="stylesheet" href="mini-app-components.css?v=202610269" />
  <link rel="stylesheet" href="mini-app-trainer-theme.css?v=202610269" />
  <link rel="stylesheet" href="mini-app-trainer-nav.css?v=202610269" />
  <link rel="stylesheet" href="mini-app-trainer-shell.css?v=202610269" />
  <link rel="stylesheet" href="mini-app-trainer-account.css?v=202610269" />
  <link rel="preload" href="mini-app-trainer-shell.js?v=202610269" as="script" />
  <link rel="preload" href="trainer-account-main.js?v=202610269" as="script" />
</head>
<!--
  Вкладка «Профиль» (TASK-313). Вместо шторки «Ещё» и анкеты с тремя вкладками — один экран:
  кто я → чего не хватает странице → разделы группами, у каждого справа текущее значение.
  Каждый раздел открывается отдельным экраном с одной задачей.
-->
<body class="ta-body" data-trainer-shell="tabs">
  <main class="ta-page" id="taPage">
    <div class="ta-loading" id="taLoading" aria-live="polite">
      <div class="ta-skel ta-skel--head"></div>
      <div class="ta-skel ta-skel--card"></div>
      <div class="ta-skel ta-skel--card"></div>
    </div>

    <div class="ta-error" id="taError" hidden>
      <p class="ta-error__title">Не получилось загрузить профиль</p>
      <p class="ta-error__text">Проверьте связь и попробуйте ещё раз.</p>
      <button type="button" class="ta-btn" id="taRetry">Обновить</button>
    </div>

    <div class="ta-root" id="taRoot" hidden>
      <header class="ta-head">
        <button type="button" class="ta-head__who" id="taWho" aria-label="Фото и имя">
          <span class="ta-avatar" id="taAvatar" aria-hidden="true"></span>
          <span class="ta-head__text">
            <span class="ta-head__name" id="taName"></span>
            <span class="ta-head__line" id="taLine"></span>
          </span>
        </button>
        <button type="button" class="ta-btn ta-btn--wide" id="taPreview" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          Как меня видят ученики
        </button>
      </header>

      <section class="ta-missing" id="taMissing" hidden aria-labelledby="taMissingTitle">
        <h2 class="ta-missing__title" id="taMissingTitle">Странице не хватает</h2>
        <div class="ta-missing__list" id="taMissingList"></div>
      </section>

      <div id="taGroups"></div>

      <p class="ta-foot">
        <button type="button" class="ta-link" id="taFullForm">Вся анкета одним списком</button>
      </p>
    </div>
  </main>

  <div class="ar-sheet-back" id="taHelpBack" hidden></div>
  <div class="ar-sheet" id="taHelpSheet" role="dialog" aria-modal="true" aria-labelledby="taHelpTitle" hidden>
    <span class="ar-sheet__handle" aria-hidden="true"></span>
    <form class="ta-help" id="taHelpForm" autocomplete="off" novalidate>
      <div class="ar-sheet__head">
        <div>
          <h2 class="ar-sheet__title" id="taHelpTitle">Написать команде</h2>
          <p class="ar-sheet__lead">Вопрос, идея или что-то не&nbsp;работает. Ответим в&nbsp;боте тренера</p>
        </div>
        <button type="button" class="ar-sheet__close" id="taHelpClose" aria-label="Закрыть">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <label class="ar-field">
        <span class="ar-field__label">Сообщение</span>
        <textarea id="taHelpMessage" maxlength="4000" rows="4" enterkeyhint="send"></textarea>
      </label>
      <p class="tp-note" id="taHelpStatus" role="status" aria-live="polite"></p>
      <button type="submit" class="tp-save" id="taHelpSubmit">Отправить</button>
    </form>
  </div>

  <script defer src="trainer-account-main.js?v=202610269"></script>
  <script src="mini-app-more-icons.js?v=202610269"></script>
  <script defer src="mini-app-trainer-shell.js?v=202610269"></script>
</body>
</html>
