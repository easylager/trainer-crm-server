<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Мои записи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* JUSTSKATE.BY brand: black + yellow */
    :root {
      --tg-theme-bg-color: #FFFBEB;
      --tg-theme-text-color: #1a1a1a;
      --tg-theme-hint-color: #666;
      --tg-theme-button-color: #F7A600;
      --tg-theme-button-text-color: #1a1a1a;
      --tg-theme-secondary-bg-color: #FFF3CC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --tg-theme-bg-color: #1a1a1a;
        --tg-theme-text-color: #f5f5f5;
        --tg-theme-hint-color: #8e8e93;
        --tg-theme-button-color: #F7A600;
        --tg-theme-button-text-color: #1a1a1a;
        --tg-theme-secondary-bg-color: #2a2a2a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
      padding: 12px;
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 8px;
    }
    .header-title { flex: 1; }
    .btn-close {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      cursor: pointer;
    }
    .day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .day-nav span { font-weight: 600; font-size: 15px; }
    .day-nav button {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .booking-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color);
      width: 100%;
      text-align: left;
    }
    .booking-card-main { flex: 1; min-width: 0; }
    .booking-card .time { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .booking-card .trainer { font-size: 14px; color: var(--tg-theme-hint-color); margin-bottom: 6px; }
    .booking-card .arena { font-size: 14px; margin-bottom: 2px; }
    .booking-card .address { font-size: 13px; color: var(--tg-theme-hint-color); margin-bottom: 4px; }
    .booking-card .map-link {
      font-size: 13px;
      color: var(--tg-theme-button-color);
      text-decoration: none;
    }
    .booking-card .map-link:active { opacity: 0.8; }
    .booking-card .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 6px;
    }
    .booking-card .badge.pending { background: rgba(255, 149, 0, 0.2); color: #ff9500; }
    .booking-card .badge.confirmed { background: rgba(52, 199, 89, 0.2); color: #34c759; }
    .booking-card .btn-cancel {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--tg-theme-hint-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .booking-card .btn-cancel svg { width: 20px; height: 20px; }
    .booking-card .btn-cancel:active { opacity: 0.6; }
    .booking-card .btn-cancel:hover { color: #ff3b30; }
    .loading, .error { text-align: center; padding: 24px; color: var(--tg-theme-hint-color); }
    .error { color: #ff3b30; }
    .empty { text-align: center; padding: 32px 16px; color: var(--tg-theme-hint-color); font-size: 15px; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      z-index: 100;
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal {
      background: var(--tg-theme-bg-color);
      border-radius: 16px;
      padding: 20px;
      max-width: 360px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal h3 { margin: 0 0 8px; font-size: 17px; }
    .modal .hint { font-size: 14px; color: var(--tg-theme-hint-color); margin-bottom: 12px; }
    .modal textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      font-size: 15px;
      line-height: 1.4;
      min-height: 80px;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    .modal textarea::placeholder { color: var(--tg-theme-hint-color); }
    .modal .actions { display: flex; gap: 8px; }
    .modal .actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-modal-secondary { background: #FFF3CC !important; color: #1a1a1a !important; }
    .btn-modal-danger { background: rgba(255, 59, 48, 0.2); color: #ff3b30; }
    [data-screen] { display: none; }
    [data-screen].active { display: block; }
    /* JUSTSKATE.BY — перебиваем тему Telegram */
    body { background: #FFFBEB !important; color: #1a1a1a !important; }
    .btn-close, .day-nav button, .booking-card, .modal, .modal textarea, .btn-modal-secondary { background: #FFF3CC !important; color: #1a1a1a !important; }
    .booking-card .map-link { color: #F7A600 !important; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a !important; color: #f5f5f5 !important; }
      .btn-close, .day-nav button, .booking-card, .modal, .modal textarea, .btn-modal-secondary { background: #2a2a2a !important; color: #f5f5f5 !important; }
    }
  </style>
</head>
<body>
  <script>
  (function(){var d=document.documentElement;d.style.setProperty('--tg-theme-button-color','#F7A600');d.style.setProperty('--tg-theme-button-text-color','#1a1a1a');d.style.setProperty('--tg-theme-bg-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#1a1a1a':'#FFFBEB');d.style.setProperty('--tg-theme-text-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#f5f5f5':'#1a1a1a');d.style.setProperty('--tg-theme-secondary-bg-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#2a2a2a':'#FFF3CC');})();
  </script>
  <div class="header">
    <span class="header-title">📋 Мои записи</span>
    <button type="button" class="btn-close" id="btnClose" aria-label="Закрыть">Закрыть</button>
  </div>

  <div id="screenList" data-screen>
    <div class="day-nav">
      <button type="button" id="prevDay" aria-label="Пред. день">‹</button>
      <span id="dayLabel">—</span>
      <button type="button" id="nextDay" aria-label="След. день">›</button>
    </div>
    <div id="listContent"></div>
  </div>

  <div id="modalCancel" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>Отменить запись?</h3>
      <p class="hint">Укажите причину — тренер увидит её у себя в записях (необязательно).</p>
      <textarea id="cancelReason" placeholder="Например: изменились планы"></textarea>
      <div class="actions">
        <button type="button" class="btn-modal-secondary" id="modalCancelNo">Назад</button>
        <button type="button" class="btn-modal-danger" id="modalCancelYes">Отменить запись</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }

      function initData() { return (tg && tg.initData) ? tg.initData : ''; }
      function apiUrl(path) {
        var base = '/api/webapp';
        var id = initData();
        return base + path + (id ? '?init_data=' + encodeURIComponent(id) : '');
      }
      function headers() {
        var h = { 'Content-Type': 'application/json' };
        if (initData()) h['X-Telegram-Init-Data'] = initData();
        return h;
      }

      function closeApp() { if (tg) tg.close(); else window.close(); }
      document.getElementById('btnClose').onclick = closeApp;

      var state = { days: [], currentDayIndex: 0, cancelBookingId: null };

      function showScreen(id) {
        document.querySelectorAll('[data-screen]').forEach(function(el) { el.classList.remove('active'); });
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
      }

      function getJson(url) {
        return fetch(url, { headers: headers() }).then(function(r) {
          if (!r.ok) throw new Error(r.statusText);
          return r.json();
        });
      }

      function postJson(url, body) {
        return fetch(url, {
          method: 'POST',
          headers: headers(),
          body: body ? JSON.stringify(body) : undefined
        }).then(function(r) {
          if (!r.ok) throw new Error('Request failed');
          return r.json();
        });
      }

      function escapeHtml(s) {
        if (s == null || s === undefined) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function formatDate(slotDate) {
        if (!slotDate) return '—';
        var s = String(slotDate);
        var parts = s.split('-');
        if (parts.length >= 3) return parts[2] + '.' + parts[1];
        return s;
      }

      function loadBookings() {
        document.getElementById('listContent').innerHTML = '<div class="loading">Загрузка...</div>';
        getJson(apiUrl('/client/bookings')).then(function(data) {
          state.days = data.days || [];
          if (state.days.length === 0) {
            document.getElementById('listContent').innerHTML = '<div class="empty">У вас пока нет записей.<br>Выберите тренера в каталоге и нажмите «Записаться».</div>';
            document.getElementById('dayLabel').textContent = '';
            return;
          }
          state.currentDayIndex = 0;
          renderDay();
        }).catch(function() {
          document.getElementById('listContent').innerHTML = '<div class="error">Ошибка загрузки</div>';
        });
      }

      function renderDay() {
        var days = state.days;
        var idx = Math.max(0, Math.min(state.currentDayIndex, days.length - 1));
        state.currentDayIndex = idx;
        var day = days[idx];
        document.getElementById('dayLabel').textContent = formatDate(day.date) + ' (' + (day.day_label || '') + ')';
        var html = '';
        if (!day.bookings || day.bookings.length === 0) {
          html = '<div class="empty">На этот день записей нет</div>';
        } else {
          day.bookings.forEach(function(b) {
            var statusClass = (b.status || '') === 'confirmed' ? 'confirmed' : 'pending';
            var statusText = statusClass === 'confirmed' ? 'Подтверждено' : 'Ожидает подтверждения';
            var arena = (b.arena_name || '').trim() || null;
            var address = (b.arena_address || '').trim() || null;
            var mapLink = b.map_link || null;
            html += '<div class="booking-card" data-id="' + b.id + '">';
            html += '<div class="booking-card-main">';
            html += '<div class="time">' + escapeHtml(b.start_time || '') + ' · ' + (b.duration_minutes || 45) + ' мин</div>';
            html += '<div class="trainer">' + escapeHtml(b.trainer_name || 'Тренер') + '</div>';
            if (arena) html += '<div class="arena">' + escapeHtml(arena) + '</div>';
            if (address) html += '<div class="address">' + escapeHtml(address) + '</div>';
            if (mapLink) html += '<a href="' + escapeHtml(mapLink) + '" class="map-link" target="_blank" rel="noopener">Открыть на карте</a>';
            html += '<span class="badge ' + statusClass + '">' + escapeHtml(statusText) + '</span>';
            html += '</div>';
            html += '<button type="button" class="btn-cancel" data-id="' + b.id + '" aria-label="Отменить запись">';
            html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
            html += '</button></div>';
          });
        }
        document.getElementById('listContent').innerHTML = html;
        document.querySelectorAll('.booking-card .btn-cancel').forEach(function(btn) {
          btn.onclick = function(e) {
            e.stopPropagation();
            state.cancelBookingId = parseInt(btn.dataset.id, 10);
            document.getElementById('cancelReason').value = '';
            document.getElementById('modalCancel').style.display = 'flex';
          };
        });
      }

      document.getElementById('prevDay').onclick = function() {
        if (state.currentDayIndex > 0) { state.currentDayIndex--; renderDay(); }
      };
      document.getElementById('nextDay').onclick = function() {
        if (state.currentDayIndex < state.days.length - 1) { state.currentDayIndex++; renderDay(); }
      };

      document.getElementById('modalCancelNo').onclick = function() {
        document.getElementById('modalCancel').style.display = 'none';
        state.cancelBookingId = null;
      };

      document.getElementById('modalCancelYes').onclick = function() {
        var id = state.cancelBookingId;
        if (!id) return;
        var reason = (document.getElementById('cancelReason').value || '').trim() || null;
        document.getElementById('modalCancel').style.display = 'none';
        state.cancelBookingId = null;
        postJson(apiUrl('/client/bookings/' + id + '/cancel'), { reason: reason }).then(function() {
          loadBookings();
        }).catch(function() {
          alert('Не удалось отменить запись. Попробуйте ещё раз.');
        });
      };

      document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
        overlay.addEventListener('click', function(e) {
          if (e.target !== overlay) return;
          var el = document.activeElement;
          if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) {
            el.blur();
          }
        });
      });
      loadBookings();
      showScreen('screenList');
    })();
  </script>
</body>
</html>
