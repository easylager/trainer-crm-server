<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Кабинет школы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <script src="mini-app-full-height.js?v=2026100516"></script>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <script src="mini-app-trainer-theme.js?v=2026100516"></script>
  <script src="mini-app-telegram-chrome.js?v=2026100516"></script>
  <link rel="stylesheet" href="theme.css?v=2026100516" />
  <link rel="stylesheet" href="mini-app-components.css?v=2026100516" />
  <link rel="stylesheet" href="mini-app-trainer-theme.css?v=2026100516" />
  <link rel="stylesheet" href="mini-app-org-shell.css?v=2026100516" />
  <link rel="preload" href="org-home-main.js?v=2026100516" as="script" />
  <link rel="preload" href="mini-app-org-shell.js?v=2026100516" as="script" />
</head>
<body data-org-shell="tabs" data-org-active="home">
  <main class="org-page" id="orgHomePage">
    <div class="org-home-state org-home-state--loading" id="orgHomeLoading">
      <p>Загрузка</p>
    </div>

    <section class="org-home-root" id="orgHomeRoot" hidden>
      <header class="org-home-header">
        <h1 id="orgHomeName"></h1>
        <p class="org-home-sub" id="orgHomeSub"></p>
      </header>

      <div class="org-home-status" id="orgHomeStatus">
        <span class="org-home-status__dot" aria-hidden="true"></span>
        <span id="orgHomeStatusText"></span>
      </div>

      <button type="button" class="org-home-profile-link" id="orgHomeProfileLink">Редактировать профиль школы →</button>
    </section>

    <div class="org-home-state org-home-state--error" id="orgHomeError" hidden>
      <p id="orgHomeErrorText">Не удалось загрузить раздел</p>
      <button type="button" class="btn-secondary" id="orgHomeRetry">Повторить</button>
    </div>
  </main>

  <script defer src="org-home-main.js?v=2026100516"></script>
  <script defer src="mini-app-org-shell.js?v=2026100516"></script>
</body>
</html>
