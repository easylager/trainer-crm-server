<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Запись</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mini-app-components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <script src="client-mini-app-theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--app-font-sans);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
      padding: 12px;
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .header-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--tg-theme-text-color);
      overflow: visible;
      text-overflow: unset;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.12);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    .week-nav span {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .week-nav button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(247, 166, 0, 0.12);
      color: var(--tg-theme-button-color);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease;
      font-weight: 600;
    }
    .week-nav button:hover {
      background: rgba(247, 166, 0, 0.2);
      transform: scale(1.05);
    }
    .week-nav button:active {
      transform: scale(0.95);
      opacity: 0.8;
    }
    .day-block { margin-bottom: 24px; }
    .day-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      margin: 4px 0 12px 4px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .slot-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color);
      border: 2px solid transparent;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .slot-card-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .slot-spots-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-button-color);
      border: 1px solid color-mix(in srgb, var(--tg-theme-button-color) 35%, transparent);
    }
    @supports not (color: color-mix(in srgb, red, blue)) {
      .slot-spots-pill {
        border-color: rgba(245, 166, 35, 0.45);
      }
    }
    .slot-card:hover {
      border-color: var(--tg-theme-button-color);
      transform: translateY(-1px);
    }
    .slot-card:active { 
      opacity: 0.8; 
      transform: scale(0.98);
    }
    .slot-time {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.01em;
      color: var(--tg-theme-text-color);
    }
    .slot-card .slot-arrow {
      font-size: 14px;
      color: var(--tg-theme-button-color);
      opacity: 0.7;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }
    .slot-card:hover .slot-arrow {
      opacity: 1;
    }
    
    /* Дополнительные стили для темной темы */
    @media (prefers-color-scheme: dark) {
      .slot-card {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .slot-card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      .week-nav {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }
    .loading, .error {
      text-align: center;
      padding: 32px 16px;
      color: var(--tg-theme-hint-color);
      font-size: 15px;
      line-height: 1.5;
    }
    .error { 
      color: var(--app-danger);
      background: rgba(255, 59, 48, 0.08);
      border-radius: 16px;
      border: 1px solid rgba(255, 59, 48, 0.2);
    }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--tg-theme-hint-color);
      font-size: 15px;
      line-height: 1.5;
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 16px;
      border: 1px solid rgba(128, 128, 128, 0.12);
    }
    .form-block {
      margin-bottom: 20px;
    }
    .form-block label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    /* Не трогать radio/checkbox — иначе width:100% съедает подпись у «Категория цены». */
    .form-block input:not([type="radio"]):not([type="checkbox"]),
    .form-block textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(128, 128, 128, 0.12);
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      font-size: 15px;
      line-height: 1.4;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      transition: all 0.12s ease;
      font-family: inherit;
    }
    .form-block input:not([type="radio"]):not([type="checkbox"]):focus,
    .form-block textarea:focus {
      outline: none;
      border-color: rgba(247, 166, 0, 0.45);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 0 0 3px rgba(247, 166, 0, 0.1);
    }
    .form-block textarea {
      min-height: 100px;
      resize: vertical;
    }
    .price-tier-radios label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 15px;
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
      font-weight: 500;
      color: var(--tg-theme-text-color);
    }
    .price-tier-radios input[type="radio"] {
      width: auto;
      max-width: none;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
      box-shadow: none;
      border: none;
      background: transparent;
      accent-color: var(--tg-theme-button-color);
    }
    .price-tier-radios label .tier-radio-text {
      flex: 1 1 auto;
      min-width: 0;
      line-height: 1.35;
    }
    /* .btn-primary — mini-app-components.css + theme tokens */
    #screenForm .btn-primary {
      width: 100%;
      margin-top: 12px;
    }
    /* Success: centered block (was left-aligned with orphan primary button below). */
    #screenSuccess {
      display: none;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      min-height: min(72vh, calc(100dvh - 96px));
      padding: 20px 0 32px;
      box-sizing: border-box;
    }
    #screenSuccess .success-inner {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    .success-msg {
      text-align: center;
      padding: 28px 20px;
      font-size: 16px;
      line-height: 1.55;
      background: rgba(52, 199, 89, 0.08);
      border-radius: 16px;
      border: 1px solid rgba(52, 199, 89, 0.2);
      margin: 0;
    }
    .success-hint {
      margin: 16px 0 0;
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
      color: var(--tg-theme-hint-color);
    }
    
    /* Анимации появления */
    @keyframes card-enter {
      from { 
        opacity: 0; 
        transform: translateY(10px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    @keyframes hero-enter {
      from { 
        opacity: 0; 
        transform: translateY(20px) scale(0.98); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0) scale(1); 
      }
    }
    
    .slot-card {
      animation: card-enter 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    
    .slot-card:nth-child(1) { animation-delay: 0.05s; }
    .slot-card:nth-child(2) { animation-delay: 0.1s; }
    .slot-card:nth-child(3) { animation-delay: 0.15s; }
    .slot-card:nth-child(4) { animation-delay: 0.2s; }
    .slot-card:nth-child(5) { animation-delay: 0.25s; }
    .slot-card:nth-child(6) { animation-delay: 0.3s; }
    .slot-card:nth-child(7) { animation-delay: 0.35s; }
    .slot-card:nth-child(8) { animation-delay: 0.4s; }
    
    .week-nav {
      animation: hero-enter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    
    .day-block {
      animation: card-enter 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    
    .day-block:nth-child(1) { animation-delay: 0.1s; }
    .day-block:nth-child(2) { animation-delay: 0.2s; }
    .day-block:nth-child(3) { animation-delay: 0.3s; }
    .day-block:nth-child(4) { animation-delay: 0.4s; }
    .day-block:nth-child(5) { animation-delay: 0.5s; }
    .day-block:nth-child(6) { animation-delay: 0.6s; }
    .day-block:nth-child(7) { animation-delay: 0.7s; }

    .book-venue-hint {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(247, 166, 0, 0.22);
      font-size: 14px;
      line-height: 1.45;
      color: var(--tg-theme-text-color);
    }
    .book-venue-hint .book-venue-title { margin-bottom: 6px; }
    .book-venue-hint .book-venue-map { margin-top: 10px; }
    .book-venue-hint .book-venue-map a {
      color: var(--tg-theme-button-color);
      font-weight: 600;
      text-decoration: none;
    }
    .service-pick-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .service-pick-sheet {
      width: min(560px, 100%);
      border-radius: 18px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.16);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
      padding: 14px;
    }
    .service-pick-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      color: var(--tg-theme-text-color);
    }
    .service-pick-sub {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--tg-theme-hint-color);
    }
    .service-pick-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .service-pick-option {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(128, 128, 128, 0.18);
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .service-pick-option:active { opacity: 0.85; }
    .service-pick-cancel {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      background: transparent;
      color: var(--tg-theme-hint-color);
      font: inherit;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="mini-app-client-nav.css" />
</head>
<body>
  <div class="header">
    <h1 class="header-title" id="headerTitle">📅 Запись</h1>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" hidden data-skip-history-back="true">Назад</button>
    </div>
  </div>
  <div id="screenSlots">
    <div class="week-nav">
      <button type="button" id="prevWeek" aria-label="Назад">‹</button>
      <span id="weekLabel">—</span>
      <button type="button" id="nextWeek" aria-label="Вперёд">›</button>
    </div>
    <div id="content">
      <div class="loading">Загрузка...</div>
    </div>
  </div>
  <div id="screenForm" style="display: none;">
    <div id="selectedSlotLabel" style="margin-bottom: 20px; padding: 16px 18px; background: var(--tg-theme-secondary-bg-color); border-radius: 16px; border: 1px solid rgba(247, 166, 0, 0.28); font-size: 15px; font-weight: 600; text-align: center; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);"></div>
    <div id="bookVenueHint" class="book-venue-hint" style="display: none;" aria-live="polite"></div>
    <div id="priceTierBlock" class="form-block" style="display: none;">
      <label>Категория цены</label>
      <div id="priceTierRadios" class="price-tier-radios"></div>
    </div>
    <div id="bookNameBlock" class="form-block" style="display: none;">
      <label for="bookFirstName">Имя *</label>
      <input type="text" id="bookFirstName" autocomplete="given-name" maxlength="64" placeholder="Как к вам обращаться" />
      <label for="bookLastName" style="margin-top:10px;display:block;">Фамилия</label>
      <input type="text" id="bookLastName" autocomplete="family-name" maxlength="64" placeholder="Необязательно" />
    </div>
    <div class="form-block">
      <label for="phone">Телефон *</label>
      <input type="tel" id="phone" placeholder="+375291234567" inputmode="tel" />
    </div>
    <div class="form-block">
      <label for="comment">Комментарий (необязательно)</label>
      <textarea id="comment" placeholder="Напишите тренеру, если нужно"></textarea>
    </div>
    <button type="button" class="btn-primary" id="btnSubmit">Записаться</button>
  </div>
  <div id="screenSuccess" style="display: none;">
    <div class="success-inner">
      <div class="success-msg" id="successMsgBody"></div>
      <p class="success-hint">Окно можно закрыть крестиком вверху Telegram.</p>
    </div>
  </div>
  <div id="servicePickOverlay" class="service-pick-overlay" aria-hidden="true">
    <div class="service-pick-sheet">
      <h3 class="service-pick-title">Выберите услугу</h3>
      <p class="service-pick-sub">После выбора покажем свободные слоты тренера.</p>
      <div id="servicePickList" class="service-pick-list"></div>
      <button type="button" id="servicePickCancel" class="service-pick-cancel">Отмена</button>
    </div>
  </div>

  <script>
    (function() {
      const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      const MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        if (typeof window.__applyBookTheme === 'function') {
          window.__applyBookTheme();
        }
        function syncTelegramChromeColors() {
          try {
            var darkUi = tg.colorScheme === 'dark' ||
              (tg.colorScheme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var bgHex = darkUi ? '#1c1c1c' : '#fffbec';
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor(bgHex);
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor(bgHex);
            if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor(bgHex);
          } catch (e) { /* older clients */ }
        }
        syncTelegramChromeColors();
        if (tg.onEvent) {
          tg.onEvent('themeChanged', function () {
            if (typeof window.__applyBookTheme === 'function') {
              window.__applyBookTheme();
            }
            syncTelegramChromeColors();
          });
        }
      }

      const params = new URLSearchParams(window.location.search);
      const trainerId = params.get('trainer_id');
      const requestIdParam = params.get('request_id');
      const requestId = requestIdParam ? parseInt(requestIdParam, 10) : null;
      const serviceIdParam = params.get('service_id');
      const parsedUrlServiceId = serviceIdParam ? parseInt(serviceIdParam, 10) : NaN;
      const serviceIdFromUrl = Number.isFinite(parsedUrlServiceId) ? parsedUrlServiceId : null;
      const forceServiceChoice = params.get('force_service_choice') === '1';
      if (!trainerId) {
        document.getElementById('content').innerHTML = '<div class="error">Не указан тренер. Откройте запись из бота.</div>';
        document.getElementById('prevWeek').style.display = 'none';
        document.getElementById('nextWeek').style.display = 'none';
        document.getElementById('weekLabel').textContent = '';
      }

      function getMonday(d) {
        const date = new Date(d);
        const day = date.getDay();
        const diff = date.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(date.setDate(diff));
      }

      function formatWeekLabel(start) {
        const end = new Date(start);
        end.setDate(end.getDate() + 6);
        const fmt = function(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; };
        return fmt(start) + ' – ' + fmt(end);
      }

      /** Calendar date in device local TZ — do not use toISOString().slice(0,10) (UTC shift breaks week filter). */
      function localYmd(d) {
        return d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0');
      }

      function formatDateKey(dateStr) {
        const d = new Date(dateStr + 'T12:00:00');
        return d.getDate() + '.' + String(d.getMonth() + 1).padStart(2, '0') + ' (' + DAYS[d.getDay() === 0 ? 6 : d.getDay() - 1] + ')';
      }

      let allSlots = [];
      let trainerName = 'Тренер';
      let currentWeekStart = null;
      let clientPhone = null;
      let needsProfileName = true;
      let clientFirstName = '';
      let clientLastName = '';
      let sessionCityId = null;
      let sessionArenaId = null;
      let sessionServiceId = null;
      let selectedServiceId = serviceIdFromUrl;
      let bookTrainerDetailCache = null;
      let selectedPriceVariantId = null;

      const PRICE_TIER_LABEL_RU = {
        child: 'Детский',
        adult: 'Взрослый',
        two_children: '2 ребенка',
        two_adults: '2 взрослых',
        adult_and_child: 'Взрослый + ребенок',
      };
      function priceTierLabelRu(tier) {
        const k = (tier.tier_kind || '').toLowerCase();
        return PRICE_TIER_LABEL_RU[k] || tier.label || 'Тариф';
      }

      async function loadTrainerDetailForBook() {
        if (!trainerId) return null;
        if (bookTrainerDetailCache) return bookTrainerDetailCache;
        try {
          const res = await fetch('/api/public/trainers/' + encodeURIComponent(trainerId));
          if (res.ok) bookTrainerDetailCache = await res.json();
        } catch (e) {}
        return bookTrainerDetailCache;
      }

      function escapeHtmlBook(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function primaryVenueFromPublicTrainer(t) {
        if (!t) return '';
        var pn = (t.primary_arena_name && String(t.primary_arena_name).trim()) || '';
        if (pn) return pn;
        var names = t.arena_names || [];
        var ids = t.arena_ids || [];
        var pid = t.primary_arena_id;
        if (pid != null && ids && names && ids.length) {
          var ix = ids.indexOf(pid);
          if (ix >= 0 && names[ix]) return String(names[ix]).trim();
        }
        return (names[0] && String(names[0]).trim()) || '';
      }

      function syncBookVenueHint(slot) {
        var el = document.getElementById('bookVenueHint');
        if (!el) return;
        var name = slot && slot.arena_name && String(slot.arena_name).trim();
        var addr = slot && slot.arena_address && String(slot.arena_address).trim();
        var city = slot && slot.arena_city_name && String(slot.arena_city_name).trim();
        var mapLink = slot && slot.map_link && String(slot.map_link).trim();
        var parts = [];
        if (name || addr || city) {
          var loc = [name, addr].filter(Boolean).join(' — ');
          if (city) loc = loc ? loc + ' · ' + city : city;
          parts.push('<div class="book-venue-title"><strong>Где</strong></div>');
          parts.push('<div>' + escapeHtmlBook(loc) + '</div>');
        } else {
          var fb = primaryVenueFromPublicTrainer(bookTrainerDetailCache);
          if (fb) {
            parts.push(
              '<div><strong>' +
                escapeHtmlBook(fb) +
                '</strong> — точный адрес пришлёт тренер после подтверждения.</div>'
            );
          }
        }
        if (mapLink && /^https:\/\//i.test(mapLink)) {
          parts.push(
            '<div class="book-venue-map"><a href="' +
              escapeHtmlBook(mapLink) +
              '" target="_blank" rel="noopener noreferrer">Открыть на карте</a></div>'
          );
        }
        if (!parts.length) {
          el.style.display = 'none';
          el.innerHTML = '';
          return;
        }
        el.innerHTML = parts.join('');
        el.style.display = 'block';
      }

      function renderPriceTierUi(effServiceId) {
        const block = document.getElementById('priceTierBlock');
        const host = document.getElementById('priceTierRadios');
        selectedPriceVariantId = null;
        if (!block || !host) return;
        if (effServiceId == null) {
          block.style.display = 'none';
          return;
        }
        const t = bookTrainerDetailCache;
        const services = (t && t.services) ? t.services : [];
        const svc = services.find(function(s) { return Number(s.service_id) === Number(effServiceId); });
        const tiers = (svc && svc.price_tiers) ? svc.price_tiers : [];
        if (tiers.length <= 1) {
          block.style.display = 'none';
          selectedPriceVariantId = tiers.length === 1 ? tiers[0].id : null;
          return;
        }
        block.style.display = 'block';
        host.innerHTML = '';
        tiers.forEach(function(tier) {
          const lab = document.createElement('label');
          const inp = document.createElement('input');
          inp.type = 'radio';
          inp.name = 'priceTierChoice';
          inp.value = String(tier.id);
          const pb = tier.price_byn;
          const priceStr = (pb === Math.floor(pb) ? pb : Number(pb).toFixed(2)) + ' BYN';
          lab.appendChild(inp);
          var tierTxt = document.createElement('span');
          tierTxt.className = 'tier-radio-text';
          tierTxt.textContent = priceTierLabelRu(tier) + ' — ' + priceStr;
          lab.appendChild(tierTxt);
          inp.addEventListener('change', function() {
            selectedPriceVariantId = parseInt(inp.value, 10);
          });
          host.appendChild(lab);
        });
        const first = host.querySelector('input');
        if (first) {
          first.checked = true;
          selectedPriceVariantId = parseInt(first.value, 10);
        }
      }
      const thisMonday = getMonday(new Date());
      const nextMonday = new Date(thisMonday);
      nextMonday.setDate(nextMonday.getDate() + 7);

      async function fetchClientSession() {
        const initData = tg?.initData || '';
        if (!initData) return;
        try {
          // Prefer header-only auth (same as catalog): long init_data in query can be truncated by proxies.
          const res = await fetch('/api/webapp/client/session', {
            headers: {
              Accept: 'application/json',
              'X-Telegram-Init-Data': initData,
            },
            cache: 'no-store',
          });
          if (res.ok) {
            const data = await res.json();
            const raw = data.client_phone;
            clientPhone = raw != null && String(raw).trim() !== '' ? String(raw).trim() : null;
            sessionCityId = data.city_id != null ? Number(data.city_id) : null;
            sessionArenaId = data.arena_id != null ? Number(data.arena_id) : null;
            if (data.service_id != null) sessionServiceId = data.service_id;
            needsProfileName = !!data.needs_profile_name;
            clientFirstName = data.client_first_name != null ? String(data.client_first_name).trim() : '';
            clientLastName = data.client_last_name != null ? String(data.client_last_name).trim() : '';
          }
        } catch (e) {}
      }

      async function persistServiceSelectionInSession(serviceId) {
        const sid = Number(serviceId);
        const tid = Number(trainerId);
        const initData = tg?.initData || '';
        if (!Number.isFinite(sid) || sid <= 0) return;
        if (!Number.isFinite(tid) || tid <= 0) return;
        if (!Number.isFinite(Number(sessionCityId)) || Number(sessionCityId) <= 0) return;
        if (!initData) return;
        try {
          await fetch('/api/webapp/client/session', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
              'X-Telegram-Init-Data': initData,
            },
            body: JSON.stringify({
              city_id: Number(sessionCityId),
              service_id: sid,
              arena_id: Number.isFinite(Number(sessionArenaId)) && Number(sessionArenaId) > 0
                ? Number(sessionArenaId)
                : null,
              trainer_id: tid,
            }),
          });
        } catch (e) { /* ignore */ }
      }

      function effectiveServiceId() {
        if (selectedServiceId != null) return selectedServiceId;
        if (serviceIdFromUrl != null) return serviceIdFromUrl;
        if (forceServiceChoice) return null;
        return sessionServiceId;
      }

      function openServicePicker(services) {
        return new Promise(function(resolve, reject) {
          const ov = document.getElementById('servicePickOverlay');
          const list = document.getElementById('servicePickList');
          const cancel = document.getElementById('servicePickCancel');
          if (!ov || !list || !cancel) {
            reject(new Error('Не удалось открыть выбор услуги.'));
            return;
          }
          list.innerHTML = '';
          (services || []).forEach(function(s) {
            const sid = Number(s && s.service_id);
            if (!Number.isFinite(sid) || sid <= 0) return;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'service-pick-option';
            btn.textContent = (s && s.service_name ? String(s.service_name).trim() : '') || ('Услуга #' + sid);
            btn.onclick = function() {
              selectedServiceId = sid;
              sessionServiceId = sid;
              persistServiceSelectionInSession(sid);
              ov.style.display = 'none';
              ov.setAttribute('aria-hidden', 'true');
              resolve(sid);
            };
            list.appendChild(btn);
          });
          cancel.onclick = function() {
            ov.style.display = 'none';
            ov.setAttribute('aria-hidden', 'true');
            reject(new Error('Выбор услуги отменён.'));
          };
          ov.onclick = function(ev) {
            if (ev.target === ov) {
              ov.style.display = 'none';
              ov.setAttribute('aria-hidden', 'true');
              reject(new Error('Выбор услуги отменён.'));
            }
          };
          ov.style.display = 'flex';
          ov.setAttribute('aria-hidden', 'false');
        });
      }

      async function ensureServiceChoiceBeforeSlots() {
        const t = await loadTrainerDetailForBook();
        const servicesRaw = (t && t.services) ? t.services : [];
        const map = new Map();
        servicesRaw.forEach(function(s) {
          const sid = Number(s && s.service_id);
          if (!Number.isFinite(sid) || sid <= 0) return;
          if (!map.has(sid)) map.set(sid, s);
        });
        const services = Array.from(map.values());
        if (!services.length) {
          throw new Error('У тренера не настроены услуги.');
        }
        const mustPickAtStart = requestId == null && serviceIdFromUrl == null;
        if (mustPickAtStart && services.length > 1) {
          // Always ask explicitly when trainer offers multiple services and link didn't pin one.
          return openServicePicker(services);
        }
        const current = effectiveServiceId();
        if (current != null) {
          selectedServiceId = current;
          return current;
        }
        if (services.length === 1) {
          selectedServiceId = Number(services[0].service_id);
          sessionServiceId = selectedServiceId;
          persistServiceSelectionInSession(selectedServiceId);
          return selectedServiceId;
        }
        return openServicePicker(services);
      }

      function updateBookNameFields() {
        const block = document.getElementById('bookNameBlock');
        if (!block) return;
        block.style.display = needsProfileName ? 'block' : 'none';
        if (needsProfileName) {
          const f = document.getElementById('bookFirstName');
          const l = document.getElementById('bookLastName');
          if (f) f.value = clientFirstName || '';
          if (l) l.value = clientLastName || '';
        }
      }

      async function fetchSlots() {
        const initData = tg?.initData || '';
        let q = 'trainer_id=' + encodeURIComponent(trainerId);
        const sidForSlots = effectiveServiceId();
        if (sidForSlots != null) q += '&service_id=' + encodeURIComponent(sidForSlots);
        var hdr = { Accept: 'application/json' };
        if (initData) hdr['X-Telegram-Init-Data'] = initData;
        const res = await fetch('/api/webapp/client/slots?' + q, { headers: hdr, cache: 'no-store' });
        if (!res.ok) {
          const err = await res.json().catch(function() { return { detail: res.statusText }; });
          throw new Error(err.detail || res.statusText);
        }
        return res.json();
      }

      function slotsInWeek(slots, weekStart) {
        const start = localYmd(weekStart);
        const end = new Date(weekStart);
        end.setDate(end.getDate() + 6);
        const endStr = localYmd(end);
        return slots.filter(function(s) { return s.slot_date >= start && s.slot_date <= endStr; });
      }

      function render(slots) {
        const byDay = {};
        slots.forEach(function(s) {
          if (!byDay[s.slot_date]) byDay[s.slot_date] = [];
          byDay[s.slot_date].push(s);
        });
        const days = Object.keys(byDay).sort();
        const content = document.getElementById('content');
        if (days.length === 0) {
          content.innerHTML = '<div class="empty">Нет свободных слотов на эту неделю</div>';
          return;
        }
        let html = '';
        days.forEach(function(dateKey) {
          const daySlots = byDay[dateKey].sort(function(a, b) { return (a.start_time || '').localeCompare(b.start_time || ''); });
          html += '<div class="day-block"><div class="day-title">' + formatDateKey(dateKey) + '</div>';
          daySlots.forEach(function(s) {
            html += '<button type="button" class="slot-card" data-slot-id="' + s.id + '" data-date="' + s.slot_date + '" data-time="' + (s.start_time || '') + '–' + (s.end_time || '') + '">';
            html += '<span class="slot-card-body"><span class="slot-time">' + (s.start_time || '') + '–' + (s.end_time || '') + '</span>';
            var cap = (s.capacity != null) ? parseInt(s.capacity, 10) : 1;
            var sl = (s.spots_left != null) ? parseInt(s.spots_left, 10) : null;
            if (cap > 1 && sl != null && !isNaN(sl) && sl > 0) {
              var k = Math.abs(sl) % 100;
              var k1 = k % 10;
              var rw = (k > 10 && k < 20) ? 'мест' : (k1 === 1 ? 'место' : (k1 >= 2 && k1 <= 4 ? 'места' : 'мест'));
              var label = 'Осталось ' + sl + ' ' + rw;
              html += '<span class="slot-spots-pill" aria-label="' + label.replace(/"/g, '&quot;') + '">' + label + '</span>';
            }
            html += '</span><span class="slot-arrow">→</span></button>';
          });
          html += '</div>';
        });
        content.innerHTML = html;
        content.querySelectorAll('.slot-card').forEach(function(btn) {
          btn.onclick = function() {
            const slotId = parseInt(btn.dataset.slotId, 10);
            const date = btn.dataset.date;
            const time = btn.dataset.time;
            showForm(slotId, date, time);
          };
        });
      }

      async function showForm(slotId, dateStr, timeStr) {
        window._selectedSlotId = slotId;
        document.getElementById('screenSlots').style.display = 'none';
        document.getElementById('screenForm').style.display = 'block';
        document.getElementById('comment').value = '';
        await fetchClientSession();
        updateBookNameFields();
        document.getElementById('phone').value = clientPhone || '';
        await loadTrainerDetailForBook();
        let effSid = effectiveServiceId();
        if (requestId != null && effSid == null) {
          const initData = tg?.initData || '';
          const hdr = { Accept: 'application/json' };
          if (initData) hdr['X-Telegram-Init-Data'] = initData;
          try {
            const res = await fetch(
              '/api/webapp/client/requests' + (initData ? '?init_data=' + encodeURIComponent(initData) : ''),
              { headers: hdr }
            );
            if (res.ok) {
              const data = await res.json();
              const items = data.items || [];
              const found = items.find(function(x) { return Number(x.id) === requestId; });
              if (found && found.service_id != null) effSid = found.service_id;
            }
          } catch (e) {}
        }
        var selSlot = (allSlots || []).find(function(s) { return Number(s.id) === Number(slotId); });
        var capBook = selSlot && selSlot.capacity != null ? parseInt(selSlot.capacity, 10) : 1;
        if (!isNaN(capBook) && capBook > 1) {
          var ptb = document.getElementById('priceTierBlock');
          if (ptb) ptb.style.display = 'none';
          selectedPriceVariantId = null;
        } else {
          renderPriceTierUi(effSid);
        }
        var slotLine = formatDateKey(dateStr) + ', ' + timeStr;
        var tDetail = bookTrainerDetailCache;
        var srvList = (tDetail && tDetail.services) ? tDetail.services : [];
        if (effSid != null) {
          var srow = srvList.find(function(x) { return Number(x.service_id) === Number(effSid); });
          if (srow && (srow.service_name || '').trim()) {
            slotLine = String(srow.service_name).trim() + ' · ' + slotLine;
          }
        }
        document.getElementById('selectedSlotLabel').textContent = 'Выбрано: ' + slotLine;
        syncBookVenueHint(selSlot);
      }

      function showSlots() {
        var vh = document.getElementById('bookVenueHint');
        if (vh) {
          vh.style.display = 'none';
          vh.innerHTML = '';
        }
        document.getElementById('screenForm').style.display = 'none';
        document.getElementById('screenSuccess').style.display = 'none';
        document.getElementById('screenSlots').style.display = 'block';
        const weekSlots = slotsInWeek(allSlots, currentWeekStart);
        render(weekSlots);
      }

      function goToTrainerCatalogCard() {
        if (!trainerId) {
          showSlots();
          return;
        }
        var serviceFromBookContext =
          selectedServiceId != null
            ? Number(selectedServiceId)
            : (serviceIdFromUrl != null ? Number(serviceIdFromUrl) : null);
        if (serviceFromBookContext != null && !Number.isFinite(serviceFromBookContext)) {
          serviceFromBookContext = null;
        }
        var base = window.location.pathname.replace(/[^/]+$/, '');
        var initData = tg?.initData || '';
        function navigateWithQuery(q) {
          var url = base + 'catalog?' + q;
          if (initData) url += '&init_data=' + encodeURIComponent(initData);
          window.location.href = url;
        }
        var sessHeaders = { Accept: 'application/json' };
        if (initData) sessHeaders['X-Telegram-Init-Data'] = initData;
        fetch('/api/webapp/client/session', {
          headers: sessHeaders,
          cache: 'no-store',
        })
          .then(function(r) { return r.ok ? r.json() : null; })
          .then(function(s) {
            var q = 'trainer_id=' + encodeURIComponent(trainerId);
            if (s && s.city_id != null) q += '&city_id=' + encodeURIComponent(s.city_id);
            var serviceForBack = serviceFromBookContext;
            if (serviceForBack == null && s && s.service_id != null) {
              serviceForBack = Number(s.service_id);
            }
            if (serviceForBack != null && Number.isFinite(serviceForBack)) {
              q += '&service_id=' + encodeURIComponent(String(serviceForBack));
            }
            if (s && s.arena_id != null) q += '&arena_id=' + encodeURIComponent(s.arena_id);
            navigateWithQuery(q);
          })
          .catch(function() {
            var q = 'trainer_id=' + encodeURIComponent(trainerId);
            if (serviceFromBookContext != null && Number.isFinite(serviceFromBookContext)) {
              q += '&service_id=' + encodeURIComponent(String(serviceFromBookContext));
            }
            navigateWithQuery(q);
          });
      }

      (function wireBookHeaderBackToTrainerCard() {
        var headerBack = document.getElementById('btnBack');
        if (!headerBack) return;
        if (!trainerId) {
          headerBack.hidden = true;
          return;
        }
        headerBack.hidden = false;
        headerBack.onclick = goToTrainerCatalogCard;
      })();

      document.getElementById('prevWeek').onclick = function() {
        if (currentWeekStart.getTime() <= thisMonday.getTime()) return;
        currentWeekStart.setDate(currentWeekStart.getDate() - 7);
        document.getElementById('weekLabel').textContent = formatWeekLabel(currentWeekStart);
        render(slotsInWeek(allSlots, currentWeekStart));
      };

      document.getElementById('nextWeek').onclick = function() {
        if (currentWeekStart.getTime() >= nextMonday.getTime()) return;
        currentWeekStart.setDate(currentWeekStart.getDate() + 7);
        document.getElementById('weekLabel').textContent = formatWeekLabel(currentWeekStart);
        render(slotsInWeek(allSlots, currentWeekStart));
      };

      document.getElementById('btnSubmit').onclick = function() {
        const phone = (document.getElementById('phone').value || '').trim();
        const digits = phone.replace(/\D/g, '');
        if (digits.length < 10) {
          alert('Введите корректный номер телефона (например +375291234567)');
          return;
        }
        if (needsProfileName) {
          const fn = (document.getElementById('bookFirstName') && document.getElementById('bookFirstName').value || '').trim();
          if (!fn) {
            alert('Укажите имя');
            return;
          }
        }
        const comment = (document.getElementById('comment').value || '').trim() || null;
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        const initData = tg?.initData || '';
        const url = '/api/webapp/client/booking' + (initData ? '?init_data=' + encodeURIComponent(initData) : '');
        const body = { slot_id: window._selectedSlotId, phone: phone, comment: comment };
        if (needsProfileName) {
          body.first_name = (document.getElementById('bookFirstName').value || '').trim();
          const ln = (document.getElementById('bookLastName').value || '').trim();
          if (ln) body.last_name = ln;
        }
        if (requestId) body.request_id = requestId;
        else {
          const sid = effectiveServiceId();
          if (sid != null) body.service_id = sid;
        }
        if (selectedPriceVariantId != null) body.service_price_variant_id = selectedPriceVariantId;
        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData },
          body: JSON.stringify(body)
        }).then(function(res) {
          return res.json().then(function(data) {
            if (res.ok && data.success) {
              var successMain = '✅ <b>Вы записаны</b>.<br><br>Ожидайте подтверждения от тренера в боте.';
              var successCtx = '';
              if (requestId) {
                successCtx = '<br><span style="color: var(--tg-theme-hint-color); font-size: 14px; display: inline-block; margin-top: 10px;">Запись связана с вашей заявкой и откликом тренера.</span>';
              } else if (data.used_primary_venue_for_online_booking) {
                successCtx = '<br><span style="color: var(--tg-theme-hint-color); font-size: 14px; display: inline-block; margin-top: 10px;">Запись на <strong>основную площадку</strong>. Для занятий на другой арене из фильтра используйте заявку — тренер запишет вас вручную.</span>';
              }
              var successFoot = '<br><span style="color: var(--tg-theme-hint-color); font-size: 14px; display: inline-block; margin-top: 10px;">Детали, адрес и отмена — в «Мои записи» в меню бота.</span>';
              document.getElementById('successMsgBody').innerHTML = successMain + successCtx + successFoot;
              document.getElementById('screenForm').style.display = 'none';
              document.getElementById('screenSuccess').style.display = 'flex';
              fetchClientSession().then(function() { updateBookNameFields(); }).catch(function() {});
            } else {
              alert(data.detail || 'Ошибка. Попробуйте ещё раз.');
            }
          }).catch(function() { alert('Ошибка отправки'); });
        }).catch(function() { alert('Ошибка сети'); }).finally(function() { btn.disabled = false; });
      };

      (async function init() {
        await fetchClientSession();
        updateBookNameFields();
        if (!trainerId) return;
        try {
          if (requestId == null) {
            await ensureServiceChoiceBeforeSlots();
          }
          const data = await fetchSlots();
          trainerName = data.trainer_name || trainerName;
          document.getElementById('headerTitle').textContent = '📅 Запись: ' + trainerName;
          if (data.online_booking_available === false) {
            document.getElementById('prevWeek').style.display = 'none';
            document.getElementById('nextWeek').style.display = 'none';
            document.getElementById('weekLabel').textContent = '';
            document.getElementById('content').innerHTML =
              '<div class="empty">У этого тренера нет самозаписи через каталог. Свяжитесь напрямую или откройте карточку тренера в каталоге.</div>';
            return;
          }
          allSlots = data.slots || [];
          currentWeekStart = new Date(thisMonday.getTime());
          document.getElementById('weekLabel').textContent = formatWeekLabel(currentWeekStart);
          render(slotsInWeek(allSlots, currentWeekStart));
        } catch (e) {
          document.getElementById('content').innerHTML = '<div class="error">' + (e.message || 'Ошибка загрузки') + '</div>';
        }
      })();
    })();
  </script>
  <script src="mini-app-client-home.js"></script>
</body>
