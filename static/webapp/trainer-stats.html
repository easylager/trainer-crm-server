<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Статистика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mini-app-components.css" />
  <script>
    (function () {
      function isAppDark() {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.colorScheme) return tg.colorScheme === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function applyAppTheme() {
        var d = document.documentElement;
        var dark = isAppDark();
        d.style.setProperty('--tg-theme-button-color', '#f5a623');
        d.style.setProperty('--tg-theme-button-text-color', '#1a1a1a');
        d.style.setProperty('--tg-theme-bg-color', dark ? '#000000' : '#fffbec');
        d.style.setProperty('--tg-theme-text-color', dark ? '#ffffff' : '#1a1a1a');
        d.style.setProperty('--tg-theme-secondary-bg-color', dark ? '#1c1c1e' : '#fff5e1');
        d.style.setProperty('--tg-theme-hint-color', dark ? '#8e8e93' : '#666666');
      }
      applyAppTheme();
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyAppTheme);
      }
      window.__applyStatsTheme = applyAppTheme;
    })();
  </script>
  <style>
    /* Shell: theme.css + mini-app-components.css */
    :root {
      --card-bg: var(--tg-theme-secondary-bg-color);
      --accent: var(--tg-theme-button-color);
      --accent-dim: rgba(247, 166, 0, 0.25);
      --up: #34c759;
      --down: #ff3b30;
      --muted: var(--tg-theme-hint-color);
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0));
    }
    /* Hero — same as schedule.html .bd-hero */
    .stats-hero {
      position: relative;
      border-radius: 20px;
      padding: 20px 20px 22px;
      margin-bottom: 18px;
      overflow: hidden;
      background: linear-gradient(155deg, rgba(247, 166, 0, 0.14) 0%, rgba(247, 166, 0, 0.04) 48%, transparent 100%);
      border: 1px solid rgba(247, 166, 0, 0.28);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }
    .stats-hero::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 55%;
      height: 120%;
      background: radial-gradient(ellipse, rgba(247, 166, 0, 0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .stats-hero-inner { position: relative; z-index: 1; }
    .stats-hero-kicker {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--tg-theme-hint-color);
      margin: 0 0 10px;
    }
    .stats-hero-title {
      margin: 0;
      font-size: clamp(22px, 5.5vw, 26px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.15;
      color: var(--tg-theme-text-color);
    }
    .stats-hero-sub {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--tg-theme-hint-color);
      font-weight: 500;
    }
    .loading, .error {
      text-align: center;
      padding: 36px 20px;
      border-radius: 18px;
      background: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(128, 128, 128, 0.12);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.06);
      color: var(--tg-theme-hint-color);
    }
    .error { color: var(--down); }

    /* KPI Grid (top stats cards) */
    .kpi-top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .kpi-top-card {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 16px;
      padding: 16px 14px;
      border: 1px solid rgba(128, 128, 128, 0.1);
      position: relative;
      overflow: hidden;
    }
    .kpi-top-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.7;
    }
    .kpi-top-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 6px;
    }
    .kpi-top-value-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .kpi-top-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--tg-theme-text-color);
    }
    .kpi-top-sub {
      font-size: 12px;
      color: var(--tg-theme-hint-color);
      margin-top: 4px;
    }
    .kpi-top-trend {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .kpi-top-trend.up { background: rgba(52, 199, 89, 0.18); color: var(--up); }
    .kpi-top-trend.down { background: rgba(255, 59, 48, 0.18); color: var(--down); }

    /* Section */
    .section {
      margin-bottom: 22px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--tg-theme-text-color);
      letter-spacing: -0.01em;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 16px;
      padding: 16px 18px;
      border: 1px solid rgba(128, 128, 128, 0.1);
      margin-bottom: 10px;
    }

    /* Bar chart by day */
    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      height: 120px;
      padding: 0 4px;
    }
    .chart-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }
    .chart-bar {
      width: 100%;
      max-width: 36px;
      min-height: 4px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      transition: height 0.3s ease;
      margin: 0 auto;
    }
    .chart-bar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      margin-top: 8px;
    }
    .chart-bar-value {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Weekly trend */
    .trend-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
      height: 80px;
    }
    .trend-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .trend-bar {
      width: 100%;
      max-width: 28px;
      min-height: 4px;
      border-radius: 6px 6px 0 0;
      background: var(--accent-dim);
      margin: 0 auto;
      transition: height 0.25s ease;
    }
    .trend-bar.active { background: var(--accent); }
    .trend-bar-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* KPI grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .kpi-card {
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid rgba(128, 128, 128, 0.1);
    }
    .kpi-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 5px;
    }
    .kpi-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--tg-theme-text-color);
    }
    .kpi-value.rating { font-size: 18px; }
    .stars {
      color: #f5a623;
      letter-spacing: 2px;
    }
    .kpi-sub { font-size: 11px; color: var(--tg-theme-hint-color); margin-top: 3px; }

    /* Insights */
    .insight {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(247, 166, 0, 0.12);
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(247, 166, 0, 0.22);
    }
    .insight-icon { font-size: 18px; flex-shrink: 0; }
    .insight-text { font-size: 13px; color: var(--tg-theme-text-color); line-height: 1.45; }
    .finance-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      font-size: 13px;
    }
    .finance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .finance-row span:last-child {
      font-weight: 600;
    }
    .empty-finance {
      padding: 12px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--tg-theme-hint-color);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <section class="stats-hero">
    <div class="stats-hero-inner">
      <p class="stats-hero-kicker">Аналитика</p>
      <h1 class="stats-hero-title">Ваша статистика</h1>
      <p class="stats-hero-sub">Тренировки, клиенты и доход за выбранный период</p>
    </div>
  </section>

  <div id="content">
    <div class="loading">Загрузка…</div>
  </div>

  <script>
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }

      var initData = tg ? tg.initData : '';
      function fetchWithTimeout(url, opts, ms) {
        ms = ms || 15000;
        var c = new AbortController();
        var t = setTimeout(function() { c.abort(); }, ms);
        return fetch(url, Object.assign({}, opts || {}, { signal: c.signal }))
          .then(function(r) { clearTimeout(t); return r; })
          .catch(function(e) { clearTimeout(t); throw e; });
      }
      function getJson(url) {
        var q = initData ? '?init_data=' + encodeURIComponent(initData) : '';
        return fetchWithTimeout(url + q).then(function(r) {
          if (!r.ok) throw new Error(r.statusText);
          return r.json();
        });
      }

      function formatWeekRange(ws, we) {
        if (!ws || !we) return '—';
        var a = String(ws).split('-');
        var b = String(we).split('-');
        if (a.length >= 3 && b.length >= 3)
          return a[2] + '.' + a[1] + '–' + b[2] + '.' + b[1];
        return ws + ' – ' + we;
      }
      function formatDateShort(isoStr) {
        if (!isoStr) return '—';
        var p = String(isoStr).split('-');
        if (p.length >= 3) return p[2] + '.' + p[1];
        return isoStr;
      }

      function renderTrend(pct) {
        if (pct == null || pct === 0) return '';
        var cls = pct > 0 ? 'up' : 'down';
        var sign = pct > 0 ? '+' : '';
        return '<span class="kpi-top-trend ' + cls + '">' + sign + pct + '%</span>';
      }

      function renderStars(avg) {
        if (avg == null) return '—';
        var full = Math.floor(avg);
        var half = (avg - full) >= 0.5 ? 1 : 0;
        var empty = 5 - full - half;
        var s = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
        return '<span class="stars">' + s + '</span> ' + Number(avg).toFixed(1);
      }

      function formatMoney(cents) {
        if (cents == null) return '—';
        var v = (cents || 0) / 100;
        return v.toFixed(v % 1 === 0 ? 0 : 2) + ' BYN';
      }

      function render(d) {
        var weekLabel = formatWeekRange(d.week_start_iso || d.week_start, d.week_end_iso || d.week_end);
        var html = '';

        // Top KPI cards
        html += '<div class="kpi-top-grid">';
        html += '<div class="kpi-top-card">';
        html += '<div class="kpi-top-label">Эта неделя</div>';
        html += '<div class="kpi-top-value-row"><div class="kpi-top-value">' + (d.week_total || 0) + '</div>' + renderTrend(d.week_change_pct) + '</div>';
        html += '<div class="kpi-top-sub">' + weekLabel + '</div>';
        html += '<div class="kpi-top-sub">Проведено: ' + (d.week_completed || 0) + ', предстоит: ' + (d.week_upcoming || 0) + '</div>';
        html += '</div>';
        html += '<div class="kpi-top-card">';
        html += '<div class="kpi-top-label">Этот месяц</div>';
        html += '<div class="kpi-top-value-row"><div class="kpi-top-value">' + (d.month_total || 0) + '</div>' + renderTrend(d.month_change_pct) + '</div>';
        html += '<div class="kpi-top-sub">Уникальных клиентов: ' + (d.unique_clients_month || 0) + '</div>';
        html += '</div>';
        html += '</div>';

        // Chart: by day
        html += '<div class="section"><div class="section-title">Эта неделя по дням</div><div class="card">';
        html += '<div class="chart-bars">';
        (d.bookings_by_day || []).forEach(function(day) {
          var pct = Math.max(day.pct || 0, 5);
          html += '<div class="chart-bar-wrap">';
          html += '<div class="chart-bar" style="height:' + pct + '%"></div>';
          html += '<div class="chart-bar-label">' + (day.day_label || '') + '</div>';
          html += '<div class="chart-bar-value">' + (day.count || 0) + '</div>';
          html += '</div>';
        });
        html += '</div></div></div>';

        // Weekly trend
        html += '<div class="section"><div class="section-title">Занятий по неделям</div><div class="card">';
        var trendMax = d.trend_max || 1;
        html += '<div class="trend-bars">';
        (d.weekly_trend || []).forEach(function(w, i) {
          var isLast = i === (d.weekly_trend.length - 1);
          var h = trendMax > 0 ? Math.max(8, (w.count / trendMax) * 100) : 8;
          html += '<div class="trend-bar-wrap">';
          html += '<div class="trend-bar' + (isLast ? ' active' : '') + '" style="height:' + h + '%"></div>';
          html += '<div class="trend-bar-label">' + (w.week_label || '') + '</div>';
          html += '</div>';
        });
        html += '</div></div></div>';

        // KPI grid
        html += '<div class="section"><div class="section-title">Показатели</div>';
        html += '<div class="kpi-grid">';
        var loadPct = d.load_pct != null ? d.load_pct : null;
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Загрузка (неделя)</div>';
        html += '<div class="kpi-value">' + (loadPct != null ? loadPct + '%' : '—') + '</div>';
        html += '<div class="kpi-sub">' + (d.week_slots_booked || 0) + ' из ' + (d.week_slots_total || 0) + ' слотов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Новые клиенты (30 дн.)</div>';
        html += '<div class="kpi-value">' + (d.new_clients_30d || 0) + '</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Рейтинг</div>';
        html += '<div class="kpi-value rating">' + renderStars(d.rating_avg) + '</div>';
        html += '<div class="kpi-sub">' + (d.rating_count || 0) + ' отзывов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Клиентов в месяце</div>';
        html += '<div class="kpi-value">' + (d.unique_clients_month || 0) + '</div>';
        html += '</div>';
        html += '</div></div>';

        // Finance section
        html += '<div class="section"><div class="section-title">Финансы</div>';
        html += '<div class="kpi-grid">';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Выручка за 7 дней</div>';
        html += '<div class="kpi-value">' + formatMoney(d.revenue_7d_cents) + '</div>';
        html += '<div class="kpi-sub">По фактическим ценам проведённых занятий</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Выручка за 30 дней</div>';
        html += '<div class="kpi-value">' + formatMoney(d.revenue_30d_cents) + '</div>';
        html += '<div class="kpi-sub">По фактическим ценам проведённых занятий</div>';
        html += '</div>';
        html += '</div></div>';

        // Useful for trainer: free slots, cancellations
        html += '<div class="section"><div class="section-title">На этой неделе</div>';
        html += '<div class="kpi-grid">';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Свободных слотов</div>';
        html += '<div class="kpi-value">' + (d.free_slots_week != null ? d.free_slots_week : '—') + '</div>';
        html += '<div class="kpi-sub">Можно ещё записать клиентов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Отмен за 7 дней</div>';
        html += '<div class="kpi-value">' + (d.cancellations_7d != null ? d.cancellations_7d : '0') + '</div>';
        html += '<div class="kpi-sub">За 30 дней: ' + (d.cancellations_30d != null ? d.cancellations_30d : 0) + '</div>';
        html += '</div>';
        html += '</div></div>';

        // Абонементы и сертификаты
        html += '<div class="section"><div class="section-title">📦 Абонементы и сертификаты</div>';
        html += '<div class="kpi-grid">';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Абонементов активно</div>';
        html += '<div class="kpi-value">' + (d.passes_active != null ? d.passes_active : 0) + '</div>';
        html += '<div class="kpi-sub">С остатком занятий у клиентов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Выдано за 30 дней</div>';
        html += '<div class="kpi-value">' + (d.passes_issued_30d != null ? d.passes_issued_30d : 0) + '</div>';
        html += '<div class="kpi-sub">Новых абонементов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Сертификатов выдано</div>';
        html += '<div class="kpi-value">' + (d.certificates_issued_total != null ? d.certificates_issued_total : 0) + '</div>';
        html += '<div class="kpi-sub">Всего</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">С остатком (не погашены)</div>';
        html += '<div class="kpi-value">' + (d.certificates_with_balance != null ? d.certificates_with_balance : 0) + '</div>';
        html += '<div class="kpi-sub">На сумму ' + formatMoney(d.certificate_balance_cents) + '</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Погашено за 30 дней</div>';
        html += '<div class="kpi-value">' + (d.certificates_redeemed_30d != null ? d.certificates_redeemed_30d : 0) + '</div>';
        html += '<div class="kpi-sub">Сертификатов</div>';
        html += '</div>';
        html += '</div></div>';

        html += '<div class="card">';
        html += '<div class="section-title" style="margin-top:0;">Топ клиентов (30 дней)</div>';
        var clients = d.top_clients || [];
        if (!clients.length) {
          html += '<div class="empty-finance">Пока нет данных за последние 30 дней.</div>';
        } else {
          html += '<div class="finance-list">';
          clients.forEach(function(c) {
            var name = c.name || 'Клиент';
            var phone = c.phone || '';
            var label = phone ? (name + ' — ' + phone) : name;
            html += '<div class="finance-row"><span>' + label + '</span><span>' + (c.sessions || 0) + ' зан.</span></div>';
          });
          html += '</div>';
        }
        html += '</div>';
        html += '</div>';

        // Insights
        if (d.busiest_weekday || d.week_change_pct != null || d.month_change_pct != null) {
          html += '<div class="section"><div class="section-title">Инсайты</div>';
          if (d.busiest_weekday) {
            var busiestDisplay = d.busiest_date ? (formatDateShort(d.busiest_date) + ' (' + d.busiest_weekday + ')') : d.busiest_weekday;
            html += '<div class="insight"><span class="insight-icon">📈</span><span class="insight-text">Самый загруженный день за последний месяц — <strong>' + busiestDisplay + '</strong></span></div>';
          }
          if (d.week_change_pct != null && d.week_change_pct !== 0) {
            var weekText = d.week_change_pct > 0 ? 'На ' + d.week_change_pct + '% больше занятий, чем на прошлой неделе' : 'На ' + (-d.week_change_pct) + '% меньше занятий, чем на прошлой неделе';
            html += '<div class="insight"><span class="insight-icon">📅</span><span class="insight-text">' + weekText + '</span></div>';
          }
          if (d.month_change_pct != null && d.month_change_pct !== 0 && d.month_change_pct !== d.week_change_pct) {
            var monthText = d.month_change_pct > 0 ? 'По сравнению с прошлым месяцем: +' + d.month_change_pct + '% занятий' : 'По сравнению с прошлым месяцем: ' + d.month_change_pct + '% занятий';
            html += '<div class="insight"><span class="insight-icon">🎯</span><span class="insight-text">' + monthText + '</span></div>';
          }
          html += '</div>';
        }

        return html;
      }

      getJson('/api/webapp/trainer/stats').then(function(data) {
        document.getElementById('content').innerHTML = render(data);
      }).catch(function(e) {
        var msg = (e && e.message) ? e.message : 'Ошибка сети или таймаут. Проверьте tunnel и откройте из бота снова.';
        document.getElementById('content').innerHTML = '<div class="error">' + msg + '</div>';
      });
    })();
  </script>
</body>
</html>
