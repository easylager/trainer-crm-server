<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Статистика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* JUSTSKATE.BY brand: black + yellow */
    :root {
      --tg-theme-bg-color: #1a1a1a;
      --tg-theme-text-color: #f5f5f5;
      --tg-theme-hint-color: #8e8e93;
      --tg-theme-button-color: #F7A600;
      --tg-theme-button-text-color: #1a1a1a;
      --tg-theme-secondary-bg-color: #2a2a2a;
      --card-bg: #242424;
      --accent: #F7A600;
      --accent-dim: rgba(247, 166, 0, 0.25);
      --up: #22c55e;
      --down: #ef4444;
      --muted: #71717a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --tg-theme-bg-color: #FFFBEB;
        --tg-theme-text-color: #1a1a1a;
        --tg-theme-hint-color: #666;
        --tg-theme-secondary-bg-color: #FFF3CC;
        --card-bg: #fff;
        --accent-dim: rgba(247, 166, 0, 0.35);
        --muted: #555;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0));
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .loading, .error {
      text-align: center;
      padding: 48px 24px;
      color: var(--tg-theme-hint-color);
    }
    .error { color: #ef4444; }

    /* Hero KPIs */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .hero-card {
      background: linear-gradient(145deg, var(--card-bg) 0%, var(--tg-theme-secondary-bg-color) 100%);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.8;
    }
    .hero-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 4px;
    }
    .hero-value-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .hero-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .hero-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
    .hero-trend {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      margin-left: 0;
    }
    .hero-trend.up { background: rgba(34, 197, 94, 0.2); color: var(--up); }
    .hero-trend.down { background: rgba(239, 68, 68, 0.2); color: var(--down); }

    /* Section */
    .section {
      margin-bottom: 28px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--tg-theme-text-color);
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 12px;
    }

    /* Bar chart by day */
    .chart-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 6px;
      height: 120px;
      padding: 0 4px;
    }
    .chart-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
    }
    .chart-bar {
      width: 100%;
      max-width: 36px;
      min-height: 4px;
      border-radius: 8px 8px 0 0;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dim) 100%);
      transition: height 0.3s ease;
      margin: 0 auto;
    }
    .chart-bar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--tg-theme-hint-color);
      margin-top: 8px;
    }
    .chart-bar-value {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Weekly trend */
    .trend-bars {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 4px;
      height: 80px;
    }
    .trend-bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .trend-bar {
      width: 100%;
      max-width: 28px;
      min-height: 4px;
      border-radius: 6px 6px 0 0;
      background: var(--accent-dim);
      margin: 0 auto;
      transition: height 0.25s ease;
    }
    .trend-bar.active { background: var(--accent); }
    .trend-bar-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* KPI grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .kpi-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .kpi-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 6px;
    }
    .kpi-value {
      font-size: 22px;
      font-weight: 700;
    }
    .kpi-value.rating { font-size: 20px; }
    .stars {
      color: #fbbf24;
      letter-spacing: 2px;
    }
    .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Insights */
    .insight {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: var(--accent-dim);
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    .insight-icon { font-size: 20px; flex-shrink: 0; }
    .insight-text { font-size: 14px; color: var(--tg-theme-text-color); line-height: 1.4; }
    .finance-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      font-size: 13px;
    }
    .finance-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .finance-row span:last-child {
      font-weight: 600;
    }
    .empty-finance {
      padding: 12px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--tg-theme-hint-color);
      font-size: 14px;
    }
    /* JUSTSKATE.BY — перебиваем тему Telegram */
    body { background: #1a1a1a !important; color: #f5f5f5 !important; }
    .hero-card, .card, .kpi-card, .insight { background: #242424 !important; border-color: rgba(255,255,255,0.06) !important; }
    .hero-card::before { background: linear-gradient(90deg, #F7A600, transparent) !important; }
    .chart-bar { background: linear-gradient(180deg, #F7A600 0%, rgba(247,166,0,0.25) 100%) !important; }
    .trend-bar.active { background: #F7A600 !important; }
    @media (prefers-color-scheme: light) {
      body { background: #FFFBEB !important; color: #1a1a1a !important; }
      .hero-card, .card, .kpi-card { background: #fff !important; }
      .insight { background: rgba(247,166,0,0.2) !important; }
    }
  </style>
</head>
<body>
  <script>
  (function(){var d=document.documentElement;d.style.setProperty('--tg-theme-button-color','#F7A600');d.style.setProperty('--tg-theme-button-text-color','#1a1a1a');d.style.setProperty('--tg-theme-bg-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#1a1a1a':'#FFFBEB');d.style.setProperty('--tg-theme-text-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#f5f5f5':'#1a1a1a');d.style.setProperty('--tg-theme-secondary-bg-color',window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'#2a2a2a':'#FFF3CC');d.style.setProperty('--accent','#F7A600');})();
  </script>
  <div class="header">
    <h1>📊 Статистика</h1>
  </div>

  <div id="content">
    <div class="loading">Загрузка…</div>
  </div>

  <script>
    (function() {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); }

      var initData = tg ? tg.initData : '';
      function fetchWithTimeout(url, opts, ms) {
        ms = ms || 15000;
        var c = new AbortController();
        var t = setTimeout(function() { c.abort(); }, ms);
        return fetch(url, Object.assign({}, opts || {}, { signal: c.signal }))
          .then(function(r) { clearTimeout(t); return r; })
          .catch(function(e) { clearTimeout(t); throw e; });
      }
      function getJson(url) {
        var q = initData ? '?init_data=' + encodeURIComponent(initData) : '';
        return fetchWithTimeout(url + q).then(function(r) {
          if (!r.ok) throw new Error(r.statusText);
          return r.json();
        });
      }

      function formatWeekRange(ws, we) {
        if (!ws || !we) return '—';
        var a = String(ws).split('-');
        var b = String(we).split('-');
        if (a.length >= 3 && b.length >= 3)
          return a[2] + '.' + a[1] + '–' + b[2] + '.' + b[1];
        return ws + ' – ' + we;
      }
      function formatDateShort(isoStr) {
        if (!isoStr) return '—';
        var p = String(isoStr).split('-');
        if (p.length >= 3) return p[2] + '.' + p[1];
        return isoStr;
      }

      function renderTrend(pct) {
        if (pct == null || pct === 0) return '';
        var cls = pct > 0 ? 'up' : 'down';
        var sign = pct > 0 ? '+' : '';
        return '<span class="hero-trend ' + cls + '">' + sign + pct + '% к прошл. периоду</span>';
      }

      function renderStars(avg) {
        if (avg == null) return '—';
        var full = Math.floor(avg);
        var half = (avg - full) >= 0.5 ? 1 : 0;
        var empty = 5 - full - half;
        var s = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
        return '<span class="stars">' + s + '</span> ' + Number(avg).toFixed(1);
      }

      function formatMoney(cents) {
        if (cents == null) return '—';
        var v = (cents || 0) / 100;
        return v.toFixed(v % 1 === 0 ? 0 : 2) + ' BYN';
      }

      function render(d) {
        var weekLabel = formatWeekRange(d.week_start_iso || d.week_start, d.week_end_iso || d.week_end);
        var html = '';

        // Hero
        html += '<div class="hero">';
        html += '<div class="hero-card">';
        html += '<div class="hero-label">Эта неделя</div>';
        html += '<div class="hero-value-row"><div class="hero-value">' + (d.week_total || 0) + '</div>' + renderTrend(d.week_change_pct) + '</div>';
        html += '<div class="hero-sub">' + weekLabel + '</div>';
        html += '<div class="hero-sub">Проведено: ' + (d.week_completed || 0) + ', предстоит: ' + (d.week_upcoming || 0) + '</div>';
        html += '</div>';
        html += '<div class="hero-card">';
        html += '<div class="hero-label">Этот месяц</div>';
        html += '<div class="hero-value-row"><div class="hero-value">' + (d.month_total || 0) + '</div>' + renderTrend(d.month_change_pct) + '</div>';
        html += '<div class="hero-sub">Уникальных клиентов: ' + (d.unique_clients_month || 0) + '</div>';
        html += '</div>';
        html += '</div>';

        // Chart: by day
        html += '<div class="section"><div class="section-title">Эта неделя по дням</div><div class="card">';
        html += '<div class="chart-bars">';
        (d.bookings_by_day || []).forEach(function(day) {
          var pct = Math.max(day.pct || 0, 5);
          html += '<div class="chart-bar-wrap">';
          html += '<div class="chart-bar" style="height:' + pct + '%"></div>';
          html += '<div class="chart-bar-label">' + (day.day_label || '') + '</div>';
          html += '<div class="chart-bar-value">' + (day.count || 0) + '</div>';
          html += '</div>';
        });
        html += '</div></div></div>';

        // Weekly trend
        html += '<div class="section"><div class="section-title">Занятий по неделям</div><div class="card">';
        var trendMax = d.trend_max || 1;
        html += '<div class="trend-bars">';
        (d.weekly_trend || []).forEach(function(w, i) {
          var isLast = i === (d.weekly_trend.length - 1);
          var h = trendMax > 0 ? Math.max(8, (w.count / trendMax) * 100) : 8;
          html += '<div class="trend-bar-wrap">';
          html += '<div class="trend-bar' + (isLast ? ' active' : '') + '" style="height:' + h + '%"></div>';
          html += '<div class="trend-bar-label">' + (w.week_label || '') + '</div>';
          html += '</div>';
        });
        html += '</div></div></div>';

        // KPI grid
        html += '<div class="section"><div class="section-title">Показатели</div>';
        html += '<div class="kpi-grid">';
        var loadPct = d.load_pct != null ? d.load_pct : null;
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Загрузка (неделя)</div>';
        html += '<div class="kpi-value">' + (loadPct != null ? loadPct + '%' : '—') + '</div>';
        html += '<div class="kpi-sub">' + (d.week_slots_booked || 0) + ' из ' + (d.week_slots_total || 0) + ' слотов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Новые клиенты (30 дн.)</div>';
        html += '<div class="kpi-value">' + (d.new_clients_30d || 0) + '</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Рейтинг</div>';
        html += '<div class="kpi-value rating">' + renderStars(d.rating_avg) + '</div>';
        html += '<div class="kpi-sub">' + (d.rating_count || 0) + ' отзывов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Клиентов в месяце</div>';
        html += '<div class="kpi-value">' + (d.unique_clients_month || 0) + '</div>';
        html += '</div>';
        html += '</div></div>';

        // Finance section
        html += '<div class="section"><div class="section-title">Финансы</div>';
        html += '<div class="kpi-grid">';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Выручка за 7 дней</div>';
        html += '<div class="kpi-value">' + formatMoney(d.revenue_7d_cents) + '</div>';
        html += '<div class="kpi-sub">По фактическим ценам проведённых занятий</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Выручка за 30 дней</div>';
        html += '<div class="kpi-value">' + formatMoney(d.revenue_30d_cents) + '</div>';
        html += '<div class="kpi-sub">По фактическим ценам проведённых занятий</div>';
        html += '</div>';
        html += '</div></div>';

        // Useful for trainer: free slots, cancellations
        html += '<div class="section"><div class="section-title">На этой неделе</div>';
        html += '<div class="kpi-grid">';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Свободных слотов</div>';
        html += '<div class="kpi-value">' + (d.free_slots_week != null ? d.free_slots_week : '—') + '</div>';
        html += '<div class="kpi-sub">Можно ещё записать клиентов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Отмен за 7 дней</div>';
        html += '<div class="kpi-value">' + (d.cancellations_7d != null ? d.cancellations_7d : '0') + '</div>';
        html += '<div class="kpi-sub">За 30 дней: ' + (d.cancellations_30d != null ? d.cancellations_30d : 0) + '</div>';
        html += '</div>';
        html += '</div></div>';

        // Абонементы и сертификаты
        html += '<div class="section"><div class="section-title">📦 Абонементы и сертификаты</div>';
        html += '<div class="kpi-grid">';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Абонементов активно</div>';
        html += '<div class="kpi-value">' + (d.passes_active != null ? d.passes_active : 0) + '</div>';
        html += '<div class="kpi-sub">С остатком занятий у клиентов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Выдано за 30 дней</div>';
        html += '<div class="kpi-value">' + (d.passes_issued_30d != null ? d.passes_issued_30d : 0) + '</div>';
        html += '<div class="kpi-sub">Новых абонементов</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Сертификатов выдано</div>';
        html += '<div class="kpi-value">' + (d.certificates_issued_total != null ? d.certificates_issued_total : 0) + '</div>';
        html += '<div class="kpi-sub">Всего</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">С остатком (не погашены)</div>';
        html += '<div class="kpi-value">' + (d.certificates_with_balance != null ? d.certificates_with_balance : 0) + '</div>';
        html += '<div class="kpi-sub">На сумму ' + formatMoney(d.certificate_balance_cents) + '</div>';
        html += '</div>';
        html += '<div class="kpi-card">';
        html += '<div class="kpi-label">Погашено за 30 дней</div>';
        html += '<div class="kpi-value">' + (d.certificates_redeemed_30d != null ? d.certificates_redeemed_30d : 0) + '</div>';
        html += '<div class="kpi-sub">Сертификатов</div>';
        html += '</div>';
        html += '</div></div>';

        html += '<div class="card">';
        html += '<div class="section-title" style="margin-top:0;">Топ клиентов (30 дней)</div>';
        var clients = d.top_clients || [];
        if (!clients.length) {
          html += '<div class="empty-finance">Пока нет данных за последние 30 дней.</div>';
        } else {
          html += '<div class="finance-list">';
          clients.forEach(function(c) {
            var name = c.name || 'Клиент';
            var phone = c.phone || '';
            var label = phone ? (name + ' — ' + phone) : name;
            html += '<div class="finance-row"><span>' + label + '</span><span>' + (c.sessions || 0) + ' зан.</span></div>';
          });
          html += '</div>';
        }
        html += '</div>';
        html += '</div>';

        // Insights
        if (d.busiest_weekday || d.week_change_pct != null || d.month_change_pct != null) {
          html += '<div class="section"><div class="section-title">Инсайты</div>';
          if (d.busiest_weekday) {
            var busiestDisplay = d.busiest_date ? (formatDateShort(d.busiest_date) + ' (' + d.busiest_weekday + ')') : d.busiest_weekday;
            html += '<div class="insight"><span class="insight-icon">📈</span><span class="insight-text">Самый загруженный день за последний месяц — <strong>' + busiestDisplay + '</strong></span></div>';
          }
          if (d.week_change_pct != null && d.week_change_pct !== 0) {
            var weekText = d.week_change_pct > 0 ? 'На ' + d.week_change_pct + '% больше занятий, чем на прошлой неделе' : 'На ' + (-d.week_change_pct) + '% меньше занятий, чем на прошлой неделе';
            html += '<div class="insight"><span class="insight-icon">📅</span><span class="insight-text">' + weekText + '</span></div>';
          }
          if (d.month_change_pct != null && d.month_change_pct !== 0 && d.month_change_pct !== d.week_change_pct) {
            var monthText = d.month_change_pct > 0 ? 'По сравнению с прошлым месяцем: +' + d.month_change_pct + '% занятий' : 'По сравнению с прошлым месяцем: ' + d.month_change_pct + '% занятий';
            html += '<div class="insight"><span class="insight-icon">🎯</span><span class="insight-text">' + monthText + '</span></div>';
          }
          html += '</div>';
        }

        return html;
      }

      getJson('/api/webapp/trainer/stats').then(function(data) {
        document.getElementById('content').innerHTML = render(data);
      }).catch(function(e) {
        var msg = (e && e.message) ? e.message : 'Ошибка сети или таймаут. Проверьте tunnel и откройте из бота снова.';
        document.getElementById('content').innerHTML = '<div class="error">' + msg + '</div>';
      });
    })();
  </script>
</body>
</html>
