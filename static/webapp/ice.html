<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Лёд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="client-mini-app-theme.js?v=202609061"></script>
  <link rel="stylesheet" href="theme.css?v=202609041" />
  <link rel="stylesheet" href="mini-app-client-theme.css?v=202609041" />
  <link rel="stylesheet" href="mini-app-components.css?v=202609022" />
  <script src="mini-app-telegram-chrome.js?v=202609071"></script>
  <link rel="stylesheet" href="mini-app-client-nav.css?v=202609022" />
  <link rel="stylesheet" href="mini-app-client-shell.css?v=202609022" />
  <link rel="stylesheet" href="mini-app-arena-ribbon.css?v=202609022" />
  <link rel="stylesheet" href="ice-tab.css?v=202609073" />
  <script src="mini-app-client-shell.js?v=202609068"></script>
  <script src="ice-tab-model.js?v=202609074"></script>
  <script src="ice-map-model.js?v=202609074"></script>
</head>
<body class="ar-pilot ar-pilot--ice" data-client-shell="tabs">
  <div class="header client-app-header">
    <h1 class="header-title client-app-header__title" id="headerTitle">Лёд</h1>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" hidden>Назад</button>
    </div>
  </div>

  <div id="iceRoot" class="ice-tab">
    <div class="ice-sec ice-sec--hero">
      <p class="ice-kicker">Где кататься</p>
      <h1 class="ice-masthead">Лёд</h1>
      <button type="button" class="ice-citypill" id="iceCityChange">
        <span class="ice-citypill__name" id="iceCityName">Город</span>
      </button>
      <div class="ice-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input
          type="search"
          id="iceSearchInput"
          placeholder="Каток, тренер или город"
          autocomplete="off"
          enterkeyhint="search"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>
      <div class="ice-chips" id="iceIntentChips" role="group" aria-label="Намерение">
        <button type="button" class="ice-chip" data-intent="skate" aria-pressed="true">Покататься</button>
        <button type="button" class="ice-chip" data-intent="coach" aria-pressed="false">Тренеры</button>
      </div>
      <div class="ice-chips ice-chips--svc" id="iceServiceChips" hidden role="group" aria-label="Услуга"></div>
      <!--
        Переключатель «Список / Карта» убран в TASK-084 (AC-003, DEC-002).
        Разметка карты ниже (#iceMapSec) и весь её код оставлены на месте:
        возврат = вернуть этот блок и поставить MAP_ENABLED = true в ice-tab.js.
      -->
    </div>
    <div class="ice-sec" id="iceListSec">
      <p class="ice-eyebrow" id="iceCaption">Загрузка…</p>
      <div class="ice-list" id="iceList"></div>
    </div>
    <div class="ice-map-wrap" id="iceMapSec" hidden>
      <div class="ice-map-empty" id="iceMapEmpty" hidden></div>
      <div class="ice-map-stage" id="iceMapStage">
        <div id="iceMapCanvas" class="ice-map-canvas" role="application" aria-label="Карта катков"></div>
        <button type="button" class="ice-near" id="iceNearBtn">◎ Рядом со мной</button>
      </div>
      <div class="ice-map-sheet" id="iceMapSheet"></div>
      <p class="ice-map-offmap" id="iceMapOffMap" hidden></p>
    </div>
    <div class="ice-sec" id="iceSearchSec" hidden>
      <p class="ice-eyebrow">Результаты</p>
      <div class="ice-results" id="iceSearchResults"></div>
    </div>
  </div>

  <div class="ice-picker" id="iceCityPicker" hidden>
    <div class="ice-picker__head">
      <h2>Город</h2>
      <button type="button" class="ice-picker__close" id="iceCityPickerClose">Закрыть</button>
    </div>
    <div class="ice-picker__tools">
      <div class="ice-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="iceCityFilter" placeholder="Найти город…" autocomplete="off" />
      </div>
      <button type="button" class="ice-geo" id="iceGeoBtn">Определить по геолокации</button>
    </div>
    <div class="ice-picker__list" id="iceCityList"></div>
  </div>

  <script src="ice-map.js?v=202609074"></script>
  <script src="ice-tab.js?v=202609074"></script>
</body>
</html>
