<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Поиск</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&display=swap" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- web_app из чата (CTA «Открыть каталог») без expand() остаётся полушторкой — см. mini-app-full-height.js -->
  <script src="mini-app-full-height.js?v=2026100522"></script>
  <script src="client-mini-app-theme.js?v=2026100518"></script>
  <link rel="stylesheet" href="theme.css?v=2026100518" />
  <link rel="stylesheet" href="mini-app-client-theme.css?v=2026100518" />
  <link rel="stylesheet" href="mini-app-components.css?v=2026100518" />
  <script src="mini-app-telegram-chrome.js?v=2026100518"></script>
  <link rel="stylesheet" href="mini-app-client-nav.css?v=2026100518" />
  <link rel="stylesheet" href="mini-app-client-shell.css?v=2026100518" />
  <link rel="stylesheet" href="mini-app-arena-ribbon.css?v=2026100518" />
  <link rel="stylesheet" href="ice-tab.css?v=2026100691" />
  <link rel="stylesheet" href="mini-app-share-sheet.css?v=2026100603" />
  <script src="mini-app-empty-state.js?v=2026100518"></script>
  <script src="mini-app-more-icons.js?v=2026100518"></script>
  <script src="mini-app-client-shell.js?v=2026100699"></script>
  <script src="catalog-geo-model.js?v=2026100518"></script>
  <script src="minsk-time.js?v=2026100698"></script>
  <script src="opening-hours.js?v=2026100691"></script>
  <script src="schedule-staleness-model.js?v=2026100698"></script>
  <script src="arena-schedule-mode-model.js?v=2026100702"></script>
  <script src="ice-tab-model.js?v=2026100703"></script>
  <script src="arena-card-model.js?v=2026100702"></script>
  <script src="mini-app-share-sheet.js?v=2026100602"></script>
  <script src="ice-map-model.js?v=2026100518"></script>
  <!-- TASK-094: не снимать переход по пустой странице. -->
  <link rel="expect" href="#iceRoot" blocking="render" />
</head>
<body class="ar-pilot ar-pilot--ice" data-client-shell="tabs">
  <div class="header client-app-header">
    <h1 class="header-title client-app-header__title" id="headerTitle">Поиск</h1>
    <div class="client-mini-nav">
      <button type="button" class="btn-app-home" id="btnHome">Главная</button>
      <button type="button" class="btn-app-back" id="btnBack" hidden>Назад</button>
    </div>
  </div>

  <div id="iceRoot" class="ice-tab">
    <div class="ice-sec ice-sec--hero">
      <!-- Поле ищет по названию. Подпись меняет setSearchPlaceholder вместе с намерением. -->
      <div class="ice-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input
          type="search"
          id="iceSearchInput"
          placeholder="Каток, зал или трасса"
          autocomplete="off"
          enterkeyhint="search"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <!--
          Город внутри строки — только на карте: заголовок там скрыт, и пилюля
          остаётся на плавающем верхе. В списке город стоит у чипов намерения.
        -->
        <button type="button" class="ice-citypill ice-citypill--insearch" id="iceCityChangeMap">
          <span class="ice-citypill__name">Город</span>
        </button>
      </div>
      <div class="ice-intent-row">
        <div class="ice-seg" id="iceModeSeg" role="tablist" aria-label="Раздел каталога" hidden></div>
        <button type="button" class="ice-citypill" id="iceCityChange">
          <span class="ice-citypill__name" id="iceCityName">Город</span>
        </button>
      </div>
      <div class="ice-chips ice-chips--svc" id="iceServiceChips" hidden role="group" aria-label="Услуга"></div>
      <div class="ice-seg ice-seg--quiet" id="icePlaceTabs" role="tablist" aria-label="Вид площадки" hidden></div>
      <div class="ice-catalog-tools" id="iceCatalogTools" hidden>
        <div class="ice-tools" id="iceToolsRow"></div>
        <div class="ice-menu" id="icePlaceMenu" hidden></div>
        <div class="ice-menu" id="iceWhenMenu" hidden></div>
      </div>
      <div class="ice-shop-filters" id="iceShopFilters" hidden>
        <div class="ice-shop-filters__map-bar" id="iceShopMapBar" hidden>
          <button type="button" class="ice-tool ice-shop-map-filters-btn" id="iceShopMapFiltersBtn" aria-expanded="false">
            <span id="iceShopMapFiltersLabel">Все магазины</span>
          </button>
        </div>
        <div class="ice-shop-filters__panel" id="iceShopFiltersPanel">
        <div class="ice-shop-filters__block">
          <p class="ice-shop-filters__kicker">Что нужно</p>
          <div class="ice-chips ice-chips--shop" id="iceShopServiceChips" role="group" aria-label="Услуга магазина"></div>
        </div>
        <div class="ice-shop-filters__block">
          <p class="ice-shop-filters__kicker">Когда удобно</p>
          <div class="ice-shop-filters__time">
            <button type="button" class="ice-shop-toggle" id="iceShopOpenNow" aria-pressed="false">
              <span class="ice-shop-toggle__dot" aria-hidden="true"></span>Открыто сейчас
            </button>
            <button type="button" class="ice-tool ice-shop-when" id="iceShopWhenBtn" aria-expanded="false">
              <span>Любое время</span>
            </button>
          </div>
          <div class="ice-menu" id="iceShopWhenMenu" hidden></div>
        </div>
        <div class="ice-shop-filters__block" id="iceShopDisciplineBlock" hidden>
          <p class="ice-shop-filters__kicker">Для кого</p>
          <div class="ice-chips ice-chips--shop" id="iceShopDisciplineChips" role="group" aria-label="Дисциплина"></div>
        </div>
        <div class="ice-shop-active" id="iceShopActiveFilters" hidden></div>
        </div>
      </div>
      <!--
        TASK-147 (макет 02): легенда типов мест под чипами окна. Живёт только в режиме карты
        (CSS), наполняет ice-map.js из текущей выдачи; типов меньше двух — блока нет.
      -->
      <div class="ice-map-legend" id="iceMapLegend" hidden role="group" aria-label="Типы мест на карте"></div>
      <!--
        TASK-103: карта вернулась, но переключатель сюда — нет.
        Сегмент «Список / Карта» стоял здесь и стоил ~46px над сгибом; это и было
        названной причиной его удаления в TASK-084 (гейт G-P3 «товар над сгибом»).
        Теперь переключатель — плавающая пилюля #iceViewSwitch в конце документа:
        ноль высоты полотна, один тап в обе стороны.
      -->
    </div>
    <div class="ice-sec" id="iceListSec">
      <div class="ice-listhead">
        <p class="ice-eyebrow" id="iceCaption">Ищем катки…</p>
        <!--
          «Ближе» сортирует уже открытую ленту по расстоянию. Это не поиск и не смена
          города, поэтому кнопка стоит у результата, а не в поле. На карте секция
          списка скрыта: камеру двигает «Где я».
        -->
        <button type="button" class="ice-nearest" id="iceNearestBtn" aria-pressed="false" aria-label="Сначала ближайшие ко мне (нужна геолокация)">Ближе</button>
      </div>
      <div id="iceList">
        <div class="ice-list" id="iceListSkate"></div>
        <div class="ice-list" id="iceListCoach" hidden></div>
      </div>
      <!--
        TASK-096 (G-P5): шеринг-артефакт №1. Кнопка стоит ПОД списком, а не в шапке —
        поделиться расписанием хочется после того, как его просмотрел, и первый экран
        по-прежнему принадлежит товару (G-P3).
      -->
      <button type="button" class="btn-neutral btn-block ice-share" id="iceShareBtn" hidden>
        <span class="ice-share__icon" aria-hidden="true">↗</span>
        <span class="ice-share__label" id="iceShareLabel">Поделиться расписанием</span>
      </button>
    </div>
    <div class="ice-map-wrap" id="iceMapSec" hidden>
      <div class="ice-map-empty" id="iceMapEmpty" hidden></div>
      <div class="ice-map-stage" id="iceMapStage">
        <div id="iceMapCanvas" class="ice-map-canvas" role="application" aria-label="Карта катков"></div>
        <!--
          TASK-103: пока Яндекс не отдал тайлы, сцена показывает лоадер, а не пустую
          серую заливку. Серый прямоугольник неотличим от поломки, и без этого возврат
          карты выглядел бы хуже её отсутствия.
        -->
        <div class="ice-map-loader" id="iceMapLoader" role="status" aria-live="polite">
          <span class="ice-map-loader__spinner" aria-hidden="true"></span>
          <span class="ice-map-loader__text">Загружаем карту…</span>
        </div>
        <!-- TASK-147: кнопка «Где я» — круглая 44px с SVG-иконкой вместо текста. -->
        <button type="button" class="ice-near" id="iceNearBtn" aria-label="Где я" title="Где я">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="2.4"/>
            <path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="7.5" stroke-opacity=".45"/>
          </svg>
        </button>
      </div>
      <div class="ice-map-sheet" id="iceMapSheet"></div>
      <!-- TASK-147: копирайт Яндекса — обязательное условие использования их API. -->
      <p class="ice-map-attrib" id="iceMapAttrib">© Яндекс · <a href="https://yandex.ru/legal/maps_termsofuse/" target="_blank" rel="noopener">Условия</a></p>
      <p class="ice-map-offmap" id="iceMapOffMap" hidden></p>
    </div>
    <div class="ice-sec" id="iceSearchSec" hidden>
      <p class="ice-eyebrow">Результаты</p>
      <div class="ice-results" id="iceSearchResults"></div>
    </div>
  </div>

  <div class="ice-picker" id="iceCityPicker" hidden>
    <div class="ice-picker__head">
      <h2>Город</h2>
      <button type="button" class="ice-picker__close" id="iceCityPickerClose">Закрыть</button>
    </div>
    <div class="ice-picker__tools">
      <div class="ice-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="iceCityFilter" placeholder="Найти город…" autocomplete="off" />
      </div>
      <button type="button" class="ice-geo" id="iceGeoBtn">Определить по геолокации</button>
    </div>
    <p class="ice-picker__label" id="iceCityPopularLabel" hidden>Популярные города</p>
    <div class="ice-picker__popular" id="iceCityPopular"></div>
    <div class="ice-picker__list" id="iceCityList"></div>
  </div>

  <!--
    TASK-103: переключатель «Список ↔ Карта».
    Плавающая пилюля, а не сегмент в шапке: сегмент занимал верх первого экрана и
    нарушал G-P3 («товар над сгибом»), из-за чего карту и выключили в TASK-084.
    Здесь он стоит ноль высоты полотна и одинаково доступен в обоих состояниях.
    Скрыт по умолчанию: показывается только для чипов «Где заниматься» и «Группы» —
    тренеров на карте нет.
  -->
  <button type="button" class="ice-viewswitch" id="iceViewSwitch" hidden aria-pressed="false">
    <span class="ice-viewswitch__icon" id="iceViewSwitchIcon" aria-hidden="true"></span>
    <span class="ice-viewswitch__label" id="iceViewSwitchLabel">Карта</span>
  </button>

  <script src="ru-text.js?v=2026100518"></script>
  <script src="ice-map.js?v=2026100690"></script>
  <script src="ice-tab.js?v=2026100703"></script>
</body>
</html>
