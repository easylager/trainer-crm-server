<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Как на остальных вкладках бара: с viewport-fit=cover iOS отдаёт ненулевой env(safe-area-inset-bottom),
       и бар оболочки здесь вставал на ~34 px выше, чем на соседних вкладках (прыгал при переключении). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Кто кого</title>
  <!--
    TASK-391: соседние вкладки (Главная, Я, …) включают cross-document view transitions.
    Без opt-in здесь Chrome/Telegram WebView на первом уходе стартует переход и обрывает его
    (InvalidStateError / «не переходит»); со второго раза, когда кэш тёплый, маскируется.
    Инлайн в <head> — надёжнее внешнего CSS (проверка opt-in до первого кадра).
    Оболочка по возможности глушит уход (cw-vt-off / pageswap) — тогда анимации нет.
  -->
  <style id="kk-vt-opt-in">
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/webapp/mini-app-telegram-chrome.js?v=202611174"></script>
  <!-- TASK-388: свои шрифты, как на главной (те же Dela Gothic One и Golos Text 400–700), вместо Google Fonts:
       внешний CSS (30 КБ) и шрифты с gstatic держали load на ~0,9 с; теперь общий кэш с другими вкладками. -->
  <link rel="preload" href="/static/fonts/glide-public/dela-gothic-one-cyr-lat.woff2?v=__FONT_V__" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/glide-public/golos-text-cyr-lat.woff2?v=__FONT_V__" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/shared/glide-public-fonts.css?v=202611174">
  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=202611174">
  <!-- TASK-374: оболочка (бар вкладок) грузится ТОЛЬКО при season_ui из кэша флагов оболочки (cw_ui_flags_v1, привязан к id
       пользователя Telegram). Флаг выключен, кэша нет, кэш битый, чужой или старше суток — оболочки на странице нет вовсе: ни запросов
       client/session и ui-flags, ни событий, ни переадресаций, игра как раньше. При флаге — синхронно (document.write),
       чтобы бар был до первого кадра. Пробел: при пустом кэше бар появится после захода на другую вкладку приложения. -->
  <script id="kk-shell-gate">
  (function () {
    var on = false;
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      var uid = u && u.id != null ? String(u.id) : '';
      var c = uid ? JSON.parse(window.localStorage.getItem('cw_ui_flags_v1') || 'null') : null;
      var age = c ? Date.now() - c.at : -1;
      /* Правило и TTL (сутки) те же, что в mini-app-client-shell.js и client-season-back.js. */
      on = !!c && String(c.u) === uid && c.season_ui === true && typeof c.at === 'number' && age >= 0 && age < 86400000;
    } catch (e) { on = false; }
    if (!on) return;
    document.write('<link rel="stylesheet" href="/static/webapp/mini-app-client-shell.css?v=202611174">'
      + '<script src="/static/webapp/write-access.js?v=202611174"><\/script>'
      + '<script src="/static/webapp/mini-app-client-shell.js?v=202611174"><\/script>');
  })();
  </script>
  <link rel="stylesheet" href="/static/webapp/kto-kogo.css?v=202611174">
  <script defer src="/static/webapp/ga-press.js?v=202611174"></script>
</head>
<body>
  <div class="kk" id="kk"></div>
  <script src="/static/webapp/kto-kogo-model.js?v=202611174"></script>

</body>
