<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Мои заявки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mini-app-components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <script>
    /** Same as trainer-pass-products / schedule — lock CRM palette; Telegram themeParams often inject blue. */
    (function () {
      function isAppDark() {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.colorScheme) return tg.colorScheme === 'dark';
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function applyAppTheme() {
        var d = document.documentElement;
        var dark = isAppDark();
        d.classList.toggle('client-requests--dark', dark);
        d.style.setProperty('--tg-theme-button-color', '#f5a623');
        d.style.setProperty('--tg-theme-button-text-color', '#1a1a1a');
        /* Тёмная тема: графитово-темный фон + карточки #2c2c2e (конституция CRM) */
        d.style.setProperty('--tg-theme-bg-color', dark ? '#1c1c1c' : '#fffbec');
        d.style.setProperty('--tg-theme-text-color', dark ? '#ffffff' : '#1a1a1a');
        d.style.setProperty('--tg-theme-secondary-bg-color', dark ? '#2c2c2e' : '#fff5e1');
        d.style.setProperty('--tg-theme-hint-color', dark ? '#8e8e93' : '#666666');
      }
      applyAppTheme();
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyAppTheme);
      }
      window.__applyClientRequestsTheme = applyAppTheme;
    })();
  </script>
  <style>
    /* Переопределения для клиентского мини-приложения */
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    [data-screen] { display: none; }
    [data-screen].active { display: block; }
    /* Карточки заявок в стиле slot-card из расписания */
    .request-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color);
      border: 2px solid transparent;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .request-card:hover {
      border-color: var(--tg-theme-button-color);
      transform: translateY(-1px);
    }
    .request-card:active { 
      opacity: 0.8; 
      transform: scale(0.98);
    }
    .request-card .main { 
      flex: 1; 
      min-width: 0; 
    }
    .request-card .title { 
      font-weight: 600; 
      font-size: 16px; 
      margin-bottom: 4px; 
      line-height: 1.3;
      color: var(--tg-theme-text-color);
    }
    .request-card .meta { 
      font-size: 13px; 
      color: var(--tg-theme-hint-color);
      font-weight: 500;
    }
    .request-card .arrow { 
      color: var(--tg-theme-button-color); 
      font-size: 14px; 
      opacity: 0.7;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }
    .request-card:hover .arrow {
      opacity: 1;
    }
    .screen-title { 
      font-size: 20px; 
      font-weight: 700; 
      margin-bottom: 8px; 
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: -0.02em;
      color: var(--tg-theme-text-color);
    }
    .screen-hint { 
      font-size: 14px; 
      color: var(--tg-theme-hint-color); 
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .detail-block { margin-bottom: 16px; }
    .detail-value { font-size: 15px; }
    /* Экран детали заявки — как деталь записи (bd-*) */
    #screenDetail {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .cr-detail-screen {
      animation: bd-enter 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes bd-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cr-detail-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .cr-detail-top .bd-screen-head { margin-bottom: 0; flex: 1; min-width: 0; }
    .cr-detail-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .cr-detail-toolbar button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(128, 128, 128, 0.14);
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-hint-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .cr-detail-toolbar button:active { transform: scale(0.97); opacity: 0.85; }
    .cr-detail-toolbar button svg { width: 20px; height: 20px; }
    .cr-detail-toolbar button.danger {
      color: var(--app-danger, #ff3b30);
      border-color: rgba(255, 59, 48, 0.25);
    }
    .cr-detail-hero .bd-hero {
      margin-bottom: 14px;
    }
    .cr-detail-title {
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--tg-theme-text-color);
      word-break: break-word;
    }
    .cr-comment-block {
      margin-bottom: 18px;
    }
    .detail-section-title { 
      font-size: 11px; 
      font-weight: 600; 
      color: var(--tg-theme-hint-color); 
      margin: 4px 0 10px 4px; 
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    /* Карточки откликов тренеров */
    .responder-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color);
      border: 2px solid transparent;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .responder-row:hover {
      border-color: var(--tg-theme-button-color);
      transform: translateY(-1px);
    }
    .responder-row:active { 
      opacity: 0.8; 
      transform: scale(0.98);
    }
    
    /* Анимация появления карточек */
    @keyframes card-enter {
      from { 
        opacity: 0; 
        transform: translateY(10px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
    
    .request-card, .responder-row {
      animation: card-enter 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    
    .request-card:nth-child(1) { animation-delay: 0.05s; }
    .request-card:nth-child(2) { animation-delay: 0.1s; }
    .request-card:nth-child(3) { animation-delay: 0.15s; }
    .request-card:nth-child(4) { animation-delay: 0.2s; }
    .request-card:nth-child(5) { animation-delay: 0.25s; }
    
    .responder-row:nth-child(1) { animation-delay: 0.05s; }
    .responder-row:nth-child(2) { animation-delay: 0.1s; }
    .responder-row:nth-child(3) { animation-delay: 0.15s; }
    .responder-row .row-avatar-wrap {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .responder-row .row-avatar-wrap .row-avatar-loading {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--tg-theme-secondary-bg-color);
    }
    .responder-row .row-avatar-wrap .row-avatar-loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: photo-shimmer 1.2s ease-in-out infinite;
      border-radius: 50%;
    }
    .responder-row .row-avatar-wrap .row-avatar {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .responder-row .row-avatar-wrap .row-avatar.loaded {
      opacity: 1;
    }
    .responder-row .row-avatar-placeholder {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
      background: rgba(128,128,128,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--tg-theme-hint-color);
    }
    @keyframes photo-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .responder-row .row-main { flex: 1; min-width: 0; position: relative; z-index: 1; }
    .responder-row .row-name { 
      font-weight: 600; 
      font-size: 16px; 
      margin: 0 0 4px; 
      line-height: 1.3;
      color: var(--tg-theme-text-color);
    }
    .responder-row .row-comment { 
      font-size: 13px; 
      color: var(--tg-theme-hint-color); 
      margin: 0; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      line-height: 1.4;
    }
    .responder-row .row-arrow { 
      color: var(--tg-theme-button-color); 
      flex-shrink: 0; 
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }
    .responder-row .row-arrow svg { width: 16px; height: 16px; }
    .responder-row:hover .row-arrow {
      opacity: 1;
    }
    .detail-back-wrap { margin-top: 28px; padding-top: 8px; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--tg-theme-hint-color);
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
    }
    .back-link .back-link-chevron { flex-shrink: 0; width: 16px; height: 16px; color: inherit; }
    .back-link:active { opacity: 0.7; }
    /* Full trainer card (from request response) */
    .trainer-card-full {
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      text-align: left;
    }
    /* Современная карточка тренера в откликах - дизайнерский шедевр */
    .trainer-card-full .tcf-photo-wrap {
      position: relative;
      width: calc(100% + 32px);
      margin-left: -16px;
      margin-right: -16px;
      aspect-ratio: 4/3;
      min-height: 240px;
      max-height: 320px;
      border-radius: 0 0 20px 20px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--tg-theme-secondary-bg-color) 0%, rgba(245, 166, 35, 0.1) 100%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }
    .trainer-card-full .tcf-photo-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--tg-theme-secondary-bg-color) 0%, rgba(245, 166, 35, 0.1) 100%);
      border-radius: 0 0 20px 20px;
    }
    .trainer-card-full .tcf-photo-placeholder.tcf-photo-loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 0%, rgba(245, 166, 35, 0.15) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: photo-shimmer 1.5s ease-in-out infinite;
      border-radius: 0 0 20px 20px;
    }
    .trainer-card-full .tcf-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      border-radius: 0 0 20px 20px;
      background: rgba(128,128,128,0.2);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .trainer-card-full .tcf-photo.loaded {
      opacity: 1;
    }
    .trainer-card-full .tcf-body { padding: 20px 0 0; }
    .trainer-card-full .tcf-header {
      margin-bottom: 20px;
    }
    .trainer-card-full .tcf-name { 
      font-size: 28px; 
      font-weight: 700; 
      margin: 0 0 12px; 
      text-align: left; 
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--tg-theme-text-color);
    }
    .trainer-card-full .tcf-comment {
      font-size: 15px;
      color: var(--tg-theme-text-color);
      line-height: 1.5;
      margin-bottom: 20px;
      padding: 16px 50px 16px 16px;
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.15) 0%, rgba(245, 166, 35, 0.05) 100%);
      border-radius: 16px;
      border-left: 4px solid var(--tg-theme-button-color);
      text-align: left;
      position: relative;
    }
    .trainer-card-full .tcf-comment::before {
      content: '💬';
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 18px;
      opacity: 0.6;
    }
    .trainer-card-full .tcf-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .trainer-card-full .tcf-stat {
      padding: 12px;

      border-radius: 12px;

    }
    .trainer-card-full .tcf-stat:hover {
      border-color: rgba(245, 166, 35, 0.3);
    }
    .trainer-card-full .tcf-stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 4px;
    }
    .trainer-card-full .tcf-stat-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--tg-theme-text-color);
    }
    .trainer-card-full .tcf-rating {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.15) 0%, rgba(245, 166, 35, 0.05) 100%);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--tg-theme-button-color);
      margin-bottom: 16px;
    }
    .trainer-card-full .tcf-services {
      margin-bottom: 20px;
    }
    .trainer-card-full .tcf-services-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 12px;
    }
    .trainer-card-full .tcf-service {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      margin-bottom: 6px;
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 10px;
      font-size: 14px;
    }
    .trainer-card-full .tcf-service-name {
      font-weight: 500;
      color: var(--tg-theme-text-color);
    }
    .trainer-card-full .tcf-service-price {
      font-weight: 600;
      color: var(--tg-theme-button-color);
    }
    .trainer-card-full .tcf-education {
      margin-bottom: 20px;
    }
    .trainer-card-full .tcf-education-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 12px;
    }
    .trainer-card-full .tcf-education-item {
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }
    .trainer-card-full .tcf-desc { 
      font-size: 15px; 
      line-height: 1.5; 
      margin: 20px 0; 
      padding: 16px;
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 16px;
      white-space: pre-wrap; 
      text-align: left; 
    }
    /* Современные кнопки для карточки тренера в откликах */
    .trainer-card-full .tcf-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }
    .trainer-card-full .tcf-actions a,
    .trainer-card-full .tcf-actions button.tcf-write {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
      font: inherit;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }
    .trainer-card-full .tcf-actions .tcf-write {
      background: linear-gradient(135deg, #f5a623 0%, #e89400 100%);
      color: #1a1a1a;
      box-shadow: 0 8px 24px rgba(245, 166, 35, 0.4);
    }
    .trainer-card-full .tcf-actions .tcf-write::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    .trainer-card-full .tcf-actions .tcf-write:hover::before {
      left: 100%;
    }
    .trainer-card-full .tcf-actions .tcf-write:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(245, 166, 35, 0.5);
    }
    .trainer-card-full .tcf-actions .tcf-write:active {
      transform: translateY(0);
      box-shadow: 0 4px 16px rgba(245, 166, 35, 0.3);
    }
    .trainer-card-full .tcf-actions .tcf-book {
      background: transparent;
      color: var(--tg-theme-button-color);
      border: 2px solid rgba(245, 166, 35, 0.3);
    }
    .trainer-card-full .tcf-actions .tcf-book:hover {
      background: rgba(245, 166, 35, 0.1);
      border-color: var(--tg-theme-button-color);
      transform: translateY(-1px);
    }
    .trainer-card-full .tcf-actions .tcf-book:active {
      transform: translateY(0);
      opacity: 0.8;
    }
    .trainer-card-full .tcf-back { margin-top: 24px; }
    .card-wrap {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color);
      margin-bottom: 16px;
    }
    .card-wrap textarea {
      width: 100%;
      min-height: 100px;
      border: none;
      background: transparent;
      color: var(--tg-theme-text-color);
      font: inherit;
      font-size: 15px;
      resize: vertical;
    }
    .card-wrap textarea::placeholder { color: var(--tg-theme-hint-color); }
    .loading, .error, .empty { 
      text-align: center; 
      padding: 40px 20px; 
      color: var(--tg-theme-hint-color); 
      font-size: 15px;
      line-height: 1.6;
    }
    .error { color: var(--app-danger, #ff3b30); }
    .pagination { 
      display: flex; 
      justify-content: center; 
      align-items: center;
      gap: 12px; 
      margin: 20px 0; 
    }
    .pagination button {
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pagination button:hover {
      border-color: var(--tg-theme-button-color);
    }
    .pagination button:active {
      transform: scale(0.96);
      opacity: 0.8;
    }
    .pagination span { font-size: 14px; color: var(--tg-theme-hint-color); align-self: center; }
    .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .btn-block {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-sizing: border-box;
    }
    .btn-block.btn-primary {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn-block.btn-primary:active { 
      transform: scale(0.96); 
      opacity: 0.8;
    }

      background: transparent;
      border: 1.5px solid rgba(255, 59, 48, 0.5);
      color: #ff453a;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
    }
    .btn-block.btn-danger:active {
      transform: scale(0.985);
      opacity: 0.92;
    }
    .btn-secondary {
      padding: 12px 20px;
      border-radius: 12px;
      border: 2px solid transparent;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      border-color: var(--tg-theme-button-color);
    }
    .btn-secondary:active {
      transform: scale(0.96);
      opacity: 0.8;
    }
    /* Дополнительные стили для темной темы */
    @media (prefers-color-scheme: dark) {
      .request-card,
      .responder-row {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .request-card:hover,
      .responder-row:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      .trainer-card-full .tcf-photo-wrap {
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      }
      .trainer-card-full .tcf-stat {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .trainer-card-full .tcf-desc {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    }
    
    /* Модальное окно отзывов */
    .reviews-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .reviews-modal.show {
      display: flex;
    }
    .reviews-modal-content {
      background: var(--tg-theme-bg-color);
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }
    .reviews-modal-header {
      padding: 20px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .reviews-modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--tg-theme-text-color);
    }
    .reviews-modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .reviews-modal-body {
      padding: 20px;
    }
    .review-item {
      padding: 16px;
      margin-bottom: 12px;
      background: var(--tg-theme-secondary-bg-color);
      border-radius: 12px;
      border-left: 4px solid var(--tg-theme-button-color);
    }
    .review-rating {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--tg-theme-button-color);
    }
    .review-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--tg-theme-text-color);
    }
    .review-date {
      font-size: 12px;
      color: var(--tg-theme-hint-color);
      margin-top: 8px;
    }
    .reviews-loading {
      text-align: center;
      padding: 40px;
      color: var(--tg-theme-hint-color);
    }
    .reviews-empty {
      text-align: center;
      padding: 40px;
      color: var(--tg-theme-hint-color);
    }
    
    /* Дополнительные bd-компоненты для красивой детали заявки */
    .bd-section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tg-theme-hint-color);
      margin: 4px 0 10px 4px;
    }
    
    /* Улучшенные кнопки действий */
    .action-buttons .btn-block {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">Мои заявки</span>
  </div>

  <div id="screenList" data-screen class="active">
    <div id="requestList"></div>
    <div id="pagination" class="pagination"></div>
    <div id="screenEmpty" class="empty" style="display: none;">
      <p>У вас пока нет заявок.</p>
      <p style="margin-top: 8px; font-size: 14px;">Оставьте заявку в «Тренеры и запись»: когда список тренеров пустой, внизу списка или в карточке тренера. После этого заявка появится здесь.</p>
      <button type="button" class="btn-secondary" id="btnRefreshEmpty" style="margin-top: 16px;">Обновить</button>
    </div>
  </div>

  <div id="screenDetail" data-screen>
    <div class="booking-detail cr-detail-screen">
      <div class="cr-detail-top">
        <div class="bd-screen-head">
          <div class="bd-screen-title">ЗАЯВКА</div>
        </div>
        <div class="cr-detail-toolbar">
          <button type="button" id="btnEditRequest" title="Редактировать заявку" aria-label="Редактировать">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button type="button" id="btnDeleteRequest" class="danger" title="Удалить заявку" aria-label="Удалить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      <div class="cr-detail-hero">
        <div class="bd-hero">
          <div class="bd-hero-inner">
            <div class="cr-detail-title" id="detailTitleMain">—</div>
            <div class="bd-hero-date" id="detailDateLine"></div>
          </div>
        </div>
      </div>
      <div class="bd-rows cr-comment-block">
        <div class="bd-row bd-comment">
          <div class="bd-row-text">
            <div class="bd-row-label">Комментарий</div>
            <div class="bd-row-value" id="detailComment">—</div>
          </div>
        </div>
      </div>
      <div class="bd-section-label">Откликнулись</div>
      <div id="detailResponses"></div>
      <div class="detail-back-wrap">
        <span class="back-link" id="backFromDetail"><svg class="back-link-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>К списку заявок</span>
      </div>
    </div>
  </div>

  <div id="screenResponderDetail" data-screen>
    <div id="responderDetailContent" class="trainer-card-full"></div>
    <div class="trainer-card-full tcf-back">
      <span class="back-link" id="backFromResponderDetail"><svg class="back-link-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>К откликам</span>
    </div>
  </div>

  <div id="screenEdit" data-screen>
    <div class="screen-title">Редактирование заявки</div>
    <div class="screen-hint" id="editCityService">—</div>
    <div class="card-wrap">
      <textarea id="editComment" placeholder="Комментарий к заявке (необязательно)"></textarea>
    </div>
    <div class="action-buttons">
      <button type="button" class="btn-block btn-primary" id="btnSaveComment">Сохранить</button>
      <button type="button" class="btn-block btn-danger" id="btnDeleteInEdit">Удалить заявку</button>
      <span class="back-link" id="backFromEdit"><svg class="back-link-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Назад</span>
    </div>
  </div>

  <script>
    (function() {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        if (typeof window.__applyClientRequestsTheme === 'function') {
          window.__applyClientRequestsTheme();
        }
        function syncTelegramChromeColors() {
          try {
            var darkUi = tg.colorScheme === 'dark' ||
              (tg.colorScheme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var bgHex = darkUi ? '#1c1c1c' : '#fffbec';
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor(bgHex);
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor(bgHex);
            if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor(bgHex);
          } catch (e) { /* older clients */ }
        }
        syncTelegramChromeColors();
        if (tg.onEvent) {
          tg.onEvent('themeChanged', function () {
            if (typeof window.__applyClientRequestsTheme === 'function') {
              window.__applyClientRequestsTheme();
            }
            syncTelegramChromeColors();
          });
        }
      }

      const PER_PAGE = 10;
      let state = {
        items: [],
        total: 0,
        page: 0,
        currentRequest: null,
        selectedResponder: null,
        bookBaseUrl: ''
      };

      function initData() {
        return (tg && tg.initData) ? tg.initData : '';
      }

      function apiUrl(path, useQueryInit) {
        const base = '/api/webapp';
        if (useQueryInit && initData()) {
          return base + path + '?init_data=' + encodeURIComponent(initData());
        }
        return base + path;
      }

      function headers() {
        const h = { 'Content-Type': 'application/json' };
        const id = initData();
        if (id) h['X-Telegram-Init-Data'] = id;
        return h;
      }

      function showScreen(id) {
        document.querySelectorAll('[data-screen]').forEach(function(el) { el.classList.remove('active'); });
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      }

      function closeApp() {
        if (tg) tg.close(); else window.close();
      }
      var btnClose = document.getElementById('btnClose');
      if (btnClose) btnClose.onclick = closeApp;

      // Base URL for book Mini App (same origin)
      const path = window.location.pathname || '';
      const base = path.replace(/\/[^/]*$/, '') || '';
      state.bookBaseUrl = (window.location.origin || '') + (base ? base + '/' : '/') + 'book';

      async function fetchRequests() {
        var url = apiUrl('/client/requests', false);
        var res = await fetch(url, { headers: headers() });
        if (!res.ok) {
          const err = await res.json().catch(function() { return {}; });
          throw new Error(err.detail || res.statusText);
        }
        return res.json();
      }

      function escapeHtml(s) {
        if (s == null || s === undefined) return '';
        const t = String(s);
        return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function photoUrl(fileKey) {
        if (!fileKey) return '';
        return '/api/public/photos/' + encodeURIComponent(fileKey);
      }

      function formatRequestLabel(req) {
        const city = (req.city_name || '').trim() || '—';
        const service = (req.service_name || '').trim() || '—';
        return city + ', ' + service;
      }

      function formatRequestCreatedAt(iso) {
        if (!iso) return '';
        try {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return '';
          return 'Создана ' + d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        } catch (e) { return ''; }
      }

      function renderList() {
        const listEl = document.getElementById('requestList');
        const emptyEl = document.getElementById('screenEmpty');
        const pagEl = document.getElementById('pagination');
        state.items = state.items || [];
        const total = state.items.length;
        if (total === 0) {
          listEl.innerHTML = '';
          emptyEl.style.display = 'block';
          pagEl.innerHTML = '';
          return;
        }
        emptyEl.style.display = 'none';
        const start = state.page * PER_PAGE;
        const pageItems = state.items.slice(start, start + PER_PAGE);
        let html = '';
        pageItems.forEach(function(req) {
          const count = (req.responses || []).length;
          let sub;
          if (count === 0) sub = 'Нет откликов';
          else if (count % 10 === 1 && count % 100 !== 11) sub = count + ' отклик';
          else if ([2, 3, 4].indexOf(count % 10) >= 0 && (count % 100 < 10 || count % 100 >= 20)) sub = count + ' отклика';
          else sub = count + ' откликов';
          html += '<button type="button" class="request-card" data-request-id="' + req.id + '">';
          html += '<div class="main"><div class="title">' + escapeHtml(formatRequestLabel(req)) + '</div>';
          html += '<div class="meta">' + escapeHtml(sub) + '</div></div>';
          html += '<span class="arrow">→</span></button>';
        });
        listEl.innerHTML = html;
        listEl.querySelectorAll('.request-card').forEach(function(btn) {
          btn.onclick = function() {
            const id = parseInt(btn.dataset.requestId, 10);
            const req = state.items.find(function(r) { return r.id === id; });
            if (req) { state.currentRequest = req; renderDetail(); showScreen('screenDetail'); }
          };
        });

        const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
        let pagHtml = '';
        if (state.page > 0) {
          pagHtml += '<button type="button" id="pagePrev">◀ Назад</button>';
        }
        pagHtml += '<span>Стр. ' + (state.page + 1) + ' из ' + totalPages + '</span>';
        if (start + pageItems.length < total) {
          pagHtml += '<button type="button" id="pageNext">Вперёд ▶</button>';
        }
        pagEl.innerHTML = pagHtml;
        const prevBtn = document.getElementById('pagePrev');
        if (prevBtn) prevBtn.onclick = function() { state.page--; renderList(); };
        const nextBtn = document.getElementById('pageNext');
        if (nextBtn) nextBtn.onclick = function() { state.page++; renderList(); };
      }

      function renderDetail() {
        const req = state.currentRequest;
        if (!req) return;
        var titleEl = document.getElementById('detailTitleMain');
        var dateLineEl = document.getElementById('detailDateLine');
        if (titleEl) titleEl.textContent = formatRequestLabel(req);
        if (dateLineEl) {
          var meta = formatRequestCreatedAt(req.created_at);
          dateLineEl.textContent = meta || '';
          dateLineEl.style.display = meta ? 'block' : 'none';
        }
        const comment = (req.comment || '').trim();
        var cEl = document.getElementById('detailComment');
        if (cEl) {
          cEl.textContent = comment ? comment : 'Без комментария';
          cEl.style.fontStyle = comment ? 'italic' : 'normal';
          cEl.style.opacity = comment ? '0.92' : '0.65';
        }
        const responses = req.responses || [];
        const wrap = document.getElementById('detailResponses');
        if (responses.length === 0) {
          wrap.innerHTML = '<div class="screen-hint">Пока никто не откликнулся. Тренеры по вашему городу и услуге увидят заявку и смогут написать.</div>';
        } else {
          let html = '';
          responses.forEach(function(r, idx) {
            const name = (r.name || 'Тренер').trim() || 'Тренер';
            const tc = (r.trainer_comment || '').trim();
            const photo = photoUrl(r.photo_key);
            const commentShort = tc ? (tc.length > 50 ? tc.slice(0, 47) + '…' : tc) : 'Отклик без комментария';
            html += '<button type="button" class="responder-row" data-responder-index="' + idx + '">';
            if (photo) {
              html += '<span class="row-avatar-wrap"><span class="row-avatar-loading"></span><img src="' + escapeHtml(photo) + '" alt="" class="row-avatar" loading="lazy"></span>';
            } else {
              html += '<div class="row-avatar-placeholder">?</div>';
            }
            html += '<div class="row-main"><p class="row-name">' + escapeHtml(name) + '</p><p class="row-comment">' + escapeHtml(commentShort) + '</p></div>';
            html += '<span class="row-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span></button>';
          });
          wrap.innerHTML = html;
          wrap.querySelectorAll('.row-avatar-wrap .row-avatar').forEach(function(img) {
            function onLoaded() {
              img.classList.add('loaded');
              var ph = img.previousElementSibling;
              if (ph && ph.classList.contains('row-avatar-loading')) ph.style.display = 'none';
            }
            img.onload = onLoaded;
            if (img.complete) onLoaded();
          });
          wrap.querySelectorAll('.responder-row').forEach(function(btn) {
            btn.onclick = function() {
              var idx = parseInt(btn.dataset.responderIndex, 10);
              state.selectedResponder = (req.responses || [])[idx];
              if (state.selectedResponder) { renderResponderDetail(); showScreen('screenResponderDetail'); }
            };
          });
        }
      }

      function renderResponderDetail() {
        var r = state.selectedResponder;
        var req = state.currentRequest;
        if (!r || !req) return;
        var name = (r.name || 'Тренер').trim() || 'Тренер';
        var tc = (r.trainer_comment || '').trim();
        var ratingStr = (r.rating_avg != null && (r.rating_count || 0) > 0) ? (r.rating_avg.toFixed(1) + ' ★ (' + r.rating_count + ')') : null;
        var expStr = r.experience_years != null ? r.experience_years + ' лет опыта' : null;
        var duration = r.session_duration_minutes != null ? r.session_duration_minutes : 45;
        var desc = (r.description || '').trim();
        var photo = photoUrl(r.photo_key);
        var bookUrl = state.bookBaseUrl + '?trainer_id=' + encodeURIComponent(r.trainer_id) + '&request_id=' + encodeURIComponent(req.id);
        var html = '';
        html += '<div class="tcf-photo-wrap">';
        if (photo) {
          html += '<div class="tcf-photo-placeholder tcf-photo-loading"></div><img src="' + escapeHtml(photo) + '" alt="" class="tcf-photo" loading="eager">';
        } else {
          html += '<div class="tcf-photo-placeholder"></div>';
        }
        html += '</div>';
        html += '<div class="tcf-body">';
        html += '<div class="tcf-header">';
        html += '<h1 class="tcf-name">' + escapeHtml(name) + '</h1>';
        if (ratingStr) {
          html += '<div class="tcf-rating" style="cursor: pointer;" onclick="showTrainerReviews(' + r.trainer_id + ')">⭐ ' + escapeHtml(ratingStr) + '</div>';
        }
        html += '</div>';
        
        // Комментарий тренера к заявке (особенность карточки в откликах)
        if (tc) html += '<div class="tcf-comment">' + escapeHtml(tc) + '</div>';
        
        html += '<div class="tcf-stats">';
        if (expStr) {
          html += '<div class="tcf-stat">';
          html += '<div class="tcf-stat-label">Опыт</div>';
          html += '<div class="tcf-stat-value">' + escapeHtml(expStr) + '</div>';
          html += '</div>';
        }
        html += '<div class="tcf-stat">';
        html += '<div class="tcf-stat-label">Занятие</div>';
        html += '<div class="tcf-stat-value">' + duration + ' мин</div>';
        html += '</div>';
        html += '</div>';
        
        // Услуги и цены — тот же формат, что в каталоге (service_name + price_byn)
        var servicesList = Array.isArray(r.services) ? r.services : [];
        if (servicesList.length > 0) {
          html += '<div class="tcf-services">';
          html += '<div class="tcf-services-title">Услуги и цены</div>';
          servicesList.forEach(function(s) {
            var serviceName = s.service_name || '—';
            var priceText = s.price_byn != null ? (s.price_byn === Math.floor(s.price_byn) ? s.price_byn : s.price_byn.toFixed(2)) + ' BYN' : 'по запросу';
            html += '<div class="tcf-service">';
            html += '<span class="tcf-service-name">' + escapeHtml(serviceName) + '</span>';
            html += '<span class="tcf-service-price">' + escapeHtml(priceText) + '</span>';
            html += '</div>';
          });
          html += '</div>';
        }
        
        // Добавляем образование, если оно есть
        if (r.education && Array.isArray(r.education) && r.education.length > 0) {
          html += '<div class="tcf-education">';
          html += '<div class="tcf-education-title">Образование</div>';
          r.education.forEach(function(edu) {
            var eduText = edu.institution || '';
            if (edu.degree) eduText += (eduText ? ', ' : '') + edu.degree;
            if (edu.year) eduText += (eduText ? ' (' : '(') + edu.year + ')';
            if (eduText) {
              html += '<div class="tcf-education-item">' + escapeHtml(eduText) + '</div>';
            }
          });
          html += '</div>';
        }
        
        if (desc) html += '<div class="tcf-desc">' + escapeHtml(desc) + '</div>';
        html += '<div class="tcf-actions">';
        // В Mini App tg:// не открывается; только https://t.me/username через tg.openLink
        if (r.telegram_username) {
          html += '<button type="button" class="tcf-write" data-tg-username="' + escapeHtml(r.telegram_username) + '">Написать</button>';
        }
        html += '<a href="' + escapeHtml(bookUrl) + '" class="tcf-book">Записаться</a>';
        html += '</div></div>';
        document.getElementById('responderDetailContent').innerHTML = html;
        var tcfImg = document.querySelector('#responderDetailContent .tcf-photo');
        if (tcfImg) {
          function onPhotoLoaded() {
            tcfImg.classList.add('loaded');
            var ph = tcfImg.previousElementSibling;
            if (ph) ph.style.display = 'none';
          }
          tcfImg.onload = onPhotoLoaded;
          if (tcfImg.complete) onPhotoLoaded();
        }
        var writeBtn = document.getElementById('responderDetailContent').querySelector('.tcf-write');
        if (writeBtn && tg && tg.openLink) {
          var un = writeBtn.getAttribute('data-tg-username');
          if (un) writeBtn.onclick = function() { tg.openLink('https://t.me/' + encodeURIComponent(un)); };
        }
      }

      document.getElementById('backFromResponderDetail').onclick = function() {
        state.selectedResponder = null;
        showScreen('screenDetail');
      };

      document.getElementById('backFromDetail').onclick = function() {
        state.currentRequest = null;
        renderList();
        showScreen('screenList');
      };

      document.getElementById('btnEditRequest').onclick = function() {
        const req = state.currentRequest;
        if (!req) return;
        const hasResponses = (req.responses || []).length > 0;
        if (hasResponses && !confirm('При редактировании заявки все текущие отклики тренеров будут удалены — вы больше не увидите их в этой заявке. Продолжить?')) return;
        document.getElementById('editCityService').textContent = 'Город: ' + (req.city_name || '—') + ', Услуга: ' + (req.service_name || '—');
        document.getElementById('editComment').value = (req.comment || '').trim();
        showScreen('screenEdit');
      };

      document.getElementById('backFromEdit').onclick = function() {
        showScreen('screenDetail');
      };

      document.getElementById('btnSaveComment').onclick = function() {
        const req = state.currentRequest;
        if (!req) return;
        const comment = (document.getElementById('editComment').value || '').trim() || null;
        const url = apiUrl('/client/requests/' + req.id);
        fetch(url, {
          method: 'PATCH',
          headers: headers(),
          body: JSON.stringify({ comment: comment })
        }).then(function(res) { return res.json(); }).then(function(data) {
          if (data.success && data.request) {
            const idx = state.items.findIndex(function(r) { return r.id === req.id; });
            if (idx >= 0) state.items[idx] = data.request;
            state.currentRequest = data.request;
            renderDetail();
            showScreen('screenDetail');
          } else {
            alert('Не удалось сохранить. Попробуйте ещё раз.');
          }
        }).catch(function() { alert('Ошибка сети'); });
      };

      function doDelete(requestId, onSuccess) {
        const url = apiUrl('/client/requests/' + requestId);
        fetch(url, { method: 'DELETE', headers: headers() }).then(function(res) {
          if (res.ok) {
            state.items = state.items.filter(function(r) { return r.id !== requestId; });
            state.currentRequest = null;
            if (onSuccess) onSuccess();
          } else {
            alert('Не удалось удалить заявку.');
          }
        }).catch(function() { alert('Ошибка сети'); });
      }

      document.getElementById('btnDeleteRequest').onclick = function() {
        const req = state.currentRequest;
        if (!req || !confirm('Удалить эту заявку?')) return;
        doDelete(req.id, function() { renderList(); showScreen('screenList'); });
      };

      document.getElementById('btnDeleteInEdit').onclick = function() {
        const req = state.currentRequest;
        if (!req || !confirm('Удалить эту заявку?')) return;
        doDelete(req.id, function() { renderList(); showScreen('screenList'); });
      };

      function getRequestIdFromUrl() {
        var params = new URLSearchParams(window.location.search || '');
        var id = params.get('request_id');
        if (id == null) return null;
        var n = parseInt(id, 10);
        return isNaN(n) ? null : n;
      }

      function loadList() {
        var listEl = document.getElementById('requestList');
        var emptyEl = document.getElementById('screenEmpty');
        var openRequestId = getRequestIdFromUrl();
        listEl.innerHTML = '<div class="loading">Загрузка...</div>';
        emptyEl.style.display = 'none';
        fetchRequests().then(function(data) {
          state.items = Array.isArray(data.items) ? data.items : [];
          state.page = 0;
          renderList();
          if (openRequestId != null) {
            var req = state.items.find(function(r) { return r.id === openRequestId; });
            if (req) {
              state.currentRequest = req;
              renderDetail();
              showScreen('screenDetail');
            }
          }
        }).catch(function(e) {
          listEl.innerHTML = '<div class="error">' + escapeHtml(e.message || 'Ошибка загрузки') + '</div>';
          emptyEl.style.display = 'none';
        });
      }

      document.getElementById('btnRefreshEmpty').onclick = function() {
        document.getElementById('screenEmpty').style.display = 'none';
        document.getElementById('requestList').innerHTML = '<div class="loading">Загрузка...</div>';
        loadList();
      };

      loadList();
      
      // Функция для показа отзывов тренера
      window.showTrainerReviews = function(trainerId) {
        var modal = document.getElementById('reviewsModal');
        var modalBody = document.getElementById('reviewsModalBody');
        var modalTitle = document.getElementById('reviewsModalTitle');
        
        modalTitle.textContent = 'Отзывы о тренере';
        modalBody.innerHTML = '<div class="reviews-loading">Загрузка отзывов...</div>';
        modal.classList.add('show');
        
        // Загружаем отзывы
        var initData = tg ? tg.initData : '';
        var headers = {};
        if (initData) headers['X-Telegram-Init-Data'] = initData;
        
        fetch('/api/webapp/trainer/' + trainerId + '/reviews', { headers: headers })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            var reviews = data.reviews || [];
            if (reviews.length === 0) {
              modalBody.innerHTML = '<div class="reviews-empty">У этого тренера пока нет отзывов</div>';
              return;
            }
            
            var html = '';
            reviews.forEach(function(review) {
              html += '<div class="review-item">';
              html += '<div class="review-rating">⭐ ' + review.rating + '/5</div>';
              if (review.comment) {
                html += '<div class="review-text">' + escapeHtml(review.comment) + '</div>';
              }
              if (review.created_at) {
                var date = new Date(review.created_at).toLocaleDateString('ru-RU');
                html += '<div class="review-date">' + date + '</div>';
              }
              html += '</div>';
            });
            modalBody.innerHTML = html;
          })
          .catch(function() {
            modalBody.innerHTML = '<div class="reviews-empty">Не удалось загрузить отзывы</div>';
          });
      };
      
      // Закрытие модального окна
      window.closeReviewsModal = function() {
        document.getElementById('reviewsModal').classList.remove('show');
      };
    })();
  </script>
  
  <!-- Модальное окно отзывов -->
  <div id="reviewsModal" class="reviews-modal" onclick="if(event.target === this) closeReviewsModal()">
    <div class="reviews-modal-content">
      <div class="reviews-modal-header">
        <div id="reviewsModalTitle" class="reviews-modal-title">Отзывы</div>
        <button type="button" class="reviews-modal-close" onclick="closeReviewsModal()">×</button>
      </div>
      <div id="reviewsModalBody" class="reviews-modal-body">
        <!-- Контент отзывов -->
      </div>
    </div>
  </div>
</body>
</html>
