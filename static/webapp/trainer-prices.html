<!--
  «Услуги и цены» (TASK-313). Отдельный экран с одной задачей вместо блока анкеты, где у каждой
  услуги было пять тарифов с галочками и нулями. Здесь — карточка на занятие, «Взрослый» и
  «Детский» сразу, остальное под «Ещё тарифы». Пустая цена — ученик видит «по запросу».
-->
<body class="ta-body ts-page">
  <main class="tp-page" id="tpPage">
    <button type="button" class="ts-back tp-back" id="tpBack">
      <span class="ts-back__ic" id="tpBackIc"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></span>
      <span class="ts-back__label" id="tpBackLabel">Профиль</span>
    </button>
    <h1 class="tp-title">Услуги и цены</h1>
    <p class="tp-lead" id="tpLead">Пустая цена — ученик увидит «по&nbsp;запросу»</p>

    <div class="ta-loading" id="tpLoading">
      <div class="ta-skel ta-skel--card"></div>
      <div class="ta-skel ta-skel--card"></div>
    </div>
    <div class="ta-error" id="tpError" hidden>
      <p class="ta-error__title">Не получилось загрузить</p>
      <p class="ta-error__text">Проверьте связь и попробуйте ещё раз.</p>
      <button type="button" class="ta-btn" id="tpRetry">Обновить</button>
    </div>

    <div class="tp-list" id="tpList" hidden></div>
  </main>

  <div class="tp-foot" id="tpFoot" hidden>
    <div class="tp-foot__inner">
      <button type="button" class="tp-save" id="tpSave" disabled>Сохранить</button>
      <p class="tp-note" id="tpNote" aria-live="polite"></p>
    </div>
  </div>

  <script defer src="trainer-prices-main.js?v=202610283"></script>
</body>
</html>
