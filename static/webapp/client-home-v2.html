  <!-- TASK-445 (glide-home-v1, этап 1): новая главная за флагом redesign_s1.
       Остальные получают client-home.html (см. webapp_client_home_page). -->
  <link rel="preload" href="/static/fonts/glide-public/dela-gothic-one-cyr-lat.woff2?v=__FONT_V__" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/fonts/glide-public/golos-text-cyr-lat.woff2?v=__FONT_V__" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="/static/shared/glide-components.css?v=202611231" />
  <script>
    /* Тот же ранний bootstrap, что на старой главной (TASK-314): запрос уходит из <head>,
       пока грузятся SDK и скрипты. Профиль — та же догадка (выбранный или с прошлого раза). */
    (function () {
      try {
        var init = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('tgWebAppData') ||
          new URLSearchParams(location.search).get('init_data') || '';
        if (!init) return;
        var pid = null;
        try {
          var v = localStorage.getItem('cw_active_profile_id_v1');
          pid = v ? parseInt(v, 10) : null;
          if (pid == null) {
            var user = JSON.parse(new URLSearchParams(init).get('user') || 'null');
            var d = JSON.parse(localStorage.getItem('cw_default_profile_v1') || 'null');
            if (user && d && d.u === String(user.id) && Number(d.id) > 0) pid = Number(d.id);
          }
        } catch (e) { pid = null; }
        if (pid == null || !(pid > 0)) return;
        var headers = { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': init, 'X-Profile-Id': String(pid) };
        var promise = fetch('/api/webapp/client/hub/bootstrap?init_data=' + encodeURIComponent(init), { headers: headers, cache: 'no-store' });
        promise.catch(function () {});
        window.__clientEarlyBootstrap = { init: init, pid: pid, promise: promise };
      } catch (e) { /* обычный путь подхватит */ }
    })();
  </script>
