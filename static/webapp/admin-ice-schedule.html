<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Расписание льда · Админ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="mini-app-telegram-chrome.js?v=202610266"></script>
  <link rel="stylesheet" href="/static/shared/glide-tokens.css?v=202610266" />
  <link rel="stylesheet" href="theme.css?v=202610266" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--app-font-sans);
      background: var(--tg-theme-bg-color, #1a1a1a);
      color: var(--tg-theme-text-color, #f5f5f5);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: calc(120px + env(safe-area-inset-bottom, 0));
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }
    .top-bar h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .top-bar .sub { font-size: 12px; color: var(--tg-theme-hint-color, #9ca3af); margin-top: 4px; }
    .link-back {
      font-size: 12px;
      color: var(--tg-theme-link-color, #38bdf8);
      text-decoration: none;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .panel {
      background: var(--tg-theme-secondary-bg-color, #111827);
      border-radius: 14px;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      margin-bottom: 12px;
    }
    .panel-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--tg-theme-hint-color);
      margin-bottom: 8px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row > * { flex: 1; min-width: 120px; }
    select, input[type="text"], input[type="date"], input[type="time"], input[type="number"], input[type="search"] {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      padding: 8px 10px;
      font-size: 14px;
      background: rgba(15, 23, 42, 0.75);
      color: inherit;
      font-family: inherit;
    }
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .week-nav button {
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: transparent;
      color: inherit;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .week-nav .week-label {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      flex: 1;
    }
    .day-tabs {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }
    .day-tab {
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 10px;
      padding: 8px 2px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      background: rgba(30, 41, 59, 0.85);
      /* <button> в WebApp тянет button_text_color — на тёмном фоне нечитаемо */
      color: var(--tg-theme-text-color, #e8eef7);
      -webkit-text-fill-color: currentColor;
      font-family: inherit;
    }
    .day-tab strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
      margin-top: 3px;
      color: var(--tg-theme-text-color, #f8fafc);
      font-variant-numeric: tabular-nums;
    }
    .day-tab.on {
      border-color: rgba(96, 165, 250, 0.95);
      background: rgba(59, 130, 246, 0.32);
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25);
    }
    .day-tab.on strong { color: #fff; }
    .day-tab .cnt {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: rgba(203, 213, 225, 0.92);
      margin-top: 3px;
    }
    .day-tab.on .cnt { color: rgba(219, 234, 254, 0.95); }
    .session-list { display: flex; flex-direction: column; gap: 8px; min-height: 48px; }
    .session-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.55);
    }
    .session-card.cancelled { opacity: 0.45; }
    .session-time { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .session-meta { font-size: 12px; color: var(--tg-theme-hint-color); margin-top: 4px; line-height: 1.35; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .badge-mk { background: rgba(34, 197, 94, 0.25); color: #86efac; }
    .badge-ohm { background: rgba(249, 115, 22, 0.25); color: #fdba74; }
    .badge-other { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .session-actions { display: flex; flex-direction: column; gap: 6px; }
    .session-actions button {
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: transparent;
      color: inherit;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .session-actions button.danger { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .empty-day {
      font-size: 14px;
      line-height: 1.45;
      color: rgba(203, 213, 225, 0.95);
      padding: 12px 4px;
    }
    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0));
      background: linear-gradient(180deg, transparent 0%, rgba(15, 23, 42, 0.92) 18%, rgba(15, 23, 42, 0.98) 100%);
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      z-index: 20;
    }
    .composer .row { margin-bottom: 8px; }
    .composer .row:last-child { margin-bottom: 0; }
    .quick-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-btns button {
      border: none;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .btn-mk { background: linear-gradient(135deg, #16a34a, #15803d); }
    .btn-ohm { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .composer-hint { font-size: 11px; color: var(--tg-theme-hint-color); text-align: center; margin-top: 6px; }
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(100px + env(safe-area-inset-bottom, 0));
      padding: 10px 16px; border-radius: 12px;
      background: rgba(34, 197, 94, 0.95); color: #fff; font-size: 14px;
      z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .toast.visible { opacity: 1; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .toolbar-actions button {
      flex: 1;
      min-width: 140px;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: transparent;
      color: var(--tg-theme-link-color, #38bdf8);
    }
    details.advanced { margin-top: 8px; font-size: 12px; }
    details.advanced summary { cursor: pointer; color: var(--tg-theme-hint-color); }
    .advanced-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: 100%; max-width: 520px;
      background: var(--tg-theme-secondary-bg-color, #111827);
      border-radius: 16px 16px 0 0;
      padding: 16px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet h2 { margin: 0 0 12px; font-size: 17px; }
    .sheet .actions { display: flex; gap: 8px; margin-top: 14px; }
    .sheet .actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
    .sheet .btn-save { background: var(--tg-theme-button-color, #2ea6ff); color: #fff; }
    .sheet .btn-cancel { background: rgba(148, 163, 184, 0.35); color: inherit; }
    .load-band { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; font-size: 12px; }
    .load-band .time { min-width: 72px; color: var(--tg-theme-hint-color); }
    .lvl-btn { border-radius: 8px; border: 1px solid rgba(148,163,184,0.4); padding: 4px 8px; cursor: pointer; font-size: 11px; }
    .lvl-btn.on-calm { background: #22c55e; color: #052e16; border-color: #16a34a; }
    .lvl-btn.on-medium { background: #eab308; color: #422006; border-color: #ca8a04; }
    .lvl-btn.on-busy { background: #ef4444; color: #450a0a; border-color: #dc2626; }
    .arena-load-badge { font-size: 11px; color: var(--tg-theme-hint-color); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div class="top-bar">
    <div>
      <h1>⛸ Расписание льда</h1>
      <div class="sub" id="arenaSubtitle">Выберите город и арену</div>
    </div>
    <a class="link-back" href="/webapp/admin-dicts">← Справочники</a>
  </div>

  <div class="panel">
    <div class="panel-title">Где редактируем</div>
    <div class="row">
      <select id="citySelect" aria-label="Город"></select>
      <select id="arenaSelect" aria-label="Арена"></select>
    </div>
    <input type="search" id="arenaSearch" placeholder="Поиск арены по названию" style="margin-top:8px;width:100%;">
    <div class="toolbar-actions">
      <button type="button" id="btnCopyWeek">Копировать эту неделю → следующая</button>
      <button type="button" id="btnToday">Сегодня</button>
    </div>
  </div>

  <details class="panel" id="loadRulesPanel">
    <summary class="panel-title" style="cursor:pointer;margin-bottom:0;">Обычная загрузка (день × час)</summary>
    <div id="loadRulesGlobal" style="margin-top:10px;"></div>
    <div id="loadRulesArena" hidden style="margin-top:12px;border-top:1px solid rgba(148,163,184,0.25);padding-top:10px;">
      <div class="panel-title">Арена</div>
      <div class="row">
        <select id="arenaLoadCharacter" aria-label="Характер катка">
          <option value="steady">Обычный</option>
          <option value="quiet">Тише среднего</option>
          <option value="hot">Люднее среднего</option>
        </select>
        <button type="button" id="btnResetArenaLoad">Сбросить свою шкалу</button>
      </div>
      <div class="arena-load-badge" id="arenaLoadBadge"></div>
      <div id="loadRulesArenaBands"></div>
    </div>
  </details>

  <div class="panel" id="schedulePanel" hidden>
    <div class="week-nav">
      <button type="button" id="btnPrevWeek" aria-label="Предыдущая неделя">←</button>
      <div class="week-label" id="weekLabel">—</div>
      <button type="button" id="btnNextWeek" aria-label="Следующая неделя">→</button>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <div class="composer" id="composer" hidden>
    <div class="row">
      <input type="time" id="addTime" value="11:00" aria-label="Время начала">
      <input type="number" id="addDuration" min="30" max="120" step="15" value="45" aria-label="Длительность минут">
    </div>
    <div class="quick-btns">
      <button type="button" class="btn-mk" id="btnAddMk">+ Массовое катание</button>
      <button type="button" class="btn-ohm" id="btnAddOhm">+ ОХМ</button>
    </div>
    <details class="advanced">
      <summary>Цены и другие типы</summary>
      <div class="advanced-grid">
        <input type="number" step="0.01" min="0" id="priceAdult" placeholder="Взрослый">
        <input type="number" step="0.01" min="0" id="priceChild" placeholder="Детский">
        <input type="number" step="0.01" min="0" id="priceRental" placeholder="Прокат">
        <select id="addKind">
          <option value="public_skate">Массовое</option>
          <option value="hockey_practice">ОХМ</option>
          <option value="open_ice">Открытый лёд</option>
          <option value="rental">Прокат льда</option>
          <option value="school_group">Группа / школа</option>
          <option value="event">Событие</option>
        </select>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--tg-theme-hint-color);">
        <input type="checkbox" id="repeatWeekly"> Повторять каждую неделю (4 недели)
      </label>
      <button type="button" id="btnAddCustom" style="margin-top:8px;width:100%;padding:8px;border-radius:10px;border:1px solid rgba(148,163,184,0.4);background:transparent;color:inherit;cursor:pointer;">
        Добавить выбранный тип
      </button>
    </details>
    <div class="composer-hint" id="composerHint">Слоты не пересекаются · длительность 30–120 мин</div>
  </div>

  <div class="sheet-backdrop" id="editSheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet">
      <h2>Редактировать сеанс</h2>
      <div class="row">
        <input type="date" id="editDate">
        <input type="time" id="editTime">
      </div>
      <div class="row" style="margin-top:8px;">
        <input type="number" id="editDuration" min="30" max="120" step="15">
        <select id="editKind"></select>
      </div>
      <div class="advanced-grid" style="margin-top:8px;">
        <input type="number" step="0.01" min="0" id="editPriceAdult" placeholder="Взрослый">
        <input type="number" step="0.01" min="0" id="editPriceChild" placeholder="Детский">
        <input type="number" step="0.01" min="0" id="editPriceRental" placeholder="Прокат">
      </div>
      <div class="actions">
        <button type="button" class="btn-cancel" id="editCancel">Отмена</button>
        <button type="button" class="btn-save" id="editSave">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/webapp/admin-ice-schedule-main.js?v=202610266"></script>
</body>
</html>
