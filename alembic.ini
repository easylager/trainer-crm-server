[alembic]
script_location = migrations
# Overridden at runtime by migrations/env.py from DATABASE_URL_SYNC / DATABASE_URL in .env
sqlalchemy.url = postgresql+psycopg://trainer_crm:trainer_crm_dev@localhost:5432/trainer_crm

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
