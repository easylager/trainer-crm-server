[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "migrations",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (black handles this)
    "E203",   # whitespace before ':'
    # Hard-gate v1 debt (CI enforces everything else). Raise the bar in follow-ups:
    "B008",   # FastAPI Depends() in defaults — idiomatic
    "C901",   # complexity — large handlers for now
    "E402",   # imports not at top — lazy imports in bots/webapp
    "E701",
    "E702",
    "E731",
    "I001",   # import sort — separate autofix PR
    "UP012",
    "UP017",
    "UP032",
    "UP034",
    "UP035",
    "UP037",
    "UP042",
    "UP045",  # Optional[X] → X | None mass rewrite later
    "B010",
    "B023",
    "B033",
    "B904",
    "B905",
    "C401",
    "C408",
    "C413",
    "C416",
    "C420",
    "F401",   # unused import — clean in follow-up
    "F541",
    "F811",
    "F841",   # unused variable — clean in follow-up
    "W291",
    "W293",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Too strict for now
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "collective: tests that work with studio/collective database state",
    "integration: integration tests that need database",
    "unit: pure unit tests without database",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*pass\\s*$",
]
precision = 2
