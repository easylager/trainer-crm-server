# CI: run tests on push/PR. PostgreSQL service + migrations + pytest.
name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainer_crm
          POSTGRES_PASSWORD: trainer_crm_dev
          POSTGRES_DB: trainer_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://trainer_crm:trainer_crm_dev@localhost:5432/trainer_crm_test
      DATABASE_URL_SYNC: postgresql://trainer_crm:trainer_crm_dev@localhost:5432/trainer_crm_test
      TELEGRAM_BOT_TOKEN_CLIENT: ci-placeholder
      TELEGRAM_BOT_TOKEN_TRAINER: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short
