# CI: comprehensive code quality, security, and testing pipeline.
name: Tests

on:
  push:
    branches: [master, main, develop, staging, release/**]
  pull_request:
    branches: [master, main, develop, staging, release/**]

env:
  DATABASE_URL: postgresql+asyncpg://trainer_crm:trainer_crm_dev@localhost:5432/trainer_crm_test
  DATABASE_URL_SYNC: postgresql://trainer_crm:trainer_crm_dev@localhost:5432/trainer_crm_test
  TELEGRAM_BOT_TOKEN_CLIENT: ci-placeholder
  TELEGRAM_BOT_TOKEN_TRAINER: ci-placeholder

jobs:
  # ──────────────────────────────────────────────────────
  # LINT: Code formatting and static analysis
  # ──────────────────────────────────────────────────────
  lint:
    name: Lint (black, ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format check (black)
        run: black --check src/ tests/ --diff
        continue-on-error: true  # Soft until formatting is cleaned up

      - name: Linter (ruff)
        # Hard gate: fails the job. Debt rules are ignored in pyproject.toml (v1).
        run: ruff check src/ tests/

      - name: Type checker (mypy)
        run: mypy src/ --ignore-missing-imports --no-implicit-optional --warn-unused-configs
        continue-on-error: true  # Soft until types are cleaned up

  # ──────────────────────────────────────────────────────
  # SECURITY: Code vulnerabilities and dependencies
  # ──────────────────────────────────────────────────────
  security:
    name: Security (bandit, safety)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security check (bandit)
        run: bandit -r src/ -ll -i --skip B101,B601
        continue-on-error: true  # Report but don't fail yet

      - name: Dependency vulnerability scan (safety)
        run: safety check --json
        continue-on-error: true  # Many false positives; report for review

  # ──────────────────────────────────────────────────────
  # STUDIO TESTS: Collective/integration tests
  # ──────────────────────────────────────────────────────
  studio-tests:
    name: Studio Tests (collective)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, security]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainer_crm
          POSTGRES_PASSWORD: trainer_crm_dev
          POSTGRES_DB: trainer_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run studio (collective) tests
        run: pytest tests/ -m collective -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: studio-tests
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────
  # UNIT & INTEGRATION TESTS
  # ──────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, security]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainer_crm
          POSTGRES_PASSWORD: trainer_crm_dev
          POSTGRES_DB: trainer_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tesseract (Orsha / Shklov OCR parsers)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: pytest tests/ -m "not collective" -v --tb=short --cov=src --cov-report=xml --cov-report=term

      - name: Check coverage threshold (floor)
        # Real gate. Current suite sits ~40% on CI; raise toward 60–70 in follow-ups.
        # Do not swallow failures with `|| echo` — that made the threshold decorative.
        run: coverage report --fail-under=40

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unit-integration-tests
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────
  # SUMMARY: Overall status check
  # ──────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, security, studio-tests, test]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.security.result }}" == "failure" || "${{ needs.studio-tests.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi
