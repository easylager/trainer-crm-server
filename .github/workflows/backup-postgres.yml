# Daily off-site Postgres backup (pg_dump → S3-compatible storage).
# Secrets: BACKUP_DATABASE_URL, BACKUP_S3_* — see docs/ops/BACKUPS.md
name: Backup Postgres

on:
  schedule:
    # 02:15 UTC ≈ 05:15 Minsk (low traffic)
    - cron: "15 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup-postgres
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          HAS_DB: ${{ secrets.BACKUP_DATABASE_URL != '' }}
          HAS_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT != '' }}
          HAS_ACCESS: ${{ secrets.BACKUP_S3_ACCESS_KEY != '' }}
          HAS_SECRET: ${{ secrets.BACKUP_S3_SECRET_KEY != '' }}
          HAS_BUCKET: ${{ secrets.BACKUP_S3_BUCKET != '' }}
        run: |
          missing=""
          [ "$HAS_DB" = "true" ] || missing="$missing BACKUP_DATABASE_URL"
          [ "$HAS_ENDPOINT" = "true" ] || missing="$missing BACKUP_S3_ENDPOINT"
          [ "$HAS_ACCESS" = "true" ] || missing="$missing BACKUP_S3_ACCESS_KEY"
          [ "$HAS_SECRET" = "true" ] || missing="$missing BACKUP_S3_SECRET_KEY"
          [ "$HAS_BUCKET" = "true" ] || missing="$missing BACKUP_S3_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error::Off-site backup is not configured. Add GitHub Actions secrets:$missing. See docs/ops/BACKUPS.md"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 18 client (match Railway PG major for pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          command -v pg_dump
          pg_dump --version

      - name: Install Python deps (boto3)
        run: pip install boto3

      - name: Run backup upload
        env:
          BACKUP_PG_MAJOR: "18"
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_PATH_STYLE: ${{ secrets.BACKUP_S3_PATH_STYLE }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
        run: |
          echo "PATH=$PATH"
          command -v pg_dump
          pg_dump --version
          python scripts/ops/backup_postgres.py

      - name: Alert Telegram on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.BACKUP_ALERT_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.BACKUP_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "BACKUP_ALERT_BOT_TOKEN / BACKUP_ALERT_CHAT_ID not set — skipping Telegram alert"
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Ice Studio: nightly Postgres off-site backup FAILED. ${RUN_URL}" \
            >/dev/null
