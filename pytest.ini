[pytest]
asyncio_mode = auto
# Explicit function scope (pytest-asyncio default for tests). Do not switch to session:
# in-process RateLimiter / similar globals would leak across the whole suite.
# Stale asyncpg pools are cleared in tests/conftest.py::_dispose_global_async_engines.
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
pythonpath = .
addopts = --strict-markers
markers =
    collective: white-label studio (Collective overlay) regression — entitlements, brand, governance, billing
